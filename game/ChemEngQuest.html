        this.prompt(245-cam, 'SPACE   —   take the Reynolds sheet', '#f5b53d');
        if (keyPressed(' ','Enter','Space')){
          G.sheet=true; SFX.pickup(); toast('Reynolds ranges in your pocket.');
        }
      } else if (nearR>=0){
        const r = FLU_RIGS[nearR];
        this.prompt(r.x-cam, 'SPACE   —   work on ' + r.title.split('·')[0].trim(), '#f0a02a');
        if (keyPressed(' ','Enter','Space')) this.openRig(nearR);
      }
      if (this.px > FLU_ROOM-80 && this.rigs.every(r=>r.done)) go(S_hub, 'fade');
    }

    if (this.mutterT>0){ this.mutterT -= dt;
      if (this.mutterT<180) bubble(this.mutter, this.px-cam, this.py-196, {w:300,size:17,pop:1}); }

    if (Hint.draw(76, 150, 210, 250))
      Hint.use('A gas needs a compressor. A liquid needs a pump. Fit the relief valve before you pressurise anything.');

    vignette(.34);
    const n = this.rigs.filter(r=>r.done).length;
    hudEl.textContent = `Piping Circuit Bay   ·   lines ${n}/2   ·   ` +
      (G.sheet ? 'Reynolds sheet in hand' : 'no cheat sheet yet');
  },

  prompt(sx, label, col){
    panel(sx-160, 176, 320, 42, 'rgba(5,22,33,.96)', col, 10);
    txt(label, sx, 198, 16, '#eaf4fa');
  },

  openRig(i){
    SFX.click();
    this.mode='rig'; this.ri=i;
    const st = this.rigs[i];
    st.phase='build';
    if (skill('flu')===2) st.ghost = true;
    this.say(FLU_RIGS[i].brief + (skill('flu')===2 ? '  ' + FLU_RIGS[i].strong
           : skill('flu')===0 ? '  ' + FLU_RIGS[i].weak : ''), 320);
  },

  /* ---------------- the rig view ---------------- */
  drawRig(){
    const rig = FLU_RIGS[this.ri], st = this.rigs[this.ri];

    /* backdrop */
    const bg = g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#0d3145'); bg.addColorStop(1,'#061722');
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    for (let i=0;i<W/48;i++){ g.fillStyle = i%2?'rgba(255,255,255,.015)':'rgba(0,0,0,.05)';
      g.fillRect(i*48,0,24,H); }
    g.fillStyle='#0a2431'; g.fillRect(0,600,W,H-600);
    g.fillStyle='rgba(245,181,61,.35)'; g.fillRect(0,600,W,4);

    txt(rig.title, W/2, 44, 26, '#f5cf8a');

    drawRigLine(st, rig);
    drawParts();

    /* --- phase: build the line --- */
    if (st.phase === 'build'){
      // pipe slots
      PIPE_SEGS.forEach((s,i)=>{
        if (st.placed[i]) return;
        const cx = (s.a[0]+s.b[0])/2, cy = (s.a[1]+s.b[1])/2;
        const w = Math.abs(s.b[0]-s.a[0]) || 34, h = Math.abs(s.b[1]-s.a[1]) || 34;
        const z = zone(cx-w/2-8, cy-h/2-8, w+16, h+16);
        if (z.hover){ g.strokeStyle='#23a6e0'; g.lineWidth=3;
          rr(cx-w/2-8, cy-h/2-8, w+16, h+16, 8); g.stroke(); }
        if (z.clicked){
          st.placed[i]=true; SFX.place();
          for (let k=0;k<10;k++) spawn({x:cx+rnd(-w/2,w/2), y:cy+rnd(-h/2,h/2),
            vx:rnd(-1.6,1.6), vy:rnd(-1.8,-.3), life:rnd(22,40), max:40,
            size:rnd(5,12), col:'rgba(220,226,214,.5)', kind:'puff'});
        }
      });
      const allPipes = st.placed.every(Boolean);
      // flange bolting, only once the pipes are in
      if (allPipes){
        JOINTS.forEach((j,i)=>{
          if (st.bolted[i]) return;
          const z = zone(j[0]-24, j[1]-24, 48, 48);
          g.save();
          g.strokeStyle = z.hover ? '#f5b53d' : `rgba(245,181,61,${.4+Math.sin(T/10+i)*.2})`;
          g.lineWidth = z.hover ? 4 : 2.6;
          g.beginPath(); g.arc(j[0], j[1], 24, 0, 7); g.stroke(); g.restore();
          if (z.clicked){
            st.bolted[i]=true; SFX.bolt();
            for (let k=0;k<7;k++) emitSpark(j[0], j[1], 1, '#ffd88a');
          }
        });
      }
      // relief valve
      if (!st.relief){
        const z = zone(RELIEF_PAD[0]-30, RELIEF_PAD[1]-62, 60, 60);
        if (z.hover){ g.strokeStyle='#f5b53d'; g.lineWidth=3;
          g.beginPath(); g.arc(RELIEF_PAD[0], RELIEF_PAD[1]-34, 28, 0, 7); g.stroke(); }
        if (z.clicked){ st.relief=true; SFX.place(); toast('Relief valve fitted. Good.'); }
      }
      // mover
      if (!st.mover && allPipes && st.bolted.every(Boolean)){
        const z = zone(MOVER_PAD[0]-60, MOVER_PAD[1]-40, 120, 80);
        if (z.hover){ g.strokeStyle='#23a6e0'; g.lineWidth=3;
          rr(MOVER_PAD[0]-60, MOVER_PAD[1]-40, 120, 80, 8); g.stroke(); }
        if (z.clicked) st.phase = 'choose';
      }

      /* the instruction strip */
      const step = !allPipes ? 'Click each dashed run to drop a pipe section in.'
        : !st.bolted.every(Boolean) ? 'Now bolt a flange at every joint. Click the rings.'
        : !st.mover ? 'The line is built but nothing will move on its own. Click the empty pad.'
        : '';
      panel(W/2-420, 86, 840, 58, 'rgba(4,18,28,.94)', 'rgba(35,166,224,.5)');
      txt(step, W/2, 115, 19, '#dceaf2','center',400);

      if (!st.relief) txt('the dashed circle on the top run is a relief valve mount',
                          W/2, 168, 14, 'rgba(245,181,61,.75)','center',400);
    }

    /* --- phase: choose the mover --- */
    if (st.phase === 'choose'){
      shade(.55);
      txt('WHAT GOES ON THE PAD?', W/2, 120, 30, '#f5cf8a');
      txt(rig.fluid === 'gas' ? 'this line carries gas' : 'this line carries water',
          W/2, 156, 19, '#cfe6f2','center',400);
      const n=FLU_MOVERS.length, cw=300, gap=24, x0=(W-(n*cw+(n-1)*gap))/2;
      FLU_MOVERS.forEach((m,i)=>{
        const x=x0+i*(cw+gap), y=230, h=280;
        const z = zone(x,y,cw,h);
        const ghost = st.ghost && m.id===rig.right;
        const bad = skill('flu')===0 && m.id===rig.weakPick;
        g.save(); if (z.hover){ g.shadowColor='#23a6e0'; g.shadowBlur=22; }
        g.fillStyle = z.hover ? 'rgba(14,52,72,.98)' : 'rgba(7,28,40,.96)';
        rr(x, z.hover?y-5:y, cw, h, 12); g.fill(); g.restore();
        g.strokeStyle = ghost ? `rgba(63,208,127,${.5+Math.sin(T/10)*.35})`
                      : bad ? `rgba(238,95,110,${.45+Math.sin(T/10)*.3})`
                      : z.hover ? '#23a6e0' : 'rgba(35,166,224,.3)';
        g.lineWidth = (ghost||bad) ? 3.4 : 2;
        rr(x, z.hover?y-5:y, cw, h, 12); g.stroke();
        const yy = z.hover?y-5:y;
        g.save(); g.translate(x+cw/2, yy+206); g.scale(1.25,1.25);
        m.draw(0,0,1,{ spin: z.hover ? T*0.3 : 0 }); g.restore();
        txt(m.name, x+cw/2, yy+230, 19, z.hover?'#fff':'#cfe6f2');
        txt(m.sub,  x+cw/2, yy+252, 14, 'rgba(159,216,239,.7)','center',400);
        if (z.clicked){ st.mover = m.id; st.phase='build'; SFX.place();
          st.moverOK = (m.id === rig.right);
          for (let k=0;k<14;k++) spawn({x:MOVER_PAD[0]+rnd(-50,50), y:MOVER_PAD[1]+rnd(-20,30),
            vx:rnd(-2,2), vy:rnd(-2.4,-.4), life:rnd(24,44), max:44,
            size:rnd(6,14), col:'rgba(220,226,214,.5)', kind:'puff'});
        }
      });
      if (button('BACK', 40, H-64, 160, 44)) st.phase='build';
      return;
    }

    /* --- the start button --- */
    const ready = st.placed.every(Boolean) && st.bolted.every(Boolean) && st.mover;
    if (st.phase === 'build' && ready){
      if (button('START THE LINE', W/2-140, H-72, 280, 48, {col:'#3fd07f', size:20})){
        st.phase='run'; st.power=0; st.flow=0; SFX.click(); this.noteT = 0;
        if (!st.relief) this.say('No relief valve on a line you are about to pressurise. Noted.', 200);
      }
    }

    /* --- phase: run and ramp --- */
    if (st.phase === 'run'){
      st.spin += dt * st.power * 0.34;
      // the mover only actually moves the fluid if it is the right one
      const target = st.moverOK ? st.power : st.power * 0.06;
      st.flow += (target - st.flow) * 0.08 * dt;

      // readouts
      const Re = Math.round(st.flow * rig.reVal * 1.12);
      panel(W/2-370, 76, 740, 100, 'rgba(4,18,28,.95)', 'rgba(35,166,224,.5)');
      txt('POWER', W/2-232, 102, 13, '#9fd8ef');
      g.fillStyle='rgba(255,255,255,.1)'; rr(W/2-292, 118, 240, 16, 8); g.fill();
      g.fillStyle = st.power>0.82 ? '#ee5f6e' : '#3fd07f';
      rr(W/2-292, 118, 240*clamp(st.power,0,1), 16, 8); g.fill();
      g.strokeStyle='rgba(63,208,127,.85)'; g.lineWidth=2;
      g.strokeRect(W/2-292+240*0.55, 115, 240*0.27, 22);
      txt('hold it in the green', W/2-172, 150, 12, 'rgba(159,216,239,.6)','center',400);

      txt('FLOW', W/2+92, 100, 13, '#9fd8ef');
      txt(st.flow < .05 ? 'stopped' : Math.round(st.flow*100)+' %',
          W/2+92, 128, 22, st.flow<.05 ? '#ee5f6e' : '#8fe8b8');
      txt('REYNOLDS', W/2+248, 100, 13, '#9fd8ef');
      txt(st.flow<.05 ? '—' : Re.toLocaleString(), W/2+248, 128, 22, '#f5cf8a');

      // ramp controls
      if (button('–', W/2-350, 106, 46, 40, {size:24})) st.power = clamp(st.power-0.08,0,1);
      if (button('+', W/2-42,  106, 46, 40, {size:24})) st.power = clamp(st.power+0.08,0,1);
      if (keys.ArrowUp)   st.power = clamp(st.power + 0.012*dt, 0, 1);
      if (keys.ArrowDown) st.power = clamp(st.power - 0.012*dt, 0, 1);

      // over-pressure
      st.venting = st.power > 0.88;
      if (st.venting){
        shake(2.4);
        if (!st.relief){ if (Math.random()<.05) SFX.alarm(); flash(.08,'255,80,80'); }
      }

      // the wrong mover behaves badly and says so
      if (!st.moverOK && st.power > 0.2){
        if (Math.random()<.06) SFX.bad();
        txt(rig.right==='comp' ? 'the pump is cavitating, it has nothing to grip'
                               : 'the compressor is slamming against solid water',
            W/2, 220, 19, '#ee5f6e','center',400);
        if (Math.random()<.3) emitSpark(MOVER_PAD[0]+rnd(-20,20), MOVER_PAD[1]+10, 1, '#ff9a6a');
        shake(1.6);
      }

      const inBand = st.power >= 0.55 && st.power <= 0.82;
      const flowing = st.moverOK && inBand && st.flow > 0.5;

      if (!st.moverOK && st.power > 0.5 && !st.tried){
        st.tried = true;
        if (skill('flu') >= 1) { st.ghost = true;
          this.say('That is the wrong machine for this fluid. I can see what it should be now.', 240); }
        else this.say('Why is it not moving? It is plugged in. It is spinning. I am out of ideas.', 240);
      }

      if (flowing && !st.reAsk){
        st.reAsk = true;
        after(40, ()=>{ st.phase='re'; });
      }

      panel(W/2-420, H-104, 840, 56, 'rgba(4,18,28,.94)', 'rgba(35,166,224,.5)');
      txt(!st.moverOK ? 'this is not working. Put the right machine on the pad.'
          : st.power < 0.55 ? 'not enough power. Ramp it up.'
          : st.power > 0.82 ? 'too much. You are lifting the relief valve. Back it off.'
          : 'that is the band. Hold it there.',
          W/2, H-76, 19,
          !st.moverOK ? '#ee5f6e' : (st.power>=0.55 && st.power<=0.82) ? '#8fe8b8' : '#f5cf8a',
          'center', 400);

      if (!st.moverOK && button('SWAP THE MACHINE', 40, H-72, 250, 44, {col:'#ee5f6e', size:16})){
        st.phase='choose'; st.power=0; st.flow=0;
      }
      if (button('STOP', W-190, H-72, 150, 44, {size:16})){ st.phase='build'; st.power=0; st.flow=0; }
    }

    /* --- phase: tick the Reynolds box --- */
    if (st.phase === 're'){
      shade(.6);
      const Re = Math.round(rig.reVal);
      txt('THE LINE IS RUNNING', W/2, 88, 30, '#3fd07f');
      txt('measured Reynolds number   ' + Re.toLocaleString(), W/2, 128, 22, '#f5cf8a','center',400);
      if (G.sheet){
        cheatSheet(W/2, 330, 1.35, st.re);
        ['laminar','transition','turbulent'].forEach((k,i)=>{
          const z = zone(W/2-152, 268 + i*43, 300, 40);
          if (z.hover){ g.strokeStyle='#23a6e0'; g.lineWidth=2.4;
            rr(W/2-152, 268+i*43, 300, 40, 6); g.stroke(); }
          if (z.clicked && !st.re){
            st.re = k; SFX.click();
            if (k === rig.re){ this.pts += 1; SFX.good(); toast('Correct regime.'); }
            else { SFX.bad(); toast('Not that one. Check the ranges.'); }
            after(70, ()=> this.finishRig());
          }
        });
        txt('click a row to tick it', W/2, 470, 15, 'rgba(207,230,242,.6)','center',400);
      } else {
        panel(W/2-320, 250, 640, 130, 'rgba(48,26,10,.95)', 'rgba(245,181,61,.6)');
        txt('You never picked up the cheat sheet.', W/2, 292, 22, '#f5cf8a');
        txt('No ranges, no regime, no bonus. It is on the table by the door.',
            W/2, 328, 17, '#dceaf2','center',400);
        if (button('FINE', W/2-90, 400, 180, 44)) this.finishRig();
      }
      return;
    }

    /* the engineer's running commentary, as a caption along the bottom */
    if (this.noteT > 0){
      this.noteT -= dt;
      const cw = 700, cx = W/2 - cw/2, cy = H - 214;
      panel(cx, cy, cw, 58, 'rgba(4,18,28,.96)', 'rgba(35,166,224,.55)');
      const nw = 14 + hero.name.length * 8.4;
      g.fillStyle = 'rgba(35,166,224,.92)';
      rr(cx + 18, cy - 12, nw, 22, 7); g.fill();
      txt(hero.name, cx + 18 + nw/2, cy - 1, 14, '#04121a');
      wrapText(this.note, cx + 24, cy + 29, cw - 48, 21, 17, '#dceaf2', 'left', 400);
    }

    if (Hint.draw(W-80, 150, W-220, 250))
      Hint.use(rig.fluid==='gas'
        ? 'Gas is compressible. The machine that moves it is named after that.'
        : 'Water will not compress. It has to be pushed, not squeezed.');

    if (st.phase === 'build' && button('LEAVE THE RIG', 40, H-72, 200, 44, {size:16})){
      this.mode='free';
    }
    hudEl.textContent = rig.title + '   ·   ' +
      (st.placed.filter(Boolean).length + '/5 pipes, ' +
       st.bolted.filter(Boolean).length + '/6 flanges' +
       (st.relief ? ', relief fitted' : ', no relief valve'));
  },

  finishRig(){
    const st = this.rigs[this.ri], rig = FLU_RIGS[this.ri];
    st.done = true;
    if (st.moverOK) this.pts += 2;
    this.pts += 1;                       // held the line in the band
    if (st.relief) this.safePts += 1;
    st.phase='build';
    this.mode='free';
    SFX.great();
    toast(rig.title.split('·')[0].trim() + ' is running.');
    if (this.rigs.every(r=>r.done)) toast('Both lines running. Fadi can breathe again.');
  }
};

/* ============================================================
   Thermal Exchange Hall — triage, then fix, then read the path
   ============================================================ */
const HEA_PLANTS = [
  { id:'hot',  x:360,  name:'SKID A', base:191, swing:7,  need:'cool',
    danger:'high',
    line:'Skid A is at 191 and still climbing. The lagging is scorched.',
    wrongLine:'You put a heater on a skid that was already cooking. It is now a small sun.' },
  { id:'cold', x:940,  name:'SKID B', base:14,  swing:3.4, need:'heat',
    danger:'low',
    line:'Skid B has drifted down to 14. Sluggish, but nobody is getting hurt.',
    wrongLine:'You cooled a skid that was already too cold. The line is frosting over.' }
];

const HEA_PATH = [
  { label:'the furnace, across an air gap', right:'radiation',
    why:'No contact and no flow. Energy crosses the gap as radiation.' },
  { label:'through the solid steel wall',   right:'conduction',
    why:'Straight through a solid. Conduction.' },
  { label:'the still film clinging to the wall', right:'conduction',
    why:'The film is not going anywhere. Heat crawls through it by conduction.' },
  { label:'the fluid rushing down the pipe', right:'convection',
    why:'The fluid carries the heat away with it. Convection.' }
];
const HEA_MODES = ['conduction','convection','radiation'];

/* one segment of the heat-path cross-section */
function pathArt(kind, x, y, w, h, live){
  g.save();
  g.beginPath(); rr(x, y, w, h, 8); g.clip();
  if (kind === 0){          // furnace across a gap
    g.fillStyle='#170e12'; g.fillRect(x,y,w,h);
    // firebox
    g.fillStyle='#43201a'; rr(x+6, y+12, 48, h-24, 6); g.fill();
    g.fillStyle='#160b09'; rr(x+12, y+20, 36, h-40, 4); g.fill();
    g.strokeStyle='#6a3426'; g.lineWidth=2.4; rr(x+6, y+12, 48, h-24, 6); g.stroke();
    // a real fire inside it
    for (let i=0;i<9;i++) emitFireStatic(x+30, y+h-34, i);
    g.fillStyle='rgba(255,150,60,.35)';
    g.beginPath(); g.ellipse(x+30, y+h/2, 30, h/2, 0, 0, 7); g.fill();
    // the glow it throws across the gap
    const gl = g.createLinearGradient(x+54, 0, x+w, 0);
    gl.addColorStop(0,'rgba(255,150,70,.30)'); gl.addColorStop(1,'rgba(255,150,70,0)');
    g.fillStyle = gl; g.fillRect(x+54, y, w-54, h);
    // radiating wavefronts
    for (let i=0;i<4;i++){
      const ph = (T*1.5 + i*30) % 120;
      g.strokeStyle = `rgba(255,205,130,${0.95*(1-ph/120)})`;
      g.lineWidth = 3;
      g.beginPath();
      for (let k=0;k<=26;k++){
        const px = x+58+ph*0.72 + k*2.1;
        if (px > x+w-6) break;
        g.lineTo(px, y+h/2 - 30 + i*20 + Math.sin(k/2.4 + T/6)*5);
      }
      g.stroke();
    }
    txt('FURNACE', x+30, y+h-12, 11, 'rgba(255,190,140,.8)');
    txt('air gap', x+w-52, y+18, 11, 'rgba(255,205,150,.55)');
  }
  else if (kind === 1){     // solid steel wall
    const grd = g.createLinearGradient(x,0,x+w,0);
    grd.addColorStop(0,'#c05a2a'); grd.addColorStop(1,'#5d7a90');
    g.fillStyle='#8d9aa4'; g.fillRect(x,y,w,h);
    g.fillStyle=grd; g.globalAlpha=.55; g.fillRect(x,y,w,h); g.globalAlpha=1;
    for (let i=0;i<7;i++){
      g.strokeStyle='rgba(255,255,255,.12)'; g.lineWidth=1.4;
      g.beginPath(); g.moveTo(x, y+i*h/7); g.lineTo(x+w, y+i*h/7); g.stroke();
    }
    // heat marching through the lattice
    for (let i=0;i<16;i++){
      const px = x + ((T*1.1 + i*17) % w);
      const py = y + 14 + nz(i)*(h-28);
      g.fillStyle='rgba(255,170,90,.85)';
      g.beginPath(); g.arc(px, py, 3, 0, 7); g.fill();
    }
    txt('STEEL', x+w/2, y+h-14, 12, 'rgba(255,255,255,.5)');
  }
  else if (kind === 2){     // stagnant film
    g.fillStyle='#173d4e'; g.fillRect(x,y,w,h);
    g.fillStyle='rgba(120,200,240,.30)'; g.fillRect(x,y,w,h);
    // molecules that jiggle in place and go nowhere
    for (let i=0;i<26;i++){
      const px = x + 10 + nz(i)*(w-20) + Math.sin(T/9 + i*2)*1.8;
      const py = y + 10 + nz(i+30)*(h-20) + Math.cos(T/11 + i)*1.8;
      g.fillStyle='rgba(190,235,255,.85)';
      g.beginPath(); g.arc(px, py, 2.6, 0, 7); g.fill();
    }
    txt('STILL FILM', x+w/2, y+h-14, 12, 'rgba(200,235,250,.6)');
  }
  else {                    // flowing fluid
    g.fillStyle='#0f3448'; g.fillRect(x,y,w,h);
    liquid(x, y+10, w, h-20, {r:0, c1:'#1f6f9c', c2:'#3fb8e0', surface:false});
    for (let i=0;i<16;i++){
      const px = x + ((T*3.4 + i*19) % (w+30)) - 15;
      const py = y + 14 + nz(i)*(h-28);
      g.fillStyle='rgba(255,190,110,.95)';
      g.beginPath(); g.ellipse(px, py, 6.5, 2.8, 0, 0, 7); g.fill();
    }
    txt('FLOWING', x+w/2, y+h-14, 12, 'rgba(210,240,255,.65)');
  }
  g.restore();
  g.strokeStyle = live ? '#f5b53d' : 'rgba(35,166,224,.4)';
  g.lineWidth = live ? 3 : 2; rr(x, y, w, h, 8); g.stroke();
}
/* a small always-on flame for the furnace panel */
function emitFireStatic(x, y, i){
  const ph = (T*2.2 + i*19) % 62;
  g.fillStyle = `rgba(255,${150+Math.floor(nz(i)*95)},60,${0.9*(1-ph/62)})`;
  g.beginPath();
  g.arc(x + Math.sin(T/7+i*1.7)*7, y - ph*1.5, 11 - ph*0.13, 0, 7);
  g.fill();
}

const S_hea = {
  enter(){
    Music.play('work');
    Hint.begin('hea');
    this.px=70; this.py=612; this.face='right'; this.walkT=0; this.stepT=0;
    this.mode='walkin';
    this.st = HEA_PLANTS.map(p=>({ device:null, ok:false, temp:p.base }));
    this.firstTreated = null;
    this.pi = -1;
    this.pathAns = [null,null,null,null];
    this.pathLive = -1;
    this.trim = 0.2; this.trimDone = false;
    this.pts = 0; this.safePts = 0; this.scored = false;
    this.note = null; this.noteT = 0;
    this.mutter = mutterFor('hea'); this.mutterT = 210;
    after(60, ()=>{ this.mode='free'; });
  },
  exit(){
    if (!this.scored){ this.scored = true;
      award('hea', this.pts, 7); award('saf', this.safePts, 1);
      if (this.trimDone) G.done.hea = true; }
  },
  say(t, f=240){ this.note=t; this.noteT=f; },
  bothFixed(){ return this.st.every(s=>s.device && s.ok); },

  draw(){
    if (this.mode === 'path')  { this.drawPath();  return; }
    if (this.mode === 'trim')  { this.drawTrim();  return; }

    /* ---------------- the hall ---------------- */
    const bg = g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#3a2114'); bg.addColorStop(.55,'#24150f'); bg.addColorStop(1,'#140c0a');
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    for (let i=0;i<W/54;i++){ g.fillStyle = i%2?'rgba(255,255,255,.014)':'rgba(0,0,0,.05)';
      g.fillRect(i*54,0,27,614); }
    for (let i=0;i<4;i++)
      pipeSeg(0, 42+i*20, W, 42+i*20, 13, {shell: i%2?'#7a4a32':'#6a5a4a', inner:'#3e2a1e'});
    flowDots([[0,42],[W,42]], 1.4, .5, 'rgba(255,190,120,.5)', 3);

    const fl = g.createLinearGradient(0,614,0,H);
    fl.addColorStop(0,'#2e1c14'); fl.addColorStop(1,'#130b09');
    g.fillStyle=fl; g.fillRect(0,614,W,H-614);
    g.fillStyle='rgba(245,181,61,.35)'; g.fillRect(0,616,W,4);
    for (let i=0;i<W/60;i++){ g.strokeStyle='rgba(255,255,255,.025)'; g.lineWidth=2;
      g.beginPath(); g.moveTo(i*60,620); g.lineTo(i*60-70,H); g.stroke(); }

    /* ---------------- the two skids ---------------- */
    let nearP = -1;
    HEA_PLANTS.forEach((p,i)=>{
      const st = this.st[i];
      // the live temperature wanders, and settles once treated
      const target = st.ok ? 78 : p.base;
      st.temp += (target - st.temp) * 0.012 * dt + Math.sin(T/13 + i*3)*p.swing*0.018*dt;
      const shown = st.temp + Math.sin(T/9 + i*2.2)*p.swing*0.5 + Math.sin(T/3.1+i)*p.swing*0.18;

      const tooHot = shown > 140, tooCold = shown < 40;

      // skid body
      g.fillStyle = tooHot ? '#5a2a1c' : tooCold ? '#1d3a52' : '#2f4230';
      rr(p.x-140, 232, 280, 226, 10); g.fill();
      g.strokeStyle = st.ok ? '#3fd07f' : tooHot ? '#ee5f6e' : '#5aa8e0';
      g.lineWidth = 3; rr(p.x-140, 232, 280, 226, 10); g.stroke();
      // vessels inside
      g.save(); g.beginPath(); rr(p.x-136, 236, 272, 218, 8); g.clip();
      g.fillStyle='rgba(0,0,0,.28)'; g.fillRect(p.x-136,236,272,218);
      for (let v=0; v<2; v++){
        const vx = p.x - 60 + v*110;
        g.fillStyle = tooHot ? '#b0603c' : tooCold ? '#7fa8c8' : '#9aa8a0';
        rr(vx-30, 282, 60, 166, 8); g.fill();
        g.fillStyle='rgba(0,0,0,.18)'; rr(vx+10, 282, 20, 166, 7); g.fill();
        g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=1.6;
        for (let k=1;k<4;k++){ g.beginPath(); g.moveTo(vx-30, 282+k*42); g.lineTo(vx+30, 282+k*42); g.stroke(); }
      }
      pipeSeg(p.x-90, 264, p.x+50, 264, 14, {shell:'#8a7a6a', inner:'#4e433a'});
      // heat or frost signature
      if (tooHot){
        if (Math.random()<.55) emitSmoke(p.x + rnd(-70,70), 248, 1, 'rgba(90,50,40,.45)');
        g.fillStyle=`rgba(255,110,60,${0.06+Math.sin(T/8)*0.03})`; g.fillRect(p.x-136,236,272,218);
      }
      if (tooCold){
        if (Math.random()<.35) emitFrost(p.x + rnd(-80,80), rnd(272,446), 1);
        g.fillStyle='rgba(190,230,255,.10)'; g.fillRect(p.x-136,236,272,218);
      }
      g.restore();

      // plinth, so the skid sits on the floor behind the walkway
      g.fillStyle='rgba(0,0,0,.35)'; rr(p.x-152, 458, 304, 16, 4); g.fill();
      g.fillStyle='#1b1410'; rr(p.x-150, 456, 300, 13, 4); g.fill();

      // the gauge, fluctuating
      gauge(p.x, 164, 42, shown, 0, 220, null, {
        readout: shown.toFixed(1) + '°',
        zones: [[0,.18,'#5aa8d8'],[.18,.55,'#3fd07f'],[.55,1,'#ee5f6e']]
      });
      panel(p.x-76, 92, 152, 32, 'rgba(8,4,4,.9)',
            st.ok ? 'rgba(63,208,127,.6)' : 'rgba(245,181,61,.5)', 7);
      txt(p.name, p.x, 108, 15, st.ok ? '#8fe8b8' : '#f5cf8a');

      // the fitted device
      if (st.device === 'heat')      unitHeater(p.x+180, 612, 1.05, {run:true});
      else if (st.device === 'cool') unitCooler(p.x+180, 612, 1.05, {run:true});
      else {
        g.save();
        g.strokeStyle=`rgba(245,181,61,${.35+Math.sin(T/12+i)*.18})`; g.lineWidth=3;
        g.setLineDash([9,8]);
        rr(p.x+128, 536, 104, 76, 8); g.stroke();
        g.setLineDash([]); g.restore();
        txt('?', p.x+180, 574, 30, 'rgba(245,181,61,.65)');
      }

      if (this.mode==='free' && !st.ok && Math.abs(this.px - p.x) < 150) nearP = i;
    });

    drawParts();
    drawPerson(hero, this.px, this.py, 2.0, {
      dir:this.face, walk:this.walkT, seed:5,
      face: this.st.some((s,i)=>!s.ok && HEA_PLANTS[i].danger==='high') ? 'worry' : 'neutral',
      ppe:{ hat:true, goggles:G.ppe.goggles, coat:G.ppe.coat }
    });

    /* ---------------- movement ---------------- */
    if (this.mode==='walkin'){
      this.px += 3.2*dt; this.walkT += dt*2.4;
      this.stepT+=dt; if (this.stepT>12){this.stepT=0;SFX.step();}
    } else if (this.mode==='free'){
      let dx=0,dy=0;
      if (keys.ArrowLeft||keys.a||keys.A) dx--;
      if (keys.ArrowRight||keys.d||keys.D) dx++;
      if (keys.ArrowUp||keys.w||keys.W) dy--;
      if (keys.ArrowDown||keys.s||keys.S) dy++;
      if (dx) this.face = dx>0?'right':'left';
      if ((dx||dy) && !trans){
        this.px = clamp(this.px + dx*3.6*dt, 46, W-46);
        this.py = clamp(this.py + dy*1.9*dt, 594, 678);
        this.walkT += dt*2.4;
        this.stepT+=dt; if (this.stepT>12){this.stepT=0;SFX.step();}
      } else this.walkT=0;

      if (nearP >= 0){
        const p = HEA_PLANTS[nearP];
        panel(p.x-170, 470, 340, 42, 'rgba(8,4,4,.96)', '#ff7a3a', 10);
        txt('SPACE   —   deal with ' + p.name, p.x, 492, 16, '#eaf4fa');
        if (keyPressed(' ','Enter','Space')) this.openPlant(nearP);
      }
      if (this.bothFixed() && !this.pathDone){
        panel(W/2-260, 664, 520, 44, 'rgba(8,4,4,.96)', '#f5b53d', 10);
        txt('SPACE  —  both skids steady, now trace where the heat goes', W/2, 686, 17, '#f5cf8a','center',400);
        if (keyPressed(' ','Enter','Space')) { this.mode='path'; SFX.click(); }
      }
    }

    /* ---------------- choose a device ---------------- */
    if (this.mode === 'plant'){
      const p = HEA_PLANTS[this.pi], st = this.st[this.pi];
      shade(.62);
      txt(p.name, W/2, 84, 32, '#f5cf8a');
      txt(p.line, W/2, 122, 21, '#e8d8cc','center',400);
      const opts = [
        { id:'heat', name:'Heater',  sub:'a flamethrower on a stand', draw:unitHeater },
        { id:'cool', name:'Cooler',  sub:'an air conditioner, basically', draw:unitCooler }
      ];
      opts.forEach((o,i)=>{
        const cw=340, gap=40, x0=(W-(2*cw+gap))/2;
        const x=x0+i*(cw+gap), y=200, h=300;
        const z = zone(x,y,cw,h);
        g.save(); if (z.hover){ g.shadowColor='#ff7a3a'; g.shadowBlur=24; }
        g.fillStyle = z.hover ? 'rgba(60,28,16,.98)' : 'rgba(26,14,10,.96)';
        rr(x, z.hover?y-5:y, cw, h, 12); g.fill(); g.restore();
        g.strokeStyle = z.hover ? '#ff7a3a' : 'rgba(255,122,58,.32)';
        g.lineWidth=2; rr(x, z.hover?y-5:y, cw, h, 12); g.stroke();
        const yy = z.hover?y-5:y;
        g.save(); g.translate(x+cw/2, yy+220); g.scale(1.5,1.5);
        o.draw(0,0,1,{run:z.hover}); g.restore();
        txt(o.name, x+cw/2, yy+248, 22, z.hover?'#fff':'#e8d8cc');
        txt(o.sub,  x+cw/2, yy+272, 14, 'rgba(232,216,204,.6)','center',400);
        if (z.clicked) this.fit(o.id);
      });
      if (button('NOT YET', W/2-90, H-72, 180, 44, {size:16})) this.mode='free';
    }

    if (this.noteT > 0){
      this.noteT -= dt;
      const cw=720, cx=W/2-cw/2, cy=H-128;
      panel(cx, cy, cw, 60, 'rgba(8,4,4,.96)', 'rgba(245,181,61,.55)');
      wrapText(this.note, cx+24, cy+30, cw-48, 21, 17, '#e8d8cc','left',400);
    }
    if (this.mutterT>0 && this.mode==='free'){ this.mutterT -= dt;
      if (this.mutterT<180) bubble(this.mutter, this.px, this.py-196, {w:300,size:17,pop:1}); }

    if (Hint.draw(76, 150, 210, 250))
      Hint.use('Treat the dangerous one first. A cold line is a nuisance. A runaway hot one is a hazard.');

    vignette(.4);
    hudEl.textContent = 'Thermal Exchange Hall   ·   ' +
      this.st.filter(s=>s.ok).length + '/2 skids steady';
  },

  openPlant(i){ SFX.click(); this.mode='plant'; this.pi=i; },

  fit(deviceId){
    const p = HEA_PLANTS[this.pi], st = this.st[this.pi];
    st.device = deviceId;
    st.ok = (deviceId === p.need);
    SFX.place();
    for (let k=0;k<16;k++) spawn({ x:p.x+180+rnd(-40,40), y:600+rnd(-20,20),
      vx:rnd(-2,2), vy:rnd(-2.4,-.4), life:rnd(24,46), max:46,
      size:rnd(6,14), col:'rgba(220,210,196,.5)', kind:'puff' });

    if (this.firstTreated === null){
      this.firstTreated = p.id;
      if (p.danger === 'high'){
        this.safePts = 1;
        this.say('The hot one first. If that had run away, the cold skid would have been the least of it.');
        toast('Good triage.');
      } else {
        this.say('You warmed the sluggish one while the other skid sat at 191 and climbing. Wrong order.');
        toast('Hot line first, next time.');
      }
    }
    if (st.ok){ this.pts += 1; SFX.good(); }
    else { SFX.bad(); G.blunders++; this.say(p.wrongLine); }
    this.mode='free';
  },

  /* ---------------- heat path quiz ---------------- */
  drawPath(){
    const bg = g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#241610'); bg.addColorStop(1,'#0f0908');
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    txt('FOLLOW THE HEAT', W/2, 56, 32, '#f5cf8a');
    txt('from the furnace on the left to the fluid on the right, name each step',
        W/2, 92, 18, 'rgba(232,216,204,.7)','center',400);

    const segW = 250, gap = 24, x0 = (W - (4*segW + 3*gap))/2, y = 150, h = 190;
    HEA_PATH.forEach((p,i)=>{
      const x = x0 + i*(segW+gap);
      pathArt(i, x, y, segW, h, this.pathAns[i] === null);
      wrapText(p.label, x+segW/2, y+h+26, segW-10, 19, 15, '#e8d8cc','center',400);

      HEA_MODES.forEach((m,k)=>{
        const bw = segW, bh = 36, bx = x, by = y+h+62+k*42;
        const chosen = this.pathAns[i] === m;
        const locked = this.pathAns[i] !== null;
        const right = (m === p.right);
        const z = zone(bx,by,bw,bh);
        g.fillStyle = chosen ? (right ? 'rgba(20,70,48,.98)' : 'rgba(70,20,26,.98)')
                    : locked ? 'rgba(24,16,14,.7)'
                    : z.hover ? 'rgba(62,32,18,.98)' : 'rgba(26,16,12,.94)';
        rr(bx,by,bw,bh,8); g.fill();
        g.strokeStyle = chosen ? (right ? '#3fd07f' : '#ee5f6e')
                      : locked ? 'rgba(120,100,90,.25)'
                      : z.hover ? '#ff7a3a' : 'rgba(255,122,58,.28)';
        g.lineWidth = chosen ? 2.6 : 1.8; rr(bx,by,bw,bh,8); g.stroke();
        txt(m, bx+bw/2, by+bh/2, 17,
            chosen ? (right?'#8fe8b8':'#f0b0bc') : locked ? 'rgba(200,185,175,.35)' : '#e8d8cc');
        if (z.clicked && !locked){
          this.pathAns[i] = m;
          if (right){ this.pts += 1; SFX.good(); } else { SFX.bad(); }
          this.say(p.why, 200);
        }
      });
    });

    if (this.noteT > 0){
      this.noteT -= dt;
      const cw=760, cx=W/2-cw/2, cy=H-78;
      panel(cx, cy, cw, 52, 'rgba(8,4,4,.96)', 'rgba(245,181,61,.55)');
      txt(this.note, W/2, cy+27, 18, '#f5e0c8','center',400);
    }

    if (this.pathAns.every(a=>a!==null)){
      if (this.noteT <= 0 && button('NOW TRIM THE COOLER', W/2-160, H-70, 320, 46,
                                    {col:'#3fd07f', size:19})){
        this.mode='trim'; this.pathDone=true; SFX.click();
      }
    }
    hudEl.textContent = 'Thermal Exchange Hall   ·   heat path ' +
      this.pathAns.filter(a=>a!==null).length + '/4';
  },

  /* ---------------- steady-state trim ---------------- */
  drawTrim(){
    const st = this.st[0];
    const bg = g.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#241610'); bg.addColorStop(1,'#0f0908');
    g.fillStyle=bg; g.fillRect(0,0,W,H);
    txt('HOLD SKID A AT STEADY STATE', W/2, 56, 30, '#f5cf8a');
    txt('too little cooling and it climbs, too much and you overshoot',
        W/2, 92, 18, 'rgba(232,216,204,.7)','center',400);

    /* the skid reacts to the trim */
    const equilibrium = 200 - this.trim * 190;
    st.temp += (equilibrium - st.temp) * 0.05 * dt;
    const shown = st.temp + Math.sin(T/7)*1.6 + Math.sin(T/2.6)*0.5;
    const good = shown > 74 && shown < 92;

    // the vessel
    g.fillStyle = shown>140 ? '#5a2a1c' : shown<50 ? '#1d3a52' : '#2f4230';
    rr(W/2-190, 170, 380, 280, 12); g.fill();
    g.strokeStyle = good ? '#3fd07f' : shown>140 ? '#ee5f6e' : '#5aa8e0';
    g.lineWidth=3; rr(W/2-190, 170, 380, 280, 12); g.stroke();
    g.save(); g.beginPath(); rr(W/2-186, 174, 372, 272, 10); g.clip();
    g.fillStyle='rgba(0,0,0,.3)'; g.fillRect(W/2-186,174,372,272);
    for (let v=0;v<2;v++){
      const vx = W/2 - 80 + v*160;
      g.fillStyle = shown>140 ? '#b0603c' : shown<50 ? '#7fa8c8' : '#9aa8a0';
      rr(vx-40, 210, 80, 210, 9); g.fill();
      g.fillStyle='rgba(0,0,0,.2)'; rr(vx+14, 210, 26, 210, 8); g.fill();
    }
    if (shown>140 && Math.random()<.5) emitSmoke(W/2+rnd(-120,120), 190, 1, 'rgba(90,50,40,.5)');
    if (shown<50 && Math.random()<.4) emitFrost(W/2+rnd(-140,140), rnd(210,420), 1);
    g.restore();
    unitCooler(W/2+250, 450, 1.3, {run:this.trim>0.05});
    drawParts();

    gauge(W/2, 520, 54, shown, 0, 220, null, {
      readout: shown.toFixed(1)+'°',
      zones: [[0,.20,'#5aa8d8'],[.20,.48,'#3fd07f'],[.48,1,'#ee5f6e']] });

    // trim slider
    txt('COOLING DUTY', W/2, 600, 14, '#9fd8ef');
    g.fillStyle='rgba(255,255,255,.1)'; rr(W/2-200, 614, 400, 18, 9); g.fill();
    g.fillStyle = good ? '#3fd07f' : '#5aa8e0';
    rr(W/2-200, 614, 400*clamp(this.trim,0,1), 18, 9); g.fill();
    g.strokeStyle='rgba(63,208,127,.7)'; g.lineWidth=2;
    g.strokeRect(W/2-200+400*0.565, 611, 400*0.095, 24);
    if (button('–', W/2-262, 608, 46, 32, {size:22})) this.trim = clamp(this.trim-0.03,0,1);
    if (button('+', W/2+216, 608, 46, 32, {size:22})) this.trim = clamp(this.trim+0.03,0,1);
    if (keys.ArrowRight) this.trim = clamp(this.trim + 0.006*dt, 0, 1);
    if (keys.ArrowLeft)  this.trim = clamp(this.trim - 0.006*dt, 0, 1);

    txt(good ? 'that is steady state. Hold it.'
       : shown > 92 ? 'still too hot. More cooling.'
       : 'you have overcooled it. Ease off.',
       W/2, 660, 20, good ? '#8fe8b8' : '#f5cf8a','center',400);

    if (good) this.holdT = (this.holdT||0) + dt; else this.holdT = 0;
    g.fillStyle='rgba(63,208,127,.25)';
    g.fillRect(W/2-120, 678, 240*clamp((this.holdT||0)/90,0,1), 6);

    if ((this.holdT||0) > 90 && !this.trimDone){
      this.trimDone = true; this.pts += 1; SFX.great();
      toast('Steady. Both skids are yours.');
      after(70, ()=>{ G.done.hea = true; go(S_hub, 'fade'); });
    }
    hudEl.textContent = 'Thermal Exchange Hall   ·   trimming to steady state';
  }
};

/* ---------- break room furniture ---------- */
function couch(x, y, s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(0,2,120,12,0,0,7); g.fill();
  g.fillStyle='#4a5f72'; rr(-118,-96,236,74,14); g.fill();          // back
  g.fillStyle='#5a7186'; rr(-118,-40,236,42,10); g.fill();          // seat
  g.fillStyle='#3d5164'; rr(-126,-58,24,58,8); g.fill();            // arms
  g.fillStyle='#3d5164'; rr(102,-58,24,58,8); g.fill();
  g.strokeStyle='rgba(0,0,0,.18)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(-40,-96); g.lineTo(-40,-24); g.moveTo(40,-96); g.lineTo(40,-24); g.stroke();
  g.fillStyle='#2f4050'; rr(-104,0,16,14,3); g.fill(); rr(88,0,16,14,3); g.fill();
  g.restore();
}
function vending(x, y, s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#2a3f4e'; rr(-52,-190,104,190,8); g.fill();
  g.fillStyle='#16303e'; rr(-44,-178,66,140,5); g.fill();
  for (let r=0;r<4;r++) for (let c=0;c<3;c++){
    g.fillStyle = ['#e0566a','#3fb27f','#f0a02a','#5f7ae0'][(r+c)%4];
    rr(-40+c*21, -172+r*34, 15, 26, 3); g.fill();
  }
  g.fillStyle='#0d2230'; rr(26,-178,20,140,4); g.fill();
  for (let i=0;i<4;i++){ g.fillStyle='#4d6d80'; rr(30,-170+i*22,12,8,2); g.fill(); }
  g.fillStyle='#f5c22b'; rr(-44,-30,88,18,4); g.fill();
  txt('SNACKS', 0, -21, 12, '#2a2a2a');
  g.restore();
}
function waterCooler(x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#e8eef2'; rr(-22,-70,44,70,5); g.fill();
  g.strokeStyle='#bcc9d2'; g.lineWidth=2; rr(-22,-70,44,70,5); g.stroke();
  g.fillStyle='rgba(120,210,245,.55)';
  g.beginPath(); g.moveTo(-18,-70); g.lineTo(18,-70); g.lineTo(14,-124); g.lineTo(-14,-124); g.closePath(); g.fill();
  g.strokeStyle='rgba(200,235,250,.8)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(-18,-70); g.lineTo(-14,-124); g.lineTo(14,-124); g.lineTo(18,-70); g.stroke();
  for (let i=0;i<3;i++){ g.fillStyle='rgba(255,255,255,.6)';
    g.beginPath(); g.arc(-6+i*6, -88 - ((T*0.8+i*14)%30), 2.6, 0, 7); g.fill(); }
  g.fillStyle='#5a7186'; rr(-8,-46,16,10,2); g.fill();
  g.restore();
}

/* ============================================================
   S_brk — before and after the dream
   ============================================================ */
const S_brk = {
  enter(){
    Hint.begin('brk');
    this.after = !!G.dreamt;
    Music.play(this.after ? 'lab' : 'lab');
    this.px = this.after ? 640 : 60;

          g.globalAlpha = pop;
          g.scale(lerp(2.2,1,bounce(pop)), lerp(2.2,1,bounce(pop)));
          g.fillStyle='rgba(200,45,40,.92)';
          g.font='700 34px "Trebuchet MS",Verdana,sans-serif';
          g.textAlign='center'; g.textBaseline='middle';
          g.fillText('F', 0, 0);
          g.strokeStyle='rgba(200,45,40,.8)'; g.lineWidth=3;
          g.beginPath(); g.arc(0,0,26,0,7); g.stroke();
          g.restore();
        }
        if (this.stampK > 58){ this.phase='fall'; }
      }
    }

    drawParts();

    /* ---------------- the quiz ---------------- */
    if (this.phase === 'quiz') this.drawQuiz();

    if (this.convo) this.convo.draw();

    /* a dreamlike wash over everything */
    g.fillStyle = `rgba(90,110,180,${0.06 + Math.sin(T/60)*0.03})`;
    g.fillRect(0,0,W,H);
    vignette(.36);
    hudEl.textContent = this.phase==='quiz'
      ? `Thermodynamics   ·   question ${Math.min(this.qi+1,4)}/4`
      : 'Thermodynamics';
  },

  drawQuiz(){
    const q = DREAM_Q[this.qi];
    // the question on the board
    g.save();
    if (q.blur) g.filter = 'blur(2.6px)';
    g.fillStyle='#233';
    wrapText(q.q, 630, 200, 360, 30, q.blur ? 22 : 23, '#233', 'center', 700);
    g.restore();

    // timer bar, only while no feedback is showing
    const waiting = this.fb <= 0;
    if (waiting){
      this.timer -= dt;
      const k = clamp(this.timer/470, 0, 1);
      g.fillStyle='rgba(0,0,0,.14)'; rr(430, 318, 400, 12, 6); g.fill();
      g.fillStyle = k < .3 ? '#c0392b' : '#2f7fb8'; rr(430, 318, 400*k, 12, 6); g.fill();
      if (this.timer <= 0) this.answer(-2);
    }

    // options
    q.opts.forEach((o,i)=>{
      const bw=310, bh=50, bx=W/2-bw/2+70, by=390+i*60;
      const z = zone(bx,by,bw,bh);
      g.save(); if (z.hover && waiting){ g.shadowColor='#2f7fb8'; g.shadowBlur=16; }
      g.fillStyle = z.hover && waiting ? 'rgba(255,255,255,.98)' : 'rgba(250,250,246,.92)';
      rr(bx,by,bw,bh,9); g.fill(); g.restore();
      g.strokeStyle = z.hover && waiting ? '#2f7fb8' : '#a8a89c';
      g.lineWidth=2; rr(bx,by,bw,bh,9); g.stroke();
      g.save();
      if (q.blur) g.filter='blur(2.2px)';
      txt(o, bx+bw/2, by+bh/2, 19, '#2a3a44','center',400);
      g.restore();
      if (z.clicked && waiting) this.answer(i);
    });

    if (!waiting){
      this.fb -= dt;
      const msg = this.qi>=3 ? 'WRONG.' : this.ok ? 'CORRECT' : 'WRONG';
      txtShadow(msg, W/2+70, 348, 34, this.ok && this.qi<3 ? '#2f8f5c' : '#c0392b');
      if (this.fb <= 0){ this.fb = 0; this.next(); }
    }
  },

  answer(i){
    const q = DREAM_Q[this.qi];
    this.ok = (i === q.a);
    if (this.ok){ this.correct++; SFX.good(); } else SFX.bad();
    this.fb = 60;
  },

  next(){
    this.qi++;
    if (this.qi >= DREAM_Q.length){
      // the entropy question was never going to go well
      this.phase = 'stamp'; this.stampK = 0;
      SFX.yell();
      this.convo = Convo([
        { by:'Dr. Sabbagh', text:'WRONG. Repeat the course. Repeat the whole degree.',
          at:()=>[286, 342], w:320 }
      ], ()=>{ this.convo = null; });
      return;
    }
    this.timer = 470;
  }
};

/* ============================================================
   The verdict — Mr. Tarek reads your day back to you
   ============================================================ */
function verdictFor(s){
  if (s >= 98) return { k:'badge', title:'TAKE MY BADGE',
    line:'"Twenty two years I have run this place. Take it. You deserve it more than I do."',
    col:'#f5b53d' };
  if (s >= 90) return { k:'employee', title:'EMPLOYEE OF THE DAY',
    line:'"Outstanding. Nothing exploded. Nothing even considered it."', col:'#3fd07f' };
  if (s >= 70) return { k:'hired', title:'YOU ARE HIRED',
    line:'"Solid work. Keep the badge, keep the desk, keep the goggles on."', col:'#7fd0f0' };
  if (s >= 50) return { k:'training', title:'UNDER SUPERVISION',
    line:'"You stay. You also start training on Monday. Bring a notebook."', col:'#f0a02a' };
  return { k:'fired', title:'FIRED',
    line:'"I wasted a perfectly good cup of coffee on you this morning."', col:'#ee5f6e' };
}

const S_end = {
  enter(){

    g.fillStyle='#734b2e'; rr(556, H*0.66+2, 268, 74, 5); g.fill();

        hLift = -Math.abs(Math.sin(this.actK/9))*12;

          g.strokeStyle='#c98a10'; g.lineWidth=2; star(0,0,17,8,5); g.stroke();

          if (Math.random()<.5) emitSpark(bx, by, 1, '#ffe08a');

        if (this.badgeK >= 1){
          // it lands on the graduate's chest
          g.save(); g.translate(this.heroX - 14, H*0.66-70);
          g.fillStyle='#f5b53d'; star(0,0,17,8,5); g.fill();
          g.strokeStyle='#c98a10'; g.lineWidth=2; star(0,0,17,8,5); g.stroke();
          g.fillStyle='#fff6d8'; g.beginPath(); g.arc(0,0,6,0,7); g.fill();
          g.restore();
          this.confettiT += dt;
          if (this.confettiT > 4){ this.confettiT = 0; emitConfetti(rnd(200,1080), -10, 2); }
        }
      }

      if (this.v.k === 'employee'){
        const k = clamp((this.actK-24)/40, 0, 1);
        if (k > 0){
          g.save();
          g.translate(this.heroX, H*0.66 - 250 + (1-bounce(k))*80);
          g.scale(bounce(k), bounce(k));
          g.save(); g.shadowColor='rgba(0,0,0,.4)'; g.shadowBlur=14;
          g.fillStyle='#3fd07f'; rr(-128,-34,256,68,12); g.fill(); g.restore();
          g.strokeStyle='#1f8f5c'; g.lineWidth=3; rr(-128,-34,256,68,12); g.stroke();

        }

        const k = clamp((this.actK-24)/40, 0, 1);

          g.save(); g.translate(cx, H*0.66-58); g.rotate(-0.12);

    drawParts();

    /* ---------------- the report card ---------------- */
    if (this.phase === 'card' || this.phase === 'act' || this.phase === 'done'){
      this.cardK = Math.min(1, this.cardK + dt/26);

      const ty = lerp(cy + ch/2, 44 + ch*scl/2, sk);
      g.save();
      g.translate(tx, ty);
      g.scale(e*scl, e*scl); g.rotate((1-e)*0.3);
      g.translate(-(cx+cw/2), -(cy+ch/2));
      g.save(); g.shadowColor='rgba(0,0,0,.55)'; g.shadowBlur=26; g.shadowOffsetY=10;
      g.fillStyle='#f6f2e2'; rr(cx, cy, cw, ch, 10); g.fill(); g.restore();
      g.strokeStyle='#cfc6ac'; g.lineWidth=3; rr(cx, cy, cw, ch, 10); g.stroke();

      txt('FIRST DAY REPORT', cx+cw/2, cy+34, 20, '#2f4250');
      txt(hero.name, cx+cw/2, cy+58, 15, '#6a7a86','center',400);
      g.strokeStyle='#dcd4bc'; g.lineWidth=2;
      g.beginPath(); g.moveTo(cx+30, cy+74); g.lineTo(cx+cw-30, cy+74); g.stroke();

      // the subject bars fill in
      this.barK = Math.min(1, this.barK + dt/70);
      const rows = [['Separation','sep'],['Reactors','rea'],['Fluids','flu'],
                    ['Heat','hea'],['Thermo','the'],['Safety','saf']];
      rows.forEach(([lab,k],i)=>{
        const y = cy + 104 + i*30;
        txt(lab, cx+34, y, 15, '#2f4250','left');
        g.fillStyle='rgba(0,0,0,.08)'; rr(cx+150, y-8, 300, 16, 8); g.fill();
        const pct = subjectPct(k)/100 * this.barK;
        g.fillStyle = pct>0.75 ? '#3fd07f' : pct>0.45 ? '#f0a02a' : '#ee5f6e';
        rr(cx+150, y-8, 300*pct, 16, 8); g.fill();
        txt(Math.round(subjectPct(k)*this.barK) + '%', cx+cw-34, y, 14, '#6a7a86','right',400);
      });

      // the total, stamped on
      const tk = clamp((this.barK - 0.75)/0.25, 0, 1);
      if (tk > 0){
        g.save();
        g.translate(cx+cw/2, cy+ch-42);
        g.scale(lerp(2.4,1,bounce(tk)), lerp(2.4,1,bounce(tk)));
        g.globalAlpha = tk;
        txt(this.score + ' / 100', 0, 0, 40, this.v.col);
        g.restore();
      }
      g.restore();

      if (this.barK >= 1 && this.phase === 'card'){
        this.phase = 'act'; this.actK = 0;
        if (this.v.k === 'fired'){ SFX.sad(); }
        else if (this.v.k === 'badge'){ SFX.badge(); }
        else SFX.fanfare();
        this.convo = Convo([
          { by:NPCS.boss.name, text:this.v.line, at:()=>[this.bossX, H*0.66-180], w:400 }
        ], ()=>{ this.convo = null; });
      }
    }

    /* ---------------- the verdict banner ---------------- */
    if (this.phase === 'act' || this.phase === 'done'){
      const bk = clamp(this.actK/20, 0, 1);
      g.save(); g.globalAlpha = bk;
      g.translate(W/2 + 120, 74 + (1-bounce(bk))*40);
      g.save(); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=20;
      g.fillStyle = 'rgba(4,18,28,.94)'; rr(-230, -32, 460, 64, 12); g.fill(); g.restore();
      g.strokeStyle = this.v.col; g.lineWidth = 3; rr(-230, -32, 460, 64, 12); g.stroke();
      txt(this.v.title, 0, 2, 32, this.v.col);
      g.restore();
    }

    /* ---------------- flow ---------------- */
    if (this.phase === 'walk'){
      this.heroX -= 3.4*dt;
      if (T % 22 < dt) SFX.step();
      if (this.heroX <= 760){
        this.heroX = 760; this.phase = 'talk';
        this.convo = Convo([
          { by:NPCS.boss.name, text:'Sit down. Actually, do not. This will not take long.',
            at:()=>[this.bossX, H*0.66-180], w:380 },
          { by:NPCS.boss.name, text:'I have your morning here in writing.',
            at:()=>[this.bossX, H*0.66-180], w:340 }
        ], ()=>{ this.convo=null; this.phase='card'; SFX.stamp(); shake(6); });
      }
    }

    if (this.convo) this.convo.draw();

    if (this.phase === 'done'){
      if (button('PLAY AGAIN', W/2-230, H-64, 210, 46, {size:18})){
        G.reset(); G.dreamt = false; hero = CHARS[0]; go(S_menu, 'fade');
      }
      if (button('CHOOSE ANOTHER ENGINEER', W/2+20, H-64, 300, 46, {col:'#f5b53d', size:16})){
        G.reset(); G.dreamt = false; go(S_select, 'fade');
      }
    }

    hudEl.textContent = '';
  }
};

/* ============================================================
   Boot — wait for a gesture so audio is allowed, then run
   ============================================================ */
const tapEl = document.getElementById('tapstart');

/* #sep #rea #flu #hea #brk #hub #end jump straight to a scene, for testing
   and for running a single station at a booth. #mute silences the music.   */
function devScene(){
  const h = (location.hash || '').slice(1).split(',');
  const map = { sep:()=>S_sep, rea:()=>S_rea, flu:()=>S_flu, hea:()=>S_hea,
                brk:()=>S_brk, hub:()=>S_hub, end:()=>S_end, select:()=>S_select };
  let target = null;
  for (const part of h){
    if (part === 'mute' && musicGain) musicGain.gain.value = 0;
    if (map[part]) target = map[part]();
  }
  return target;
}

function boot(){
  tapEl.removeEventListener('click', boot);
  tapEl.classList.add('gone');
  initAudio(); resumeAudio();
  const jump = devScene();
  if (jump){
    for (const s of STATIONS) if (s.key !== 'brk') { /* keep scoring sane when jumping */ }
    Hint.begin('dev');
    go(jump);
  } else go(S_logo);
  requestAnimationFrame(frame);
}
