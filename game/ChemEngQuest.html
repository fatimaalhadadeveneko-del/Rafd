    g.beginPath(); g.moveTo(0,H*0.66); g.lineTo(W,H*0.66); g.lineTo(W,H); g.lineTo(0,H); g.fill();
    for (let i=0;i<9;i++){ g.strokeStyle='rgba(255,255,255,.04)'; g.lineWidth=2;
      g.beginPath(); g.moveTo(i*160, H*0.66); g.lineTo(i*160-90, H); g.stroke(); }

    // window with the refinery outside
    panel(80, 80, 300, 200, 'rgba(20,70,98,.9)', 'rgba(150,190,210,.5)');
    g.save(); g.beginPath(); rr(90,90,280,180,8); g.clip();
    g.fillStyle='#2a5f7e'; g.fillRect(90,90,280,180);
    for (let i=0;i<5;i++){ g.fillStyle='rgba(8,30,44,.8)';
      g.fillRect(100+i*56, 190 - nz(i)*80, 26, 200); }
    for (let s=0;s<4;s++){ const t2=(T*0.4+s*50)%200;
      g.fillStyle=`rgba(230,240,245,${0.10*(1-t2/200)})`;
      g.beginPath(); g.arc(160+Math.sin(t2/30)*12, 190-t2*0.5, 10+t2*0.08,0,7); g.fill(); }
    g.restore();

    // wall sign
    panel(880, 92, 300, 92, 'rgba(245,181,61,.14)', 'rgba(245,181,61,.55)');
    txt('DAYS WITHOUT INCIDENT', 1030, 122, 15, '#f5d78a');
    txt(G.blunders>0 ? '0' : '1', 1030, 158, 30, '#f5b53d');

    // desk
    g.fillStyle='#5a3a24'; rr(540, H*0.66-18, 300, 20, 5); g.fill();
    g.fillStyle='#734b2e'; rr(556, H*0.66+2, 268, 74, 5); g.fill();
    g.fillStyle='#4a2f1d'; rr(556, H*0.66+2, 268, 10, 4); g.fill();
    // papers + mug on desk
    for (let i=0;i<3;i++){ g.save(); g.translate(600+i*18, H*0.66-24); g.rotate((nz(i)-.5)*.3);
      g.fillStyle='#eef2f5'; rr(-16,-10,32,20,2); g.fill(); g.restore(); }
    g.fillStyle='#e8eef2'; rr(790, H*0.66-36, 22, 22, 4); g.fill();
    if (Math.random()<.1) emitSteam(801, H*0.66-38, 1, {speed:.4, col:'rgba(210,190,170,.4)'});

    /* boss stands behind the desk */
    const talkingBoss = this.convo && this.convo.speaking('Mr. Tarek');
    drawPerson(NPCS.boss, this.bossX, H*0.66+96, 2.9, {
      dir:'right',
      face: isHard() ? (talkingBoss ? 'worry' : 'shame') : (talkingBoss ? 'neutral' : 'happy'),
      talk: talkingBoss, seed:2,
      pose: talkingBoss ? 'talk' : 'idle'
    });
    txt(NPCS.boss.name, this.bossX, H*0.66+124, 14, 'rgba(234,244,250,.5)');

    /* in hard mode Bassam is already in the room, filing something, listening */
    if (isHard()){
      const sx = 1010;
      const heard = this.convo && this.convo.i >= 2;
      drawPerson(NPCS.sus, sx, H*0.66+96, 2.6, {
        dir:'left', seed:23,
        face: heard ? 'angry' : 'neutral',
        pose: heard ? 'cross' : 'clipboard'
      });
      txt(NPCS.sus.name, sx, H*0.66+124, 14, 'rgba(234,244,250,.5)');
      if (heard){
        const marks = ['?', '?!', '...'];
        txt(marks[Math.floor(T/40) % 3], sx + 34, H*0.66-92 + Math.sin(T/16)*4,
            26, '#ee5f6e');
      }
    }

    /* hero walks in from the right */
    if (this.walking){
      this.heroX -= 3.4*dt;
      if (T % 22 < dt) SFX.step();
      if (this.heroX <= 700){
        this.walking = false;
        const B = ()=>[this.bossX, H*0.66-52];
        const Hh = ()=>[this.heroX, H*0.66-52];
        const lines = isHard() ? [
          /* the nepotism briefing */
          { by:'Mr. Tarek', text:'Jojo. Your mother called me. Twice.', at:B },
          { by:hero.name,   text:'Uncle! This is a lovely factory. Very... piped.', at:Hh, w:340 },
          { by:'Mr. Tarek', text:'It is a refinery. Do not call me uncle on the floor.', at:B },
          { by:hero.name,   text:'Understood. So what does a chemical engineer actually do all day?', at:Hh, w:380 },
          { by:'Mr. Tarek', text:'...You start at the separation lab. Please touch as little as possible.', at:B, w:380 },
          { by:hero.name,   text:'Relax. I have watched a documentary about oil.', at:Hh, w:340 },
          { by:NPCS.sus.name, text:'Sir. Sorry. Which university was that, exactly?',
            at:()=>[1010, H*0.66-52], w:330 },
          { by:'Mr. Tarek', text:'Bassam. Go and check something. Anything.', at:B, w:320 },
          { by:NPCS.sus.name, text:'Of course, sir. I will check on him.',
            at:()=>[1010, H*0.66-52], w:300 }
        ] : [
          { by:'Mr. Tarek', text:'You must be the new graduate. Good. Badge on.', at:B },
          { by:'Mr. Tarek', text:'Four stations need covering today, and the break room needs someone in it eventually.', at:B },
          { by:'Mr. Tarek', text:'Do the work. Read the process. Do not burn my refinery down.', at:B },
          { by:hero.name, text: hero.safety===2
              ? 'Understood. Goggles first, questions later.'
              : hero.safety===0 ? 'Understood. Mostly understood.'
              : 'Understood, sir.', at:Hh },
          { by:'Mr. Tarek', text:'"Mostly" is how refineries end up in the news. Go.', at:B }
        ];
        this.convo = Convo(lines, ()=> go(S_hub, 'fade'));
      }
    }
    const talkingHero = this.convo && this.convo.speaking(hero.name);
    drawPerson(hero, this.heroX, H*0.66+96, 2.9, {
      dir:'left', walk: this.walking ? T*2.2 : 0,
      face: isHard() ? 'happy'
          : talkingHero ? 'neutral' : this.walking ? 'neutral' : 'worry',
      talk: talkingHero, seed:5,
      pose: isHard() && !this.walking ? 'wave' : undefined,
      ppe:{ hat: !isHard(), goggles: hero.safety===2 }
    });

    vignette(.35);
    if (this.convo) this.convo.draw();
    hudEl.textContent = '';
  }
};


/* ===== 07-hub.js ===== */
/* ============================================================
   Refinery hub — the walkable overworld
   ============================================================ */
const STATIONS = [
  { key:'sep', name:'Separation Techniques Lab',  x:168,  col:'#3fd0c0', scene:()=>S_sep },
  { key:'rea', name:'Reactor Design Lab',         x:412,  col:'#ee5f6e', scene:()=>S_rea },
  { key:'flu', name:'Piping Circuit Bay',         x:656,  col:'#f0a02a', scene:()=>S_flu },
  { key:'hea', name:'Thermal Exchange Hall',      x:900,  col:'#ff7a3a', scene:()=>S_hea },
  { key:'brk', name:'Break Room',                 x:1136, col:'#9b8cf0', scene:()=>S_brk }
];

const WALL_TOP = 300;        // top of the back wall
const GROUND   = 512;        // where the wall meets the floor
const FLOOR_LO = 524, FLOOR_HI = H - 42;

/* ---- reusable yard scenery ---- */
function storageTank(x, y, w, h, col, label){
  g.fillStyle = col; rr(x - w/2, y - h, w, h, 6); g.fill();
  g.fillStyle = 'rgba(0,0,0,.16)'; rr(x + w/2 - w*0.3, y - h, w*0.3, h, 6); g.fill();
  g.fillStyle = 'rgba(255,255,255,.10)'; rr(x - w/2 + 4, y - h, w*0.16, h, 4); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1.6;
  for (let i = 1; i < 3; i++){
    g.beginPath(); g.moveTo(x-w/2, y-h*i/3); g.lineTo(x+w/2, y-h*i/3); g.stroke();
  }
  g.fillStyle = col; g.beginPath(); g.ellipse(x, y-h, w/2, w*0.17, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.ellipse(x, y-h, w/2, w*0.17, 0, Math.PI, 0); g.fill();
  g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=1.4; rr(x - w/2, y - h, w, h, 6); g.stroke();
  if (label) txt(label, x, y - h/2, 11, 'rgba(255,255,255,.45)');
}
function barrel(x, y, s, col){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(0,0,13,3.6,0,0,7); g.fill();
  g.fillStyle=col; rr(-11,-30,22,30,3); g.fill();
  g.fillStyle='rgba(0,0,0,.18)'; rr(4,-30,7,30,3); g.fill();
  g.fillStyle='rgba(255,255,255,.14)'; rr(-9,-30,3.4,30,2); g.fill();
  g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(-11,-22); g.lineTo(11,-22); g.moveTo(-11,-9); g.lineTo(11,-9); g.stroke();
  g.fillStyle=col; g.beginPath(); g.ellipse(0,-30,11,3.2,0,0,7); g.fill();
  g.fillStyle='rgba(255,255,255,.16)'; g.beginPath(); g.ellipse(0,-30,11,3.2,0,Math.PI,0); g.fill();
  g.restore();
}
function crate(x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(0,0,17,4,0,0,7); g.fill();
  g.fillStyle='#8a6034'; rr(-16,-30,32,30,3); g.fill();
  g.fillStyle='#6d4a27'; rr(6,-30,10,30,3); g.fill();
  g.strokeStyle='#5c3f22'; g.lineWidth=2.4;
  g.beginPath(); g.moveTo(-16,-30); g.lineTo(16,0); g.moveTo(16,-30); g.lineTo(-16,0); g.stroke();
  g.strokeStyle='#5c3f22'; g.lineWidth=2; rr(-16,-30,32,30,3); g.stroke();
  g.restore();
}
function hazardSign(x,y,s,kind){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#8a939a'; g.fillRect(-2,-26,4,26);
  g.fillStyle='#f5c22b';
  g.beginPath(); g.moveTo(0,-56); g.lineTo(16,-28); g.lineTo(-16,-28); g.closePath(); g.fill();
  g.strokeStyle='#2b2b2b'; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(0,-56); g.lineTo(16,-28); g.lineTo(-16,-28); g.closePath(); g.stroke();
  g.fillStyle='#2b2b2b';
  if (kind === 'ppe'){ g.fillRect(-1.6,-46,3.2,10); g.beginPath(); g.arc(0,-33,1.9,0,7); g.fill(); }
  else { g.beginPath(); g.moveTo(2,-48); g.lineTo(-5,-38); g.lineTo(-0.5,-38);
         g.lineTo(-3,-31); g.lineTo(5,-41); g.lineTo(0.5,-41); g.closePath(); g.fill(); }
  g.restore();
}

const S_hub = {
  enter(){
    Music.play('work');
    if (this.px === undefined){ this.px = W/2; this.py = 610; }
    this.face = 'right'; this.walkT = 0; this.stepT = 0; this.nearS = null;
    if (this.susX === undefined) this.susX = this.px - 180;
    this.susWalk = 0; this.susBubble = 0;
  },
  allDone(){ return STATIONS.every(s => G.done[s.key]); },

  draw(){
    /* ================= sky ================= */
    const sky = g.createLinearGradient(0,0,0,WALL_TOP+40);
    sky.addColorStop(0,'#123c56'); sky.addColorStop(.6,'#215f7c'); sky.addColorStop(1,'#37809b');
    g.fillStyle = sky; g.fillRect(0,0,W,WALL_TOP+40);

    /* distant plant silhouette */
    for (let i=0;i<16;i++){
      const x = i*84 - 20, h = 40 + nz(i)*110;
      g.fillStyle = 'rgba(12,42,60,.5)';
      g.fillRect(x, WALL_TOP - h, 24, h + 20);
      g.fillRect(x+24, WALL_TOP - h*0.55, 10, h*0.55 + 20);
    }
    /* stacks with drifting plumes */
    for (const sx of [120, 520, 880, 1180]){
      g.fillStyle='rgba(9,34,50,.72)'; g.fillRect(sx-11, WALL_TOP-190, 22, 190);
      g.fillStyle='rgba(245,120,80,.5)'; g.fillRect(sx-13, WALL_TOP-196, 26, 8);
      for (let s=0;s<7;s++){
        const t2 = (T*0.42 + s*34 + sx) % 238;
        g.fillStyle = `rgba(226,238,244,${0.13*(1-t2/238)})`;
        g.beginPath();
        g.arc(sx + Math.sin(t2/26 + sx)*22, WALL_TOP-196 - t2*0.52, 9 + t2*0.085, 0, 7);
        g.fill();
      }
    }

    /* ================= overhead pipe rack ================= */
    g.fillStyle='#0f3348'; g.fillRect(0, 74, W, 14);
    for (let i=0;i<4;i++)
      pipeSeg(-10, 96+i*13, W+10, 96+i*13, 11,
              {shell: i%2?'#2d6683':'#336f8d', inner: i%2?'#1c475e':'#215068'});
    for (let i=0;i<8;i++){
      g.fillStyle='#10394f'; g.fillRect(i*170+50, 88, 15, 64);
      g.fillStyle='#0b2b3c'; g.fillRect(i*170+50, 148, 15, 10);
    }
    // flow inside the top pipe
    flowDots([[0,96],[W,96]], 1.6, .5, 'rgba(150,235,255,.5)', 3);

    /* ================= back wall ================= */
    const wall = g.createLinearGradient(0,WALL_TOP,0,GROUND);
    wall.addColorStop(0,'#1b4a63'); wall.addColorStop(1,'#10364b');
    g.fillStyle = wall; g.fillRect(0, WALL_TOP, W, GROUND-WALL_TOP);
    // corrugation
    for (let i=0;i<W/26;i++){
      g.fillStyle = i%2 ? 'rgba(255,255,255,.022)' : 'rgba(0,0,0,.05)';
      g.fillRect(i*26, WALL_TOP, 13, GROUND-WALL_TOP);
    }
    // top capping beam
    g.fillStyle='#0d2c3e'; g.fillRect(0, WALL_TOP-10, W, 14);
    g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(0, WALL_TOP-10, W, 3);
    // rust streaks
    for (let i=0;i<14;i++){
      g.fillStyle='rgba(120,70,40,.10)';
      g.fillRect(nz(i)*W, WALL_TOP, 7, 30 + nz(i+4)*90);
    }

    /* ================= doors ================= */
    this.nearS = null;
    const DW = 118, DH = 172;
    for (const s of STATIONS){
      const done = !!G.done[s.key];
      const dy = GROUND - DH;
      const near = Math.abs(this.px - s.x) < 74 && this.py < 630;
      if (near && !done) this.nearS = s;

      // recessed frame
      g.fillStyle='#0a2433'; rr(s.x-DW/2-9, dy-11, DW+18, DH+11, 7); g.fill();
      // interior
      const gr = g.createLinearGradient(0, dy, 0, GROUND);
      if (done){ gr.addColorStop(0,'#061c16'); gr.addColorStop(.55,'#0b2b22');
                 gr.addColorStop(1,'rgba(40,120,90,.55)'); }
      else { gr.addColorStop(0,'#04141e'); gr.addColorStop(.55,'#07202e');
             gr.addColorStop(1,`rgba(46,140,185,${(near?.68:.34)+Math.sin(T/26)*.06})`); }
      g.fillStyle = gr; rr(s.x-DW/2, dy, DW, DH, 5); g.fill();
      // silhouetted contents hint
      g.save(); g.beginPath(); rr(s.x-DW/2, dy, DW, DH, 5); g.clip();
      g.fillStyle='rgba(2,10,16,.62)';
      if (s.key==='sep'){ g.fillRect(s.x-28, dy+40, 18, DH); g.fillRect(s.x+10, dy+66, 22, DH); }
      if (s.key==='rea'){ g.beginPath(); g.arc(s.x, dy+120, 30, 0, 7); g.fill(); g.fillRect(s.x-4, dy+50, 8, 60); }
      if (s.key==='flu'){ g.fillRect(s.x-40, dy+96, 80, 12); g.fillRect(s.x-12, dy+56, 12, 52); }
      if (s.key==='hea'){ g.fillRect(s.x-34, dy+80, 26, DH); g.fillRect(s.x+8, dy+80, 26, DH); }
      if (s.key==='brk'){ g.fillRect(s.x-32, dy+104, 64, 18); g.fillRect(s.x-26, dy+122, 10, 40); g.fillRect(s.x+16, dy+122, 10, 40); }
      g.restore();
      // light spill
      g.save(); g.globalAlpha = done ? .12 : .20;
      const sp = g.createLinearGradient(0, GROUND, 0, GROUND+86);
      sp.addColorStop(0, done ? '#3fd07f' : s.col); sp.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = sp;
      g.beginPath(); g.moveTo(s.x-DW/2, GROUND); g.lineTo(s.x+DW/2, GROUND);
      g.lineTo(s.x+DW/2+34, GROUND+86); g.lineTo(s.x-DW/2-34, GROUND+86); g.closePath(); g.fill();
      g.restore();
      // frame trim
      g.strokeStyle = done ? '#3fd07f' : s.col;
      g.lineWidth = (near && !done) ? 4 : 2.4;
      rr(s.x-DW/2, dy, DW, DH, 5); g.stroke();

      // sign board above the door
      const SW = 176;
      g.save(); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=10; g.shadowOffsetY=3;
      g.fillStyle='rgba(5,22,33,.96)'; rr(s.x-SW/2, dy-58, SW, 44, 7); g.fill();
      g.restore();
      g.strokeStyle = done ? '#3fd07f' : s.col; g.lineWidth=2; rr(s.x-SW/2, dy-58, SW, 44, 7); g.stroke();
      const words = s.name.split(' ');
      const cut = words.length > 2 ? words.length-1 : 1;
      txt(words.slice(0,cut).join(' '), s.x, dy-45, 13, done?'#8fe8b8':'#e2eef5');
      txt(words.slice(cut).join(' '),   s.x, dy-29, 13, done?'#8fe8b8':'#e2eef5');
      if (done){
        g.fillStyle='#3fd07f'; g.beginPath(); g.arc(s.x+SW/2-15, dy-51, 9, 0, 7); g.fill();
        g.strokeStyle='#04121a'; g.lineWidth=2.4; g.lineCap='round';
        g.beginPath(); g.moveTo(s.x+SW/2-19, dy-51); g.lineTo(s.x+SW/2-16, dy-47.5);
        g.lineTo(s.x+SW/2-11, dy-55); g.stroke();
      }
    }

    /* ================= yard props against the wall ================= */
    storageTank(292, GROUND, 58, 118, '#5d7684', 'N2');
    storageTank(548, GROUND, 46, 96,  '#6a6f84', 'H2O');
    storageTank(788, GROUND, 52, 108, '#7a6a5e', 'FUEL');
    storageTank(1030, GROUND, 40, 84, '#5d7684');
    // vertical pipes running off the tanks
    for (const tx of [292, 548, 788, 1030]){
      pipeSeg(tx+28, GROUND-60, tx+28, 158, 7, {shell:'#2f6480', inner:'#1e4459'});
    }
    hazardSign(238, GROUND+2, 1, 'ppe');
    hazardSign(1082, GROUND+2, 1, 'elec');
    barrel(330, GROUND+6, 1, '#d8a832');
    barrel(352, GROUND+4, .88, '#c94a3c');
    crate(588, GROUND+6, .95);
    barrel(836, GROUND+5, 1, '#3f8ad0');
    // wall vents with steam
    for (const vx of [470, 962]){
      g.fillStyle='#0a2432'; rr(vx-18, GROUND-64, 36, 26, 4); g.fill();
      g.strokeStyle='#17475f'; g.lineWidth=2;
      for (let i=0;i<3;i++){ g.beginPath(); g.moveTo(vx-14, GROUND-58+i*7); g.lineTo(vx+14, GROUND-58+i*7); g.stroke(); }
      if (Math.random()<.10) emitSteam(vx, GROUND-64, 1, {speed:.7});
    }

    /* ================= floor ================= */
    const fl = g.createLinearGradient(0,GROUND,0,H);
    fl.addColorStop(0,'#1d4a5f'); fl.addColorStop(1,'#0c2635');
    g.fillStyle = fl; g.fillRect(0, GROUND, W, H-GROUND);
    g.strokeStyle='rgba(255,255,255,.03)'; g.lineWidth=2;
    for (let i=-6;i<24;i++){ g.beginPath(); g.moveTo(i*76, GROUND); g.lineTo(i*76-130, H); g.stroke(); }
    for (let y=GROUND+18;y<H;y+=28){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
    // hazard-striped walkway edge
    for (let i=0;i<W/22;i++){
      g.fillStyle = i%2 ? 'rgba(245,181,61,.55)' : 'rgba(30,40,48,.55)';
      g.fillRect(i*22, GROUND+3, 22, 6);
    }
    // a puddle that catches the door light
    g.fillStyle='rgba(120,200,235,.07)';
    g.beginPath(); g.ellipse(700, 660, 90, 20, 0, 0, 7); g.fill();
    g.strokeStyle='rgba(160,220,245,.10)'; g.lineWidth=1.5;
    g.beginPath(); g.ellipse(700, 660, 90, 20, 0, 0, 7); g.stroke();

    /* ================= movement ================= */
    let dx=0, dy=0;
    if (keys.ArrowLeft||keys.a||keys.A) dx--;
    if (keys.ArrowRight||keys.d||keys.D) dx++;
    if (keys.ArrowUp||keys.w||keys.W) dy--;
    if (keys.ArrowDown||keys.s||keys.S) dy++;
    const moving = (dx||dy) && !trans;
    if (dx) this.face = dx>0 ? 'right' : 'left';
    if (moving){
      const n = Math.hypot(dx,dy) || 1;
      this.px = clamp(this.px + dx/n*3.6*dt, 40, W-40);
      this.py = clamp(this.py + dy/n*2.2*dt, FLOOR_LO, FLOOR_HI);
      this.walkT += dt*2.4;
      this.stepT += dt;
      if (this.stepT > 12){ this.stepT = 0; SFX.step();
        spawn({x:this.px, y:this.py, vx:rnd(-.5,.5), vy:rnd(-.6,-.15), life:24, max:24,
               size:rnd(3,6), col:'rgba(190,215,228,.30)', kind:'puff'}); }
    } else this.walkT = 0;

    /* ================= the boss, once everything is done ================= */
    const all = this.allDone();
    if (all){
      const bx = 1232, by = 648;
      drawPerson(NPCS.boss, bx, by, 2.1, { dir:'left', face:'neutral', seed:2 });
      const near = Math.hypot(this.px-bx, this.py-by) < 140;
      bubble(near ? 'Right. Let us talk about your day.' : 'Over here, graduate.',
             bx-70, by-232, {w:216, size:16, pop:1});
      if (near){
        txt('SPACE', bx, by+20, 13, '#f5b53d');
        if (keyPressed(' ','Enter','Space')){ SFX.click(); go(S_end, 'fade'); }
      }
    }

    /* ================= Bassam, keeping his distance ================= */
    if (isHard()){
      const want = this.px + (this.px > W/2 ? -190 : 190);
      const d = want - this.susX;
      if (Math.abs(d) > 6){
        this.susX += clamp(d * 0.028 * dt, -3.2, 3.2);
        this.susWalk += dt * 2.0;
      } else this.susWalk = 0;
      drawPerson(NPCS.sus, this.susX, this.py + 14, 1.95, {
        dir: this.px > this.susX ? 'right' : 'left',
        walk: this.susWalk, seed:23,
        face:'angry', pose: this.susWalk ? undefined : 'cross'
      });
      this.susBubble -= dt;
      if (this.susBubble < -420){ this.susBubble = 150; }
      if (this.susBubble > 0){
        const lines = ['Which university, he said. He never answered.',
                       'I am not following you. We are simply walking the same way.',
                       'Four stations. I will be at every door.'];
        bubble(lines[Math.floor(T/900) % 3], this.susX, this.py - 190,
               { w:260, size:15, pop:1 });
      }
    }

    drawParts();

    /* ================= the player ================= */
    drawPerson(hero, this.px, this.py, 2.05, {
      dir: this.face, walk: this.walkT,
      face: this.nearS ? 'happy' : 'neutral', seed:5,
      ppe:{ hat:true, goggles: G.ppe.goggles, coat: G.ppe.coat }
    });

    if (this.nearS){
      const s = this.nearS, yy = this.py - 218;
      g.save(); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=12;
      g.fillStyle='rgba(5,22,33,.96)'; rr(this.px-118, yy-24, 236, 42, 10); g.fill(); g.restore();
      g.strokeStyle=s.col; g.lineWidth=2.2; rr(this.px-118, yy-24, 236, 42, 10); g.stroke();
      txt('SPACE   —   go inside', this.px, yy-2, 17, '#eaf4fa');
      if (keyPressed(' ','Enter','Space')){
        SFX.click(); Hint.begin(s.key); go(s.scene(), 'fade');
      }
    }

    vignette(.36);

    const left = STATIONS.filter(s=>!G.done[s.key]).length;
    hudEl.textContent = (all
      ? 'All stations complete  —  report to Mr. Tarek'
      : `${hero.name}   ·   stations left ${left}   ·   score ${finalScore()}/100`)
      + (isHard() ? '   ·   HARD MODE' : '');
  }
};

function beakerGlass(x, y, w, h){
  g.fillStyle='rgba(215,240,250,.14)'; rr(x-w/2, y-h, w, h, 8); g.fill();
  g.strokeStyle='rgba(225,245,255,.62)'; g.lineWidth=3; rr(x-w/2, y-h, w, h, 8); g.stroke();
  g.fillStyle='rgba(255,255,255,.22)';
  g.beginPath(); g.moveTo(x-w/2+8, y-h+10); g.lineTo(x-w/2+15, y-h+10);
  g.lineTo(x-w/2+10, y-8); g.lineTo(x-w/2+4, y-8); g.closePath(); g.fill();
  // graduation marks
  g.strokeStyle='rgba(225,245,255,.4)'; g.lineWidth=1.6;
  for (let i=1;i<4;i++){ g.beginPath();
    g.moveTo(x+w/2-16, y-h*i/4); g.lineTo(x+w/2-4, y-h*i/4); g.stroke(); }
}

/* ============================================================
   outcome animations
   ============================================================ */
function sepOutcome(fail, unitId, x, y, k){
  const u = sepUnit(unitId);
  const st = { run:true };
  if (fail === 'crust') st.broken = true;
  if (fail === 'burnt') st.fire = true;

  /* the unit itself, shaking when it is unhappy */
  const bad = !!fail;
  g.save();
  if (bad && k > .2) g.translate(rnd(-2.2,2.2), rnd(-1.6,1.6));
  u.draw(x, y, u.sc, st);
  g.restore();

  if (!bad){
    // happy: clean steam, sparkle, product jar fills
    if (Math.random()<.5) emitSteam(x, y-150*u.sc, 1, {speed:1.2});
    if (Math.random()<.16) emitSpark(x+rnd(-40,40), y-rnd(30,120), 1, '#9fe8ff');
    return;
  }

  if (fail === 'crust'){
    // salt cakes on the shell, then a seam lets go
    g.save(); g.globalAlpha = clamp(k*1.6,0,.9);
    for (let i=0;i<26;i++){
      g.fillStyle='rgba(255,255,255,.9)';
      g.beginPath(); g.arc(x-24+nz(i)*48, y-150*u.sc + nz(i+7)*140*u.sc, 2.4+nz(i+3)*4, 0, 7); g.fill();
    }
    g.restore();
    if (k > .45){
      if (Math.random()<.6) for (let i=0;i<2;i++) spawn({
        x:x+22, y:y-84, vx:rnd(2.5,7), vy:rnd(-2.6,.6), g:.14, life:rnd(26,48), max:48,
        size:rnd(3,7), col:'rgba(235,250,255,.95)', kind:'dot' });
      emitSteam(x+26, y-84, 1, {vx:2.2, speed:1.6});
    }
  }
  else if (fail === 'spray'){
    for (let i=0;i<3;i++) spawn({
      x:x-40, y:y-70, vx:-rnd(3,9), vy:rnd(-4,2), g:.13, life:rnd(26,52), max:52,
      size:rnd(2,5), col: Math.random()<.5?'#fff':'rgba(200,235,250,.9)', kind:'sq', vr:.2 });
    emitSteam(x-46, y-74, 1, {vx:-2.4});
  }
  else if (fail === 'flood'){
    // liquid pours out of the bottom and spreads on the floor
    if (Math.random()<.8) emitDrip(x+rnd(-30,30), y-30, 2, 'rgba(110,200,240,.85)');
    const pw = clamp(k,0,1) * 150;
    g.fillStyle='rgba(90,180,230,.42)';
    g.beginPath(); g.ellipse(x, y+6, pw, pw*0.16, 0, 0, 7); g.fill();
    g.fillStyle='rgba(180,235,255,.30)';
    g.beginPath(); g.ellipse(x - pw*.25, y+4, pw*.35, pw*0.06, 0, 0, 7); g.fill();
  }
  else if (fail === 'sludge'){
    if (Math.random()<.6) spawn({ x:x+rnd(-26,26), y:y-40, vx:rnd(-1,1), vy:rnd(.4,1.6),
      g:.05, life:rnd(50,90), max:90, size:rnd(7,15), col:'rgba(120,105,70,.8)', kind:'puff', drag:.97 });
    const pw = clamp(k,0,1) * 120;
    g.fillStyle='rgba(112,98,66,.6)';
    g.beginPath(); g.ellipse(x, y+6, pw, pw*0.17, 0, 0, 7); g.fill();
  }
  else if (fail === 'blow'){
    // the feed sails straight out of the top, untouched
    for (let i=0;i<9;i++){
      const pr = ((T*3 + i*24) % 150);
      g.globalAlpha = clamp(1 - pr/150, 0, 1) * 0.9;
      g.fillStyle='rgba(170,180,190,.7)';
      g.beginPath(); g.arc(x + Math.sin(pr/16+i)*13, y-150*u.sc - pr, 7+pr*0.07, 0, 7); g.fill();
      g.fillStyle='#ee7a5f';
      g.beginPath(); g.arc(x + Math.sin(pr/16+i)*13, y-150*u.sc - pr, 3.2, 0, 7); g.fill();
      g.globalAlpha = 1;
    }
  }
  else if (fail === 'murk'){
    if (Math.random()<.7) emitSteam(x, y-140*u.sc, 2, {speed:1.6, col:'rgba(200,205,195,.7)'});
    g.save(); g.globalAlpha=.5;
    g.fillStyle='#6a6a52';
    g.beginPath(); g.ellipse(x, y-60, 40, 26, 0, 0, 7); g.fill();
    g.restore();
  }
  else if (fail === 'burnt'){
    emitSmoke(x, y-130*u.sc, 2, 'rgba(40,36,34,.75)');
    if (k > .3) emitFire(x, y-40, 1);
    g.save(); g.globalAlpha = clamp((k-.2)*1.6,0,.8);
    g.fillStyle='#2b211a';
    g.beginPath(); g.ellipse(x, y-70, 34, 44, 0, 0, 7); g.fill();
    g.restore();
  }
  else if (fail === 'goo'){
    if (Math.random()<.8) emitGoo(x+rnd(-22,22), y-34, 1);
    const pw = clamp(k,0,1) * 110;
    g.fillStyle='rgba(130,55,170,.6)';
    g.beginPath(); g.ellipse(x, y+6, pw, pw*0.2, 0, 0, 7); g.fill();

    g.beginPath(); g.ellipse(x-pw*.2, y+3, pw*.4, pw*0.09, 0, 0, 7); g.fill();
  }
}

/* product jar that shows what you actually made */
/* ============================================================
   what actually comes out of each bay, drawn as the real thing
   ============================================================ */
function sepProduct(kind, x, y, good, fail){
  if (!good){ badProduct(x, y, fail); return; }
  g.save();
  if (kind === 'water'){
    /* a jar of clear water, and the salt it left behind */
    g.fillStyle='rgba(215,240,250,.16)'; rr(x-46,-52+y, 44, 52, 6); g.fill();
    g.save(); g.beginPath(); rr(x-44, y-50, 40, 48, 5); g.clip();
    liquid(x-44, y-34, 40, 32, {r:0, c1:'#2f8fc4', c2:'#7fe0f8'});
    g.restore();
    g.strokeStyle='rgba(225,245,255,.7)'; g.lineWidth=2.2; rr(x-46, y-52, 44, 52, 6); g.stroke();
    txt('WATER', x-24, y+14, 11, '#8fe8b8');
    // the salt cake
    g.fillStyle='#8a939a'; rr(x+6, y-14, 46, 14, 3); g.fill();
    for (let i=0;i<16;i++){
      g.save(); g.translate(x+12+nz(i)*36, y-18-nz(i+7)*10); g.rotate(nz(i+3)*3);
      g.fillStyle = i%3 ? '#ffffff' : '#e8eef2';
      const sz = 3.4+nz(i+11)*3; g.fillRect(-sz/2,-sz/2,sz,sz); g.restore();
    }
    txt('SALT', x+29, y+14, 11, '#cfe6f2');
  }
  else if (kind === 'ethanol'){
    /* two bottles, correctly labelled */
    const bot = (bx, col, lab, lvl)=>{
      g.fillStyle='rgba(215,240,250,.16)'; rr(bx-17, y-58, 34, 58, 5); g.fill();
      g.save(); g.beginPath(); rr(bx-15, y-56, 30, 54, 4); g.clip();

      g.strokeStyle='rgba(225,245,255,.7)'; g.lineWidth=2; rr(bx-17, y-58, 34, 58, 5); g.stroke();
      g.fillStyle='#8a939a'; rr(bx-7, y-66, 14, 9, 3); g.fill();
      g.fillStyle='#f6f2e2'; rr(bx-15, y-34, 30, 13, 2); g.fill();
      txt(lab, bx, y-27, 9, '#2f4250');
    };
    bot(x-24, ['#b8a02a','#f0dc6a'], 'ETHANOL', .74);
    bot(x+22, ['#2f8fc4','#7fe0f8'], 'WATER',   .62);
    txt('two products', x, y+14, 11, '#8fe8b8');
  }
  else if (kind === 'co2'){
    /* a captured-CO2 cylinder and a clean stack plume */
    g.fillStyle='#4a5f6c'; rr(x-44, y-64, 32, 64, 14); g.fill();
    g.fillStyle='#3a4d58'; rr(x-24, y-64, 12, 64, 12); g.fill();
    g.strokeStyle='#2c3b45'; g.lineWidth=2; rr(x-44, y-64, 32, 64, 14); g.stroke();
    g.fillStyle='#8a939a'; rr(x-33, y-74, 10, 12, 3); g.fill();
    g.fillStyle='#f6f2e2'; rr(x-43, y-42, 30, 14, 2); g.fill();
    txt('CO2', x-28, y-35, 11, '#2f4250');
    // clean gas going on its way
    g.fillStyle='#3d4a54'; rr(x+4, y-46, 46, 22, 5); g.fill();
    g.save(); g.beginPath(); rr(x+6, y-44, 42, 18, 4); g.clip();
    g.fillStyle='#1d3644'; g.fillRect(x+6, y-44, 42, 18);
    for (let i=0;i<7;i++){
      const px = x+6 + ((T*1.6 + i*12) % 44);
      g.fillStyle='rgba(180,225,245,.7)';
      g.beginPath(); g.arc(px, y-35 + Math.sin(T/12+i)*4, 2.2, 0, 7); g.fill();
    }
    g.restore();
    txt('lean gas', x+27, y+14, 11, '#8fe8b8');
  }
  else if (kind === 'dryair'){
    /* an air receiver with a dew point that finally meets spec */
    g.fillStyle='#6a7a86'; rr(x-40, y-58, 80, 50, 16); g.fill();
    g.fillStyle='#57666f'; rr(x+8, y-58, 32, 50, 16); g.fill();
    g.strokeStyle='#3e4b54'; g.lineWidth=2.2; rr(x-40, y-58, 80, 50, 16); g.stroke();
    g.fillStyle='#8a939a'; rr(x-36, y-8, 10, 10, 2); g.fill(); rr(x+26, y-8, 10, 10, 2); g.fill();
    readout(x-32, y-48, 64, 30, ['-42 C dp'], { size:13, col:'#5ce8a8' });
    txt('dry air', x, y+14, 11, '#8fe8b8');
  }
  else {
    /* free-flowing dry sugar in an open sack */
    g.fillStyle='#d8c9a8';
    g.beginPath();
    g.moveTo(x-34, y); g.lineTo(x-26, y-48); g.lineTo(x+26, y-48); g.lineTo(x+34, y);
    g.closePath(); g.fill();
    g.fillStyle='#c4b492';
    g.beginPath(); g.moveTo(x+10, y-48); g.lineTo(x+26, y-48); g.lineTo(x+34, y); g.lineTo(x+18, y);
    g.closePath(); g.fill();
    g.strokeStyle='#a89876'; g.lineWidth=2;
    g.beginPath(); g.moveTo(x-34, y); g.lineTo(x-26, y-48); g.lineTo(x+26, y-48); g.lineTo(x+34, y);
    g.closePath(); g.stroke();
    // a heap of crystals spilling over the top
    for (let i=0;i<26;i++){
      g.save(); g.translate(x-24+nz(i)*48, y-52-nz(i+9)*9); g.rotate(nz(i+4)*3);
      g.fillStyle = i%4 ? '#fbf7ec' : '#ffffff';
      const sz = 3.2+nz(i+13)*3.4; g.fillRect(-sz/2,-sz/2,sz,sz);
      g.restore();
    }
    g.fillStyle='#f6f2e2'; rr(x-20, y-30, 40, 15, 2); g.fill();
    txt('SUGAR', x, y-22, 11, '#2f4250');
    txt('dry, free flowing', x, y+14, 11, '#8fe8b8');
  }
  g.restore();
}

/* whatever you made instead, when the unit was wrong */
function badProduct(x, y, fail){
  g.fillStyle='rgba(215,240,250,.14)'; rr(x-26, y-52, 52, 52, 7); g.fill();
  g.save(); g.beginPath(); rr(x-24, y-50, 48, 48, 6); g.clip();
  if (fail === 'goo' || fail === 'sludge'){
    g.fillStyle = fail==='goo' ? '#7a2fa8' : '#6b5c3a'; g.fillRect(x-24, y-28, 48, 26);
    for (let i=0;i<5;i++){ g.fillStyle = fail==='goo' ? 'rgba(180,100,220,.7)':'rgba(140,124,84,.7)';
      g.beginPath(); g.arc(x-18+i*9, y-28+Math.sin(T/14+i)*3, 5.4, 0, 7); g.fill(); }
  } else if (fail === 'burnt'){
    g.fillStyle='#241c16'; g.fillRect(x-24, y-30, 48, 28);
    if (Math.random()<.2) emitSmoke(x, y-30, 1, 'rgba(60,54,50,.5)');
  } else if (fail === 'blow'){
    g.fillStyle='rgba(120,140,155,.2)'; g.fillRect(x-24, y-50, 48, 48);
    txt('empty', x, y-26, 12, 'rgba(210,230,240,.5)','center',400);
  } else if (fail === 'crust' || fail === 'spray'){
    g.fillStyle='#6a7480'; g.fillRect(x-24, y-24, 48, 22);
    for (let i=0;i<12;i++){ g.fillStyle='rgba(255,255,255,.85)';
      g.beginPath(); g.arc(x-20+nz(i)*40, y-24+nz(i+5)*20, 2.6, 0, 7); g.fill(); }
  } else {
    g.fillStyle='#5c6b5a'; g.fillRect(x-24, y-26, 48, 24);
    for (let i=0;i<10;i++){ g.fillStyle='rgba(180,190,175,.5)';
      g.beginPath(); g.arc(x-20+nz(i)*40, y-24+nz(i+4)*18, 3.4, 0, 7); g.fill(); }
  }
  g.restore();
  g.strokeStyle='rgba(225,245,255,.6)'; g.lineWidth=2.4; rr(x-26, y-52, 52, 52, 7); g.stroke();
  g.fillStyle='#8a939a'; rr(x-14, y-60, 28, 9, 3); g.fill();
  txt('off spec', x, y+14, 11, '#e8a0a0');
}

/* ============================================================
   the scene
   ============================================================ */
const S_sep = {
  enter(){
    Music.play('lab');
    Hint.begin('sep');
    this.px = 60; this.py = 596; this.face='right'; this.walkT=0; this.stepT=0;
    this.mode = 'walkin';                 // walkin | free | bay | outro
    this.bayI = -1; this.phase=''; this.pk=0;
    this.choice = null; this.ok = false; this.fail = null;
    this.solved = [false,false,false,false,false];
    this.ppeStage = 0;                    // 0 nothing, 1 goggles, 2 coat
    this.ppeMsg = null; this.ppeMsgT = 0; this.ppeAnim = 0;
    this.convo = null; this.reactT = 0;
    this.scored = false; this.quiz = null; this.quizScore = 0;
    this.mutter = mutterFor('sep'); this.mutterT = 210;
    this.chatT = 420; this.chatI = 0; this.chat = null;
    after(60, ()=>{ this.mode = 'free'; });
  },
  exit(){
    if (!this.scored){
      this.scored = true;
      award('sep', this.solved.filter(Boolean).length, SEP_BAYS.length);
      award('saf', this.ppeStage, 2);
      if (isHard()) award('sep', this.quizScore || 0, 3);
      if (this.solved.every(Boolean)) G.done.sep = true;
    }
  },
  camX(){ return clamp(this.px - W/2, 0, SEP_ROOM - W); },
  /* a feed is 'known' once it has been analysed, or once you solved that bay */
  bayKnown(i){ return this.solved[i] || (this.bayI === i && this.inspected)
                    || !needsInspection('sep'); },

  /* ---------- PPE station ---------- */
  ppeExcuses(){
    if (hero.safety === 2) return null;
    if (hero.safety === 1) return ['Fine. I suppose the rules are the rules.'];
    return [
      'Goggles? For a beaker? I will be careful.',
      'Alright, in case something unexpected happens. Which it will not.',
      'Fine. Fine! I am putting them on. Look at me. Safety.'
    ];
  },
  tryPPE(){
    const ex = this.ppeExcuses();
    if (!ex){                             // safety-conscious: instant
      this.ppeStage = 2; G.ppe.goggles = true; G.ppe.coat = true;
      this.ppeAnim = 40; SFX.pickup();
      this.ppeMsg = 'Goggles, coat. Now we can work.'; this.ppeMsgT = 150;
      return;
    }
    G.ppeTries++;
    if (G.ppeTries >= ex.length){
      this.ppeStage = 2; G.ppe.goggles = true; G.ppe.coat = true;
      this.ppeAnim = 40; SFX.pickup();
    } else { SFX.click(); shake(3); }
    this.ppeMsg = ex[Math.min(G.ppeTries-1, ex.length-1)]; this.ppeMsgT = 170;
  },

  drawPPEStation(){
    const x = 170, y = 604;

    txt('PPE', x, y-174, 17, '#f5c22b');
    // hanging goggles + coat, they vanish once worn
    if (this.ppeStage < 2){
      const bobY = Math.sin(T/22)*2;

      g.save(); g.translate(x-34, y-108+bobY);
      g.fillStyle='rgba(150,228,255,.5)'; rr(-19,-8,38,15,5); g.fill();
      g.strokeStyle='#2a3a46'; g.lineWidth=3; rr(-19,-8,38,15,5); g.stroke();
      g.strokeStyle='#3d4d5a'; g.lineWidth=3;
      g.beginPath(); g.moveTo(-19,0); g.lineTo(-27,-4); g.moveTo(19,0); g.lineTo(27,-4); g.stroke();
      g.restore();
      // lab coat on a hanger

      g.beginPath(); g.moveTo(0,-14); g.lineTo(0,-6); g.moveTo(-14,-6); g.lineTo(14,-6); g.stroke();
      g.fillStyle='#f4f7f9';
      g.beginPath(); g.moveTo(-14,-6); g.lineTo(14,-6); g.lineTo(19,46); g.lineTo(-19,46); g.closePath(); g.fill();
      g.strokeStyle='#c3ced6'; g.lineWidth=1.4;
      g.beginPath(); g.moveTo(0,-6); g.lineTo(0,46); g.stroke();
      g.restore();

    /* ================= room ================= */

    // wall

    pipeSeg(0, 46, SEP_ROOM, 46, 13, {shell:'#2c6076', inner:'#1b4053'});
    pipeSeg(0, 66, SEP_ROOM, 66, 9,  {shell:'#3a7a6a', inner:'#245046'});
    flowDots([[0,46],[SEP_ROOM,46]], 1.3, .45, 'rgba(150,235,255,.5)', 3);

    // strip lights and their cones
    for (const b of SEP_BAYS){
      g.fillStyle='#1c3a49'; rr(b.x-62, 92, 124, 15, 4); g.fill();
      g.fillStyle='rgba(225,248,255,.85)'; rr(b.x-56, 100, 112, 6, 3); g.fill();
      const lamp = g.createLinearGradient(0, 107, 0, 560);
      lamp.addColorStop(0,'rgba(190,235,255,.16)'); lamp.addColorStop(1,'rgba(190,235,255,0)');
      g.fillStyle = lamp;
      g.beginPath(); g.moveTo(b.x-56,107); g.lineTo(b.x+56,107);
      g.lineTo(b.x+160,560); g.lineTo(b.x-160,560); g.closePath(); g.fill();
    }

    /* ---- wall furniture between and behind the bays ---- */
    for (let i=0;i<SEP_BAYS.length;i++){
      const b = SEP_BAYS[i];
      // glassware shelf behind the bench
      g.fillStyle='#1a3f52'; rr(b.x-150, 268, 300, 126, 5); g.fill();
      g.fillStyle='#143444'; rr(b.x-150, 268, 300, 126, 5); g.fill();
      g.strokeStyle='#27596f'; g.lineWidth=2.4; rr(b.x-150, 268, 300, 126, 5); g.stroke();
      for (let sh=0; sh<2; sh++){
        const sy = 324 + sh*60;
        g.fillStyle='#27596f'; g.fillRect(b.x-150, sy, 300, 6);
        // bottles and flasks
        for (let k=0;k<7;k++){
          const gx = b.x-132 + k*42, seed2 = i*13+sh*7+k;
          const hgt = 22 + nz(seed2)*20, wdt = 11 + nz(seed2+3)*9;
          const col = ['#6fd8c8','#f0c05a','#e07a90','#8fb8f0','#a8e08a'][Math.floor(nz(seed2+9)*5)];
          g.fillStyle='rgba(220,245,255,.16)';
          rr(gx-wdt/2, sy-hgt, wdt, hgt, 3); g.fill();
          g.fillStyle=col; g.globalAlpha=.55;
          rr(gx-wdt/2+1.5, sy-hgt*0.55, wdt-3, hgt*0.55-1.5, 2.5); g.fill();
          g.globalAlpha=1;
          g.strokeStyle='rgba(225,245,255,.34)'; g.lineWidth=1.2;
          rr(gx-wdt/2, sy-hgt, wdt, hgt, 3); g.stroke();
          g.fillStyle='rgba(200,225,238,.5)'; g.fillRect(gx-2.2, sy-hgt-5, 4.4, 5);
        }
      }
      // a small poster between bays
      if (i < SEP_BAYS.length-1){
        const px = (b.x + SEP_BAYS[i+1].x)/2;
        g.fillStyle='#e8e2d0'; rr(px-52, 282, 104, 130, 4); g.fill();
        g.strokeStyle='#b8b0a0'; g.lineWidth=2; rr(px-52, 282, 104, 130, 4); g.stroke();
        txt(['KNOW YOUR','BOILING','POINTS'][0], px, 300, 11, '#2a3a44');
        // a tiny column diagram
        g.strokeStyle='#4a7a92'; g.lineWidth=2.4;
        g.strokeRect(px-13, 316, 26, 74);
        for (let k=0;k<5;k++){ g.beginPath(); g.moveTo(px-11, 326+k*13); g.lineTo(px+11, 326+k*13); g.stroke(); }
        txt('read the feed', px, 404, 10, '#5a6a74','center',400);
      }
    }
    // extractor hood at the far end
    g.fillStyle='#25505f'; rr(SEP_ROOM-230, 240, 190, 60, 6); g.fill();
    g.fillStyle='#1b3e4b'; rr(SEP_ROOM-200, 100, 44, 145, 4); g.fill();
    g.strokeStyle='#3a7288'; g.lineWidth=2.2; rr(SEP_ROOM-230, 240, 190, 60, 6); g.stroke();
    txt('EXTRACT', SEP_ROOM-135, 270, 15, '#7fd0f0');
    // exit door at the far right
    g.fillStyle='#0a2433'; rr(SEP_ROOM-120, 396, 96, 214, 6); g.fill();
    g.strokeStyle= this.solved.every(Boolean) ? '#3fd07f' : 'rgba(120,150,165,.45)';
    g.lineWidth=3; rr(SEP_ROOM-120, 396, 96, 214, 6); g.stroke();
    txt('EXIT', SEP_ROOM-72, 372, 16,
        this.solved.every(Boolean) ? '#3fd07f' : 'rgba(150,180,195,.55)');
    // floor
    const fl = g.createLinearGradient(0,610,0,H);
    fl.addColorStop(0,'#1a4457'); fl.addColorStop(1,'#0a2130');
    g.fillStyle=fl; g.fillRect(0,610,SEP_ROOM,H-610);
    g.fillStyle='rgba(245,181,61,.4)'; g.fillRect(0,612,SEP_ROOM,4);
    for (let i=0;i<SEP_ROOM/60;i++){ g.strokeStyle='rgba(255,255,255,.028)'; g.lineWidth=2;
      g.beginPath(); g.moveTo(i*60,616); g.lineTo(i*60-70,H); g.stroke(); }

    this.drawPPEStation();

    /* ================= bays ================= */
    let nearBay = -1;
    SEP_BAYS.forEach((b,i)=>{
      const solved = this.solved[i];
      const active = this.mode==='bay' && this.bayI===i;
      // bench
      g.fillStyle='#3a5666'; rr(b.x-170, 560, 340, 18, 5); g.fill();
      g.fillStyle='#2b4250'; rr(b.x-160, 578, 320, 34, 4); g.fill();
      g.fillStyle='#213543'; rr(b.x-160, 578, 320, 8, 3); g.fill();
      // install pad
      const padOn = active && (this.phase==='pick');
      g.fillStyle = solved ? 'rgba(63,208,127,.14)'
                  : padOn ? `rgba(35,166,224,${.2+Math.sin(T/10)*.1})` : 'rgba(35,166,224,.07)';
      g.beginPath(); g.ellipse(b.x+96, 610, 76, 17, 0, 0, 7); g.fill();
      g.strokeStyle = solved ? 'rgba(63,208,127,.5)' : 'rgba(35,166,224,.35)';
      g.lineWidth=2; g.setLineDash([7,7]);
      g.beginPath(); g.ellipse(b.x+96, 610, 76, 17, 0, 0, 7); g.stroke(); g.setLineDash([]);

      // sample sitting on the bench (it is consumed once the unit runs)
      const consumed = active && (this.phase==='run' || this.phase==='react');
      if (!solved && !consumed) sepSample(b.sample, b.x-70, 560, solved || this.bayKnown(i));
      else if (!solved && consumed) { /* the jar takes its place below */ }
      else {
        // solved: show the chosen unit standing proud
        const u = sepUnit(b.right);
        u.draw(b.x+96, 610, u.sc*0.9, {run:true});
        sepProduct(b.product, b.x-70, 558, true, null);
      }

      // bay label
      panel(b.x-96, 212, 192, 40, 'rgba(5,22,33,.9)',
            solved ? 'rgba(63,208,127,.6)' : 'rgba(35,166,224,.45)', 8);
      txt(b.tag, b.x, 232, 15, solved ? '#8fe8b8' : '#9fd8ef');

      // the unit being built / run, during the bay sequence
      if (active && (this.phase==='build' || this.phase==='run' || this.phase==='react')){
        const u = sepUnit(this.choice);
        if (this.phase === 'build'){
          const k = this.pk/70;
          if (k > .3){
            g.save(); g.globalAlpha = clamp((k-.3)/.4,0,1);
            u.draw(b.x+96, 610, u.sc, {});
            g.restore();
          }
          buildCloud(b.x+96, 574, 74, k);
        } else {
          sepOutcome(this.fail, this.choice, b.x+96, 610, this.pk/90);
          sepProduct(b.product, b.x-70, 558, this.ok, this.fail);
        }
      }

      if (this.mode==='free' && !solved && Math.abs(this.px - b.x) < 110) nearBay = i;
    });

    drawParts();

    /* ================= the engineer ================= */
    const talking = this.convo && !this.convo.done;
    let face = 'neutral', sweat = 0, pose, tilt = 0, lift = 0;
    if (this.mode==='bay' && this.phase==='react'){
      if (this.ok){ face = 'proud'; pose = 'cheer'; }
      else { face = 'shock'; sweat = 2; pose = 'panic'; }
      lift = this.ok ? -Math.abs(Math.sin(T/9))*9 : 0;
      tilt = this.ok ? 0 : Math.sin(T/6)*0.05;
    } else if (this.mode==='bay' && this.phase==='build'){
      face = 'happy'; pose = 'work';
    } else if (this.mode==='bay' && this.phase==='inspect'){
      face = 'neutral'; pose = 'think';
    } else if (this.ppeAnim > 0){ face = 'happy'; pose = 'wave'; }
    drawPerson(hero, this.px, this.py, 2.0, {
      dir:this.face, walk:this.walkT, face, sweat, pose, tilt, lift, seed:5,
      talk: talking, ppe:{ hat:true, goggles:G.ppe.goggles, coat:G.ppe.coat }
    });
    if (this.ppeAnim > 0){
      this.ppeAnim -= dt;
      for (let i=0;i<2;i++) emitSpark(this.px+rnd(-26,26), this.py-rnd(90,190), 1, '#bff2ff');
    }

    g.restore();  /* ---- end of world transform ---- */

    /* ================= movement ================= */
    if (this.mode === 'walkin'){
      this.px += 3.2*dt; this.walkT += dt*2.4; this.face='right';
      this.stepT += dt; if (this.stepT>12){ this.stepT=0; SFX.step(); }
    }
    else if (this.mode === 'free'){
      let dx=0, dy=0;
      if (keys.ArrowLeft||keys.a||keys.A) dx--;
      if (keys.ArrowRight||keys.d||keys.D) dx++;
      if (keys.ArrowUp||keys.w||keys.W) dy--;
      if (keys.ArrowDown||keys.s||keys.S) dy++;
      if (dx) this.face = dx>0?'right':'left';
      if ((dx||dy) && !trans){
        this.px = clamp(this.px + dx*3.6*dt, 46, SEP_ROOM-46);
        this.py = clamp(this.py + dy*1.9*dt, 578, 672);
        this.walkT += dt*2.4;
        this.stepT += dt; if (this.stepT>12){ this.stepT=0; SFX.step(); }
      } else this.walkT = 0;

      // PPE prompt
      if (Math.abs(this.px-170) < 100 && this.ppeStage < 2){
        this.promptAt(170-cam, 'SPACE   —   suit up', '#f5c22b');
        if (keyPressed(' ','Enter','Space')) this.tryPPE();
      }
      else if (nearBay >= 0){
        const b = SEP_BAYS[nearBay];
        this.promptAt(b.x-cam, 'SPACE   —   work this sample', '#3fd0c0');
        if (keyPressed(' ','Enter','Space')) this.openBay(nearBay);
      }
      // leaving
      if (this.px > SEP_ROOM-80 && this.solved.every(Boolean)){
        if (isHard() && !G.quizDone.sep){
          this.quiz = makeTFQuiz('sep', (correct)=>{
            G.quizDone.sep = true; this.quizScore = correct; this.quiz = null;
            go(S_hub, 'fade');
          });
          this.mode = 'quiz';
        } else go(S_hub, 'fade');
      }
    }

    if (this.ppeMsgT > 0){
      this.ppeMsgT -= dt;
      bubble(this.ppeMsg, this.px - cam, this.py - 196, {w:290, size:17, pop:1});
    }
    if (this.mutterT > 0 && this.mode !== 'bay'){
      this.mutterT -= dt;
      if (this.mutterT < 180)
        bubble(this.mutter, this.px - cam, this.py - 196, {w:300, size:17, pop:1});
    }
    /* the running commentary, right or wrong depending on who you picked */
    else if (this.mode === 'free' && this.ppeMsgT <= 0){
      this.chatT -= dt;
      if (this.chatT < 0){
        const pool = isWeak('sep') ? SEP_CHATTER : SEP_CHATTER_OK;
        this.chat = pool[this.chatI % pool.length]; this.chatI++;
        this.chatT = 560;
      }
      if (this.chat && this.chatT > 380)
        bubble(this.chat, this.px - cam, this.py - 196,
               { w:330, size:17, pop:1,
                 fill: isWeak('sep') ? 'rgba(252,250,235,.97)' : 'rgba(250,252,254,.97)',
                 stroke: isWeak('sep') ? 'rgba(245,181,61,.9)' : 'rgba(35,166,224,.85)' });
    }

    /* ================= the bay panel ================= */
    if (this.mode === 'bay') this.drawBay(cam);
    if (this.mode === 'quiz' && this.quiz){ this.quiz.draw(); return; }

    /* ================= hint + hud ================= */
    if (this.mode === 'bay' && this.phase === 'pick'){
      const b = SEP_BAYS[this.bayI];
      if (Hint.draw(76, 150, 210, 250)) Hint.use(b.hint);
    } else if (this.mode !== 'bay') {
      if (Hint.draw(76, 150, 210, 250))
        Hint.use('Read what the feed actually is. Solid or liquid, gas or not, and what you were handed to work with.');
    }

    vignette(.34);
    const n = this.solved.filter(Boolean).length;
    hudEl.textContent = `Separation Techniques Lab   ·   samples ${n}/${SEP_BAYS.length}` +
      (this.ppeStage<2 ? '   ·   PPE not worn' : '   ·   PPE on');
  },

  promptAt(sx, label, col){
    g.save(); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=12;
    g.fillStyle='rgba(5,22,33,.96)'; rr(sx-140, 396, 280, 42, 10); g.fill(); g.restore();
    g.strokeStyle=col; g.lineWidth=2.2; rr(sx-140, 396, 280, 42, 10); g.stroke();
    txt(label, sx, 418, 17, '#eaf4fa');
  },

  openBay(i){
    SFX.click();
    this.mode='bay'; this.bayI=i; this.phase='show'; this.pk=0;
    this.choice=null; this.ok=false; this.fail=null;
    this.inspected = false; this.inspectK = 0;
    const b = SEP_BAYS[i];
    const sk = skill('sep');
    const at = ()=>[W/2, 300];
    const lines = [{ by:'THE BRIEF', text:b.prompt, at, w:440, name:true }];
    /* the first impression.  A strong engineer reads it correctly; everyone
       else says something confident and wrong, which is the whole point. */
    if (isStrong('sep'))       lines.push({ by:hero.name, text:b.strong, at, w:400 });
    else if (skill('sep')===1 && !isHard())
                               lines.push({ by:hero.name, text:b.glanceOk, at, w:400 });
    else                       lines.push({ by:hero.name, text:b.glance, at, w:400, think:true });
    this.convo = Convo(lines, ()=>{
      this.convo = null;
      this.phase = 'pick';
      if (needsInspection('sep')) toast('You have not actually looked at it yet.');
    });
  },

  drawBay(cam){
    const b = SEP_BAYS[this.bayI];
    const sk = skill('sep');

    if (this.phase === 'show'){
      shade(.74);
      // a soft spotlight on the sample while the engineer reads it
      const sp = g.createRadialGradient(W/2, 300, 30, W/2, 300, 340);
      sp.addColorStop(0,'rgba(120,200,240,.20)'); sp.addColorStop(1,'rgba(120,200,240,0)');
      g.fillStyle = sp; g.fillRect(0,0,W,H);
      g.fillStyle='rgba(35,166,224,.10)';
      g.beginPath(); g.ellipse(W/2, 312, 190, 30, 0, 0, 7); g.fill();
      sepSample(b.sample, W/2, 300, this.inspected || !needsInspection('sep'));
      txt(b.tag, W/2, 56, 16, '#f5b53d');
      txt('reading the feed', W/2, 84, 26, '#cfe6f2','center',400);
      if (this.convo) this.convo.draw();
      return;
    }

    if (this.phase === 'inspect'){ this.drawInspect(b); return; }

    if (this.phase === 'pick'){
      const locked = needsInspection('sep') && !this.inspected;

      /* the unit tray along the bottom */
      const n = SEP_UNITS.length, tw = 196, gap = 14;
      const x0 = (W - (n*tw + (n-1)*gap))/2;
      g.fillStyle='rgba(3,14,22,.97)'; g.fillRect(0, H-208, W, 208);
      g.strokeStyle='rgba(35,166,224,.3)'; g.lineWidth=2;
      g.beginPath(); g.moveTo(0,H-208); g.lineTo(W,H-208); g.stroke();
      txt(locked ? 'inspect the feed before you install anything'
                 : 'pick the unit and drop it on the pad',
          W/2, H-186, 17, locked ? '#f5b53d' : '#9fd8ef','center',400);

      SEP_UNITS.forEach((u,i)=>{
        const x = x0 + i*(tw+gap), y = H-168, h = 152;
        const z = locked ? {hover:false, clicked:false} : zone(x, y, tw, h);
        // ghost highlight from the engineer's instincts
        const ghostGood = ghostHelp('sep') && u.id===b.right;
        const ghostBad  = (isWeak('sep') && !this.inspected) && u.id===b.weakPick;
        const hinted    = G.hintUsed['sep'] && Hint.shown>0 && u.id===b.right;
        let ring = null;
        if (ghostGood || hinted) ring = 'rgba(63,208,127,';
        else if (ghostBad) ring = 'rgba(238,95,110,';
        g.save();
        g.globalAlpha = locked ? .35 : 1;
        if (z.hover){ g.shadowColor='#23a6e0'; g.shadowBlur=20; }
        g.fillStyle = z.hover ? 'rgba(16,58,80,.98)' : 'rgba(8,32,46,.94)';
        rr(x, z.hover?y-4:y, tw, h, 10); g.fill();
        g.restore();
        g.save(); g.globalAlpha = locked ? .35 : 1;
        if (ring){
          g.strokeStyle = ring + (0.5 + Math.sin(T/10)*0.35) + ')'; g.lineWidth = 3.4;
        } else { g.strokeStyle = z.hover ? '#23a6e0' : 'rgba(35,166,224,.3)'; g.lineWidth = 2; }
        rr(x, z.hover?y-4:y, tw, h, 10); g.stroke();
        const yy = z.hover?y-4:y;
        g.save();
        g.translate(x+tw/2, yy+110); g.scale(0.86, 0.86);
        u.draw(0, 0, u.sc, { run: z.hover });
        g.restore();
        txt(u.name, x+tw/2, yy+128, 17, z.hover?'#fff':'#cfe6f2');
        txt(u.sub,  x+tw/2, yy+144, 12, 'rgba(159,216,239,.7)','center',400);
        g.restore();
        if (z.clicked) this.choose(u.id);
      });

      /* the brief stays on screen */
      panel(W/2-330, 166, 660, 88, 'rgba(4,18,28,.92)', 'rgba(35,166,224,.5)');
      txt(b.tag, W/2, 188, 14, '#f5b53d');
      wrapText(b.prompt, W/2, 218, 600, 24, 19, '#dceaf2', 'center', 400);

      /* the analyser: look properly before you commit */
      this.drawAnalyser(b, locked);
      return;
    }

    if (this.phase === 'build'){
      this.pk += dt;
      if (!this.placedSfx){ this.placedSfx = true; SFX.place(); }
      if (this.pk > 70){ this.phase='run'; this.pk=0;
        if (this.ok) SFX.good(); else { SFX.bad(); if (this.fail==='burnt') SFX.fire();
          if (this.fail==='flood'||this.fail==='sludge') SFX.pour();
          if (this.fail==='goo') SFX.squelch();
          if (this.fail==='crust') SFX.steam(); shake(7); }
      }
      return;
    }

    if (this.phase === 'run'){
      this.pk += dt;
      if (this.pk > 90){ this.phase='react'; this.pk=0; this.reactT=0;
        if (this.ok) SFX.great(); else SFX.wahwah();
      }
      return;
    }

    if (this.phase === 'react'){
      this.pk += dt;
      const b2 = SEP_BAYS[this.bayI];
      const msg = this.ok ? b2.why : (b2.wrong[this.choice] || {line:'That is not the one.'}).line;
      panel(W/2-350, H-160, 700, 116, this.ok?'rgba(10,44,32,.95)':'rgba(48,16,22,.95)',
            this.ok?'#3fd07f':'#ee5f6e');
      txt(this.ok ? 'THAT IS THE ONE' : 'NOT THAT ONE', W/2, H-126, 26, this.ok?'#3fd07f':'#ee5f6e');
      wrapText(msg, W/2, H-88, 640, 25, 19, '#e4eef4','center',400);

      if (this.pk > 60){
        if (button(this.ok ? 'NEXT SAMPLE' : 'TRY AGAIN', W/2-110, H-40, 220, 34,
                   {col:this.ok?'#3fd07f':'#ee5f6e', size:16})){
          if (this.ok){
            this.solved[this.bayI] = true;
            this.mode='free'; this.convo=null;
            if (this.solved.every(Boolean)){
              toast('All five samples cleared. Head for the exit on the right.');
            }
          } else {
            this.phase='pick'; this.pk=0;
            // an average engineer works it out after failing once
            if (skill('sep')===1) hero._sepLearned = true;
          }
        }
      }
      return;
    }
  },

  /* the bench analyser.  Reading it is how you find out what the feed
     really is, which matters most for the people who guessed wrong. */
  drawAnalyser(b, locked){
    const px = W/2 - 250, py = H-290, pw = 500, ph = 76;
    if (!this.inspected){
      const z = zone(px, py, pw, ph);
      g.save();
      if (z.hover){ g.shadowColor='#f5b53d'; g.shadowBlur=20; }
      g.fillStyle = z.hover ? 'rgba(62,44,10,.98)' : 'rgba(26,20,8,.94)';
      rr(px, z.hover?py-3:py, pw, ph, 12); g.fill(); g.restore();
      g.strokeStyle = locked ? `rgba(245,181,61,${.6+Math.sin(T/10)*.35})` : 'rgba(245,181,61,.6)';
      g.lineWidth = locked ? 3.2 : 2;
      rr(px, z.hover?py-3:py, pw, ph, 12); g.stroke();
      // a little instrument icon
      g.save(); g.translate(px+44, (z.hover?py-3:py)+ph/2);
      g.strokeStyle='#f5b53d'; g.lineWidth=3; g.lineCap='round';
      g.beginPath(); g.arc(-2,-3, 11, 0, 7); g.stroke();
      g.beginPath(); g.moveTo(6,5); g.lineTo(15,15); g.stroke();
      g.restore();
      txt('INSPECT THE FEED', px+pw/2+20, (z.hover?py-3:py)+30, 20, '#f5d78a');
      txt('take a reading with the ' + b.probe, px+pw/2+20, (z.hover?py-3:py)+54, 14,
          'rgba(245,215,138,.7)','center',400);
      if (z.clicked){ this.phase='inspect'; this.inspectK=0; SFX.click(); }
    } else {
      panel(px, py-14, pw, ph+14, 'rgba(5,26,20,.95)', 'rgba(63,208,127,.55)');
      txt(b.probe.toUpperCase(), px+16, py+6, 12, '#8fe8b8','left');
      b.readout.forEach(([lab,val],i)=>{
        const cx = px + 16 + i*(pw-32)/b.readout.length;
        txt(lab, cx, py+32, 11, 'rgba(159,216,239,.7)','left',400);
        txt(val, cx, py+52, 16, '#5ce8a8','left');
      });
    }
  },

  /* the inspection itself */
  drawInspect(b){
    shade(.78);
    const sp = g.createRadialGradient(W/2, 262, 30, W/2, 262, 330);
    sp.addColorStop(0,'rgba(245,181,61,.16)'); sp.addColorStop(1,'rgba(245,181,61,0)');
    g.fillStyle = sp; g.fillRect(0,0,W,H);
    sepSample(b.sample, W/2, 262, this.inspectK > 90);

    this.inspectK += dt;
    const k = clamp(this.inspectK/110, 0, 1);

    /* a magnifier sweeping over the sample */
    const mx = W/2 - 150 + Math.sin(this.inspectK/26) * 150;
    const my = 200 + Math.cos(this.inspectK/19) * 34;
    g.save();
    g.strokeStyle='rgba(245,215,138,.9)'; g.lineWidth=5;
    g.beginPath(); g.arc(mx, my, 40, 0, 7); g.stroke();
    g.fillStyle='rgba(180,230,255,.10)'; g.beginPath(); g.arc(mx, my, 40, 0, 7); g.fill();
    g.strokeStyle='#8a6a2a'; g.lineWidth=9; g.lineCap='round';
    g.beginPath(); g.moveTo(mx+28, my+28); g.lineTo(mx+58, my+58); g.stroke();
    g.restore();
    if (Math.random() < .25) emitSpark(mx+rnd(-30,30), my+rnd(-30,30), 1, '#ffe08a');

    txt(b.probe.toUpperCase(), W/2, 78, 16, '#f5b53d');
    txt(k < 1 ? 'taking a reading...' : 'reading complete', W/2, 106, 24,
        k < 1 ? '#cfe6f2' : '#8fe8b8', 'center', 400);

    /* the numbers tick up as it reads */
    const bw = 560, bx = W/2 - bw/2, by = 452;
    panel(bx, by, bw, 132, 'rgba(5,20,28,.96)', 'rgba(245,181,61,.55)');
    b.readout.forEach(([lab,val],i)=>{
      const ry = by + 34 + i*32;
      txt(lab, bx+22, ry, 13, 'rgba(159,216,239,.8)','left',400);
      const rk = clamp((k - i*0.22)/0.4, 0, 1);
      txt(rk >= 1 ? val : (rk <= 0 ? '—' : '\u2588'.repeat(1+Math.floor(rk*5))),
          bx+bw-22, ry, 17, rk >= 1 ? '#5ce8a8' : 'rgba(92,232,168,.45)','right');
    });

    if (k >= 1){
      if (!this.revealSaid){
        this.revealSaid = true; SFX.good();
        this.revealConvo = Convo([
          { by:hero.name, text:b.reveal, at:()=>[W/2, 404], w:520 }
        ], ()=>{ this.revealConvo = null; });
      }
      if (this.revealConvo) this.revealConvo.draw();
      else if (button('GOT IT', W/2-100, H-70, 200, 44, {col:'#3fd07f', size:18})){
        this.inspected = true; this.revealSaid = false;
        this.phase = 'pick'; SFX.click();
      }
    }
  },

  choose(id){
    const b = SEP_BAYS[this.bayI];
    this.choice = id;
    this.ok = (id === b.right);
    this.fail = this.ok ? null : (b.wrong[id] ? b.wrong[id].fail : 'blow');
    this.phase = 'build'; this.pk = 0; this.placedSfx = false;
    if (!this.ok) G.blunders++;
  }
};

/* ---------- the product that slides out ---------- */
function reaProduct(kind, x, y, quality, scale){
  /* quality: 'good' | 'wrongtype' ; scale: 'low' | 'ok' | 'high' */
  const s = scale==='high' ? 1.9 : scale==='low' ? 0.42 : 1;
  g.save(); g.translate(x,y); g.scale(s,s);
  if (quality === 'wrongtype'){
    g.fillStyle='rgba(120,50,165,.85)';
    g.beginPath(); g.ellipse(0,-9, 30, 16, 0, 0, 7); g.fill();
    g.fillStyle='rgba(170,90,210,.8)';
    for (let i=0;i<5;i++){
      g.beginPath(); g.arc(-18+i*9, -14 + Math.sin(T/11+i)*4, 7.5, 0, 7); g.fill();
    }
    g.fillStyle='rgba(210,150,240,.6)';
    g.beginPath(); g.arc(-8,-18, 4, 0, 7); g.fill();
    if (Math.random()<.3) emitGoo(x + rnd(-24,24)*s, y-6, 1);
  } else if (kind === 'pill'){
    for (let i=0;i<5;i++){
      g.save(); g.translate(-22+i*11, -8 - (i%2)*6); g.rotate(nz(i)*2);
      g.fillStyle='#f4f7fa'; rr(-7,-4,14,8,4); g.fill();
      g.fillStyle='#e05a7a'; rr(-7,-4,7,8,4); g.fill();
      g.strokeStyle='rgba(120,140,155,.6)'; g.lineWidth=1; rr(-7,-4,14,8,4); g.stroke();
      g.restore();
    }
  } else if (kind === 'fuel'){
    g.fillStyle='#8a6a2a'; rr(-22,-34,44,34,5); g.fill();
    g.fillStyle='#e0a832'; rr(-18,-30,36,26,3); g.fill();
    g.save(); g.beginPath(); rr(-18,-30,36,26,3); g.clip();
    liquid(-18,-20,36,20,{r:0,c1:'#b07a18',c2:'#f0c85a'});
    g.restore();
    g.strokeStyle='#6a4f1c'; g.lineWidth=2; rr(-22,-34,44,34,5); g.stroke();
    txt('FUEL', 0, -16, 10, '#3a2a0a');
  } else {
    for (let i=0;i<4;i++){
      g.save(); g.translate(-18+i*12, -10); g.rotate(T/120 + i);
      g.fillStyle='rgba(120,230,255,.9)';
      star(0,0,9,4.4,6); g.fill();
      g.fillStyle='rgba(255,255,255,.7)'; star(0,0,4.4,2,6); g.fill();
      g.restore();
    }
    if (Math.random()<.2) emitSpark(x+rnd(-22,22)*s, y-12, 1, '#bff2ff');
  }
  g.restore();
  const lab = quality==='wrongtype' ? 'that is not medicine'
            : scale==='high' ? 'far too much of it'
            : scale==='low'  ? 'barely a trace' : 'exactly right';
  txt(lab, x, y+22, 13, quality==='good' && scale==='ok' ? '#8fe8b8' : '#e8a0a0');
}

/* ---------- the ordering phone ---------- */
function drawPhone(x, y, sel, onPick){
  const pw = 470, ph = 618;
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=30; g.shadowOffsetY=10;
  g.fillStyle='#10161c'; rr(x-pw/2, y-ph/2, pw, ph, 30); g.fill(); g.restore();
  g.strokeStyle='#2c3a46'; g.lineWidth=3; rr(x-pw/2, y-ph/2, pw, ph, 30); g.stroke();
  // screen
  const sx = x-pw/2+14, sy = y-ph/2+38, sw = pw-28, sh = ph-70;
  g.fillStyle='#f2f5f8'; rr(sx, sy, sw, sh, 18); g.fill();
  // notch + status bar
  g.fillStyle='#10161c'; rr(x-46, y-ph/2+6, 92, 18, 9); g.fill();
  txt('09:41', sx+30, sy+16, 12, '#8a97a4');
  txt('UNIT-MART', x, sy+16, 13, '#1f6f9c');
  txt('4G', sx+sw-22, sy+16, 12, '#8a97a4');

  const rows = [
    { key:'type',  label:'REACTOR',    opts:REA_TYPES },
    { key:'therm', label:'TEMPERATURE', opts:REA_THERM },
    { key:'scale', label:'RATE',        opts:REA_SCALE }
  ];
  let yy = sy + 32;
  for (const row of rows){
    txt(row.label, sx+16, yy+9, 12, '#5f7280','left');
    yy += 22;
    row.opts.forEach((o,i)=>{
      const bw = sw-32, bh = 34;
      const bx = sx+16, by = yy + i*(bh+4);
      const on = sel[row.key] === o.id;
      const z = zone(bx, by, bw, bh);
      g.fillStyle = on ? '#1f6f9c' : z.hover ? '#dde6ec' : '#e8eef2';
      rr(bx, by, bw, bh, 9); g.fill();
      g.strokeStyle = on ? '#12536f' : '#cbd6de'; g.lineWidth = 1.6;
      rr(bx, by, bw, bh, 9); g.stroke();
      txt(o.name, bx+14, by+13, 15, on ? '#fff' : '#20323e','left');
      txt(o.sub,  bx+14, by+26, 11, on ? 'rgba(255,255,255,.75)' : '#7a8b96','left',400);
      if (on){ g.fillStyle='#fff'; g.beginPath(); g.arc(bx+bw-20, by+17, 8, 0, 7); g.fill();
        g.strokeStyle='#1f6f9c'; g.lineWidth=2.4; g.lineCap='round';
        g.beginPath(); g.moveTo(bx+bw-24, by+17); g.lineTo(bx+bw-21, by+20.5);
        g.lineTo(bx+bw-16, by+13); g.stroke(); }
      if (z.clicked){ SFX.click(); onPick(row.key, o.id); }
    });
    yy += row.opts.length*38 + 12;
  }
  // order button
  const ready = sel.type && sel.therm && sel.scale;
  const obw = sw-32, obh = 42, obx = sx+16, oby = sy+sh-54;
  const z = zone(obx, oby, obw, obh);
  g.fillStyle = !ready ? '#c8d2d8' : z.hover ? '#25c07a' : '#1fa768';
  rr(obx, oby, obw, obh, 11); g.fill();
  txt(ready ? 'PLACE THE ORDER' : 'pick all three', x, oby+22, 17, ready?'#04121a':'#8a97a4');
  return ready && z.clicked;
}

          W/2, H-156, 24, r.perfect?'#3fd07f':'#ee5f6e');
      // per-choice marks
      const marks = [['REACTOR', r.typeOK], ['TEMPERATURE', r.thermOK], ['RATE', r.scaleOK]];
      marks.forEach(([lab, ok], i)=>{
        const mx = W/2 - 300 + i*300;
        g.fillStyle = ok ? '#3fd07f' : '#ee5f6e';
        g.beginPath(); g.arc(mx-70, H-122, 11, 0, 7); g.fill();
        g.strokeStyle='#04121a'; g.lineWidth=2.6; g.lineCap='round';
        if (ok){ g.beginPath(); g.moveTo(mx-75,H-122); g.lineTo(mx-71,H-117); g.lineTo(mx-64,H-128); g.stroke(); }
        else { g.beginPath(); g.moveTo(mx-75,H-127); g.lineTo(mx-65,H-117);
               g.moveTo(mx-65,H-127); g.lineTo(mx-75,H-117); g.stroke(); }
        txt(lab, mx-50, H-122, 15, ok?'#8fe8b8':'#f0b0bc','left');
      });
      wrapText(r.line, W/2, H-88, 780, 22, 18, '#e8eef2','center',400);

      if (this.pk > 60 && button(r.perfect ? 'NEXT CLIENT' : 'ORDER AGAIN',
                                 W/2-110, H-44, 220, 34,
                                 {col:r.perfect?'#3fd07f':'#ee5f6e', size:16})){
        if (r.perfect){
          this.solved[this.ci] = true;
          this.mode='free'; this.convo=null; clearParts();
          if (this.solved.every(Boolean)) toast('All three clients sorted. Exit is on the right.');
        } else { this.phase='phone'; this.pk=0; clearParts(); }
      }
      return;
    }
  },

  ask(a){
    SFX.click();
    this.asked[a.key] = true;
    const bad = isWeak('rea');
    this.readLine = {
      a: (isHard() && a.hardA) ? a.hardA : a.a,
      read: bad ? ((isHard() && a.hardBad) ? a.hardBad : a.bad) : a.good,
      wasBad: bad
    };
    this.readT = 520;
  },

  placeOrder(){
    SFX.cash();
    const c = REA_CLIENTS[this.ci];
    this.result = {
      typeOK:  this.sel.type  === c.right.type,
      thermOK: this.sel.therm === c.right.therm,
      scaleOK: this.sel.scale === c.right.scale
    };
    this.result.perfect = this.result.typeOK && this.result.thermOK && this.result.scaleOK;
    this.phase='build'; this.pk=0;
  },

  fireOutcome(){
    const c = REA_CLIENTS[this.ci], r = this.result;
    // what went wrong drives both the animation and the line
    const wrongTherm = !r.thermOK;
    const over  = !r.scaleOK && this.sel.scale === 'high';
    const under = !r.scaleOK && this.sel.scale === 'low' && c.right.scale !== 'low';
    r.rupture = over; r.puff = under;
    r.frost = wrongTherm && this.sel.therm === 'cool';
    r.fire  = wrongTherm && (this.sel.therm === 'heat' || this.sel.therm === 'none');

    if (r.perfect){
      r.line = c.praise;
      this.pts += 3; this.safePts += 1;
      SFX.good();
    } else {
      this.pts += (r.typeOK?1:0) + (r.thermOK?1:0) + (r.scaleOK?1:0);
      if (r.thermOK) this.safePts += 1;
      G.blunders++;
      const bits = [];
      if (!r.typeOK)  bits.push('the reactor is the wrong shape for this reaction, so the product came out wrong');
      if (r.frost)    bits.push('you cooled a reaction that was already cold, and it froze solid');
      if (r.fire)     bits.push('you heated a reaction that was already making its own heat, and it caught');
      if (wrongTherm && !r.frost && !r.fire) bits.push('the temperature scheme does not match what it does');
      if (over)       bits.push('the rate was far too high, so it split a seam and spilled everywhere');
      if (under)      bits.push('the rate was far too low, so almost nothing came out at all');
      r.line = 'Look at it — ' + bits.join(', and ') + '.';
      if (over) { SFX.boom(); shake(16); flash(.5,'255,200,120'); }
      else if (r.fire) SFX.fire();
      else if (r.frost) SFX.freeze();
      else if (under) SFX.puff();
      else SFX.bad();
    }
    // reset the per-order choices so a retry starts clean on the wrong ones
  },

  drawReactorOutcome(c, x, y){
    const t = reaType(this.sel.type) || reaType(c.right.type);
    const r = this.result || {};
    if (this.phase === 'build'){
      const k = this.pk/92;
      if (k > .34){
        g.save(); g.globalAlpha = clamp((k-.34)/.4, 0, 1);
        t.draw(x, y, t.sc, { jacket: this.sel.therm==='none'?null:this.sel.therm });
        g.restore();
      }
      buildCloud(x, y-62, 86, k);
      if (this.pk < dt*2) SFX.place();
      return;
    }
    // running / verdict
    const st = {
      run: !r.puff,
      jacket: this.sel.therm==='none' ? null : this.sel.therm,
      frost: r.frost, fire: r.fire, rupture: r.rupture,
      badProduct: !r.typeOK
    };
    g.save();
    if ((r.rupture || r.fire) && this.pk > 20) g.translate(rnd(-2.4,2.4), rnd(-1.8,1.8));
    t.draw(x, y, t.sc, st);
    g.restore();

    if (r.frost){ emitFrost(x + rnd(-50,50), y - rnd(30,110), 1);
      g.fillStyle='rgba(215,242,255,.28)';
      g.beginPath(); g.ellipse(x, y-70, 62, 76, 0, 0, 7); g.fill(); }
    if (r.fire){ emitFire(x + rnd(-40,40), y - rnd(20,90), 2);
      if (Math.random()<.4) emitSmoke(x, y-120, 1); }
    if (r.rupture){
      for (let i=0;i<3;i++) spawn({ x:x+34, y:y-78, vx:rnd(3,11), vy:rnd(-7,1), g:.22,
        life:rnd(30,60), max:60, size:rnd(5,13),
        col: r.typeOK ? 'rgba(120,210,245,.9)' : 'rgba(150,70,200,.85)', kind:'puff', drag:.98 });
      emitSmoke(x+40, y-84, 1, 'rgba(90,80,80,.6)');
    }
    if (r.puff && this.pk < 50 && Math.random()<.4) emitSteam(x, y-140*t.sc, 1, {speed:.7});

    // the product slides out onto the floor
    if (this.pk > 40 && !r.puff){
      const k = clamp((this.pk-40)/40, 0, 1);
      const px = lerp(x, x + 118, easeOut(k));
      reaProduct(c.product, px, y + 46, r.typeOK ? 'good' : 'wrongtype',
                 r.scaleOK ? 'ok' : this.sel.scale === 'high' ? 'high' : 'low');
      if (this.pk > 40 && this.pk < 42) SFX.squelch();
    } else if (r.puff && this.pk > 46){
      txt('...nothing came out', x + 90, y - 30, 16, 'rgba(220,200,205,.75)','center',400);
    }
  }
};

/* ---------- the Reynolds cheat sheet ---------- */
function cheatSheet(x, y, s, ticked, hover){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.save(); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=14; g.shadowOffsetY=5;
  g.fillStyle='#f6f2e2'; g.rotate(-0.02); rr(-110,-84,220,168,5); g.fill(); g.restore();
  g.rotate(-0.02);
  g.strokeStyle='#cfc6ac'; g.lineWidth=2; rr(-110,-84,220,168,5); g.stroke();
  txt('REYNOLDS NUMBER', 0, -62, 14, '#2f4250');
  g.strokeStyle='#c8bfa4'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(-94,-50); g.lineTo(94,-50); g.stroke();
  const rows = [['laminar','Re < 2100'],['transition','2100 – 4000'],['turbulent','Re > 4000']];
  rows.forEach(([k,v],i)=>{
    const yy = -26 + i*32;
    g.strokeStyle='#5a6a76'; g.lineWidth=2;
    rr(-92, yy-9, 18, 18, 3); g.stroke();
    if (ticked === k){
      g.strokeStyle='#1f8f5c'; g.lineWidth=3; g.lineCap='round';
      g.beginPath(); g.moveTo(-88, yy); g.lineTo(-84, yy+5); g.lineTo(-76, yy-6); g.stroke();
    }
    txt(k, -66, yy, 15, '#2f4250','left');
    txt(v, 90, yy, 13, '#6a7a86','right',400);
  });
  txt('tick the one you measure', 0, 66, 11, '#8a9aa6','center',400);
  g.restore();
}

/* ---------- rig drawing ---------- */
function drawRigLine(st, rig){
  const liquidLine = rig.fluid === 'liquid';
  const col = liquidLine
    ? { shell:'#4f7f9a', inner:'#2f5568' }
    : { shell:'#8a9aa6', inner:'#5a6a76' };

  // inlet and outlet stubs, always present
  pipeSeg(150, 520, MOVER_PAD[0]-46, 520, 26, col);
  pipeSeg(1040, 520, 1130, 520, 26, col);
  // wall plates
  g.fillStyle='#2b3f4c'; rr(126, 486, 26, 68, 4); g.fill();
  g.fillStyle='#2b3f4c'; rr(1128, 486, 26, 68, 4); g.fill();
  txt('FEED', 138, 470, 13, '#9fd8ef');
  txt('TO PLANT', 1140, 470, 13, '#9fd8ef');

  // the segments
  PIPE_SEGS.forEach((s,i)=>{
    if (st.placed[i]) pipeSeg(s.a[0], s.a[1], s.b[0], s.b[1], 26, col);
    else {
      g.save();
      g.strokeStyle = `rgba(35,166,224,${.3+Math.sin(T/14+i)*.12})`;
      g.lineWidth = 26; g.lineCap='butt';
      g.setLineDash([12,10]);
      g.beginPath(); g.moveTo(s.a[0],s.a[1]); g.lineTo(s.b[0],s.b[1]); g.stroke();
      g.setLineDash([]);
      g.restore();
    }
  });

  // flanges
  JOINTS.forEach((j,i)=>{
    const vertical = (i===2 || i===3);
    flange(j[0], j[1], vertical ? Math.PI/2 : 0, 34, st.bolted[i]);
  });

  // relief valve
  if (st.relief) reliefValve(RELIEF_PAD[0], RELIEF_PAD[1]-13, 1.15, { venting: st.venting });
  else if (st.phase !== 'run'){
    g.save();
    g.strokeStyle=`rgba(245,181,61,${.4+Math.sin(T/12)*.2})`; g.lineWidth=2.4;
    g.setLineDash([6,6]);
    g.beginPath(); g.arc(RELIEF_PAD[0], RELIEF_PAD[1]-34, 26, 0, 7); g.stroke();
    g.setLineDash([]); g.restore();
    txt('relief', RELIEF_PAD[0], RELIEF_PAD[1]-66, 12, 'rgba(245,181,61,.75)');
  }

  // the mover, or its empty pad
  if (st.mover){
    const m = FLU_MOVERS.find(m=>m.id===st.mover);
    m.draw(MOVER_PAD[0], MOVER_PAD[1]+38, 1.05, { spin: st.spin });
  } else {
    g.save();
    g.strokeStyle=`rgba(35,166,224,${.35+Math.sin(T/11)*.18})`; g.lineWidth=3;
    g.setLineDash([9,8]);
    rr(MOVER_PAD[0]-58, MOVER_PAD[1]-36, 116, 74, 8); g.stroke();
    g.setLineDash([]); g.restore();
    txt('?', MOVER_PAD[0], MOVER_PAD[1], 34, 'rgba(35,166,224,.6)');
    // the ghost outline an experienced engineer already sees
    if (st.ghost){
      g.save(); g.globalAlpha = .30 + Math.sin(T/13)*.10;
      const m = FLU_MOVERS.find(m=>m.id===rig.right);
      m.draw(MOVER_PAD[0], MOVER_PAD[1]+38, 1.05, {});
      g.restore();
    }
  }

  // flow inside the finished line
  const allIn = st.placed.every(Boolean) && st.bolted.every(Boolean);
  if (allIn && st.flow > 0){
    const pts = [[150,520],[MOVER_PAD[0],520],[390,520],[520,520],[520,380],
                 [880,380],[880,520],[1040,520],[1130,520]];
    flowDots(pts, 0.6 + st.flow*3.2, clamp(st.flow*1.4,0,1),
             liquidLine ? 'rgba(120,205,245,.95)' : 'rgba(215,235,245,.75)',
             liquidLine ? 5 : 4);
  }

  // the open leak before anything is connected
  if (!st.placed[0] && st.phase !== 'run'){
    if (liquidLine){ emitDrip(MOVER_PAD[0]-40, 532, 1); }
    else if (Math.random()<.6) emitSteam(MOVER_PAD[0]-40, 520, 1, {vx:1.4, speed:1.3});
  }
}
