<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ChemEng Quest — First Day at the Refinery</title>
<style>
:root{
  --blue:#23a6e0; --deep:#0d2b3e; --ink:#06141d; --gold:#f5b53d;
  --green:#3fd07f; --red:#ee5f6e; --paper:#f2efe4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#030d14;color:#eaf4fa;overflow:hidden;
  font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:#030d14}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));
  background:#07202e;overflow:hidden;box-shadow:0 0 90px rgba(0,0,0,.9)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0;pointer-events:none;font-size:calc(100% * 1)}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:14px;
  font-size:13px;letter-spacing:.06em;opacity:.92;text-shadow:0 2px 6px #000}
#toast{position:absolute;left:50%;top:9%;transform:translateX(-50%);
  font-size:15px;font-weight:700;letter-spacing:.05em;padding:.5em 1.1em;border-radius:999px;
  background:rgba(4,20,30,.85);border:1px solid rgba(35,166,224,.5);opacity:0;
  transition:opacity .3s;white-space:nowrap}
#toast.show{opacity:1}
#tapstart{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;
  background:#030d14;z-index:9;text-align:center}
#tapstart.gone{display:none}
.ts-title{font-size:min(9vw,64px);font-weight:700;letter-spacing:.02em;color:#eaf4fa}
.ts-sub{margin-top:.6em;font-size:min(3.4vw,20px);color:#23a6e0;letter-spacing:.18em;text-transform:uppercase}
.ts-note{margin-top:1.6em;font-size:min(2.6vw,13px);color:rgba(234,244,250,.4);letter-spacing:.08em}

</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="1280" height="720"></canvas>
    <div id="ui">
      <div id="hud"></div>
      <div id="toast"></div>
    </div>
    <div id="tapstart"><div>
      <div class="ts-title">ChemEng Quest</div>
      <div class="ts-sub">click anywhere to begin</div>
      <div class="ts-note">sound on &middot; best in full screen &middot; press F for full screen</div>
    </div></div>
  </div>
</div>
<script>
(()=>{
"use strict";
/* ===== 01-core.js ===== */
/* ============================================================
   ChemEng Quest — core engine
   canvas, input, scenes, tweens, particles, draw helpers
   ============================================================ */
const W = 1280, H = 720;
const cv = document.getElementById('cv');
const g  = cv.getContext('2d');
const hudEl = document.getElementById('hud');
const toastEl = document.getElementById('toast');

let T = 0;          // global frame counter
let dt = 1;         // delta in frames (60fps = 1)
let last = 0;

/* ---------------- input ---------------- */
const keys = {};
const mouse = { x: W/2, y: H/2, down:false, click:false, up:false };
const hot = [];     // clickable rects registered each frame

addEventListener('keydown', e => {
  keys[e.key] = true; keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'f' || e.key === 'F') toggleFull();
});
addEventListener('keyup', e => { keys[e.key] = false; keys[e.code] = false; });
function toggleFull(){
  const w = document.getElementById('wrap');
  if (!document.fullscreenElement) w.requestFullscreen && w.requestFullscreen().catch(()=>{});
  else document.exitFullscreen && document.exitFullscreen();
}
function toCanvas(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) * W / r.width, y:(e.clientY - r.top) * H / r.height };
}
cv.addEventListener('mousemove', e => { const p = toCanvas(e); mouse.x = p.x; mouse.y = p.y; });
cv.addEventListener('mousedown', e => { const p = toCanvas(e); mouse.x=p.x; mouse.y=p.y; mouse.down = true; mouse.click = true; });
addEventListener('mouseup', () => { mouse.down = false; mouse.up = true; });
cv.addEventListener('touchstart', e => { const p = toCanvas(e.touches[0]); mouse.x=p.x;mouse.y=p.y;mouse.down=true;mouse.click=true; e.preventDefault(); }, {passive:false});
cv.addEventListener('touchmove',  e => { const p = toCanvas(e.touches[0]); mouse.x=p.x;mouse.y=p.y; e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend',   e => { mouse.down=false; mouse.up=true; e.preventDefault(); }, {passive:false});

function keyPressed(...list){
  for (const k of list) if (keys[k]) { list.forEach(x => keys[x]=false); return true; }
  return false;
}

/* a button you draw yourself: returns {hover, clicked} */
function zone(x, y, w, h){
  const hover = mouse.x>=x && mouse.x<=x+w && mouse.y>=y && mouse.y<=y+h;
  const clicked = hover && mouse.click;
  if (hover) hot.push(1);
  return { hover, clicked };
}

/* ---------------- math / easing ---------------- */
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a + (b-a)*t;
const ease  = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const easeOut = t => 1 - Math.pow(1-t, 3);
const easeIn  = t => t*t*t;
const bounce = t => { const n=7.5625,d=2.75;
  if(t<1/d)return n*t*t; if(t<2/d)return n*(t-=1.5/d)*t+.75;
  if(t<2.5/d)return n*(t-=2.25/d)*t+.9375; return n*(t-=2.625/d)*t+.984375; };
function rnd(a=1,b){ return b===undefined ? Math.random()*a : a + Math.random()*(b-a); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
/* deterministic pseudo-noise so scenery does not shimmer */
function nz(i){ const s = Math.sin(i*127.1)*43758.5453; return s - Math.floor(s); }

/* ---------------- timers ---------------- */
const timers = [];
function after(frames, fn){ timers.push({ t:frames, fn }); }
function runTimers(){
  for (let i = timers.length-1; i >= 0; i--){
    timers[i].t -= dt;
    if (timers[i].t <= 0){ const f = timers[i].fn; timers.splice(i,1); f(); }
  }
}
function clearTimers(){ timers.length = 0; }

/* ---------------- particles ---------------- */
const parts = [];
function spawn(o){
  parts.push(Object.assign({
    x:0, y:0, vx:0, vy:0, g:0, life:60, max:60, size:6,
    col:'#fff', kind:'dot', rot:0, vr:0, fade:true, shrink:true
  }, o));
}
function updateParts(){
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += p.g*dt;
    p.rot += p.vr*dt; p.life -= dt;
    if (p.drag){ p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt); }
    if (p.life <= 0) parts.splice(i,1);
  }
}
function drawParts(filter){
  for (const p of parts){
    if (filter && p.layer !== filter) continue;
    if (!filter && p.layer) continue;
    const k = p.life/p.max;
    g.save();
    g.globalAlpha = p.fade ? clamp(k,0,1) : 1;
    g.translate(p.x, p.y); g.rotate(p.rot);
    const s = p.shrink ? p.size*(0.35+0.65*k) : p.size;
    g.fillStyle = p.col;
    if (p.kind === 'dot'){ g.beginPath(); g.arc(0,0,s,0,7); g.fill(); }
    else if (p.kind === 'sq'){ g.fillRect(-s/2,-s/2,s,s); }
    else if (p.kind === 'star'){ star(0,0,s,s*.45,5); g.fill(); }
    else if (p.kind === 'puff'){
      g.globalAlpha *= .55; g.beginPath();
      g.arc(-s*.4,0,s*.6,0,7); g.arc(s*.4,0,s*.55,0,7); g.arc(0,-s*.4,s*.7,0,7); g.fill();
    }
    else if (p.kind === 'txt'){
      g.font = `700 ${s*2}px "Trebuchet MS",Verdana,sans-serif`;
      g.textAlign='center'; g.textBaseline='middle'; g.fillText(p.text, 0, 0);
    }
    else if (p.kind === 'tool'){ drawTool(p.tool||0, s); }
    else if (p.kind === 'ring'){
      g.strokeStyle = p.col; g.lineWidth = p.lw || 3; g.globalAlpha *= .8;
      g.beginPath(); g.arc(0,0,p.size*(1.4-k)*1.4,0,7); g.stroke();
    }
    g.restore();
  }
  if (!filter) parts.length && 0;
}
function clearParts(){ parts.length = 0; }

/* little flying wrench / bolt / screwdriver silhouettes for build clouds */
function drawTool(i, s){
  g.save(); g.scale(s/10, s/10); g.fillStyle = '#c9d6de'; g.strokeStyle='#7b8b96'; g.lineWidth=1.2;
  if (i%3===0){ // wrench
    g.beginPath(); g.moveTo(-8,-2); g.lineTo(4,-2); g.lineTo(4,2); g.lineTo(-8,2); g.closePath(); g.fill();
    g.beginPath(); g.arc(6,0,4.5,0,7); g.fill();
    g.fillStyle='#4b5a64'; g.beginPath(); g.arc(6,0,2,0,7); g.fill();
  } else if (i%3===1){ // bolt
    g.beginPath(); for(let k=0;k<6;k++){const a=k/6*Math.PI*2; g[k?'lineTo':'moveTo'](Math.cos(a)*6,Math.sin(a)*6);} g.closePath(); g.fill();
    g.fillStyle='#8d9ba5'; g.beginPath(); g.arc(0,0,2.6,0,7); g.fill();
  } else {   // screwdriver
    g.fillStyle='#e0a53d'; g.fillRect(-9,-2.4,7,4.8);
    g.fillStyle='#c9d6de'; g.fillRect(-2,-1.2,11,2.4);
  }
  g.restore();
}

/* ---------------- draw helpers ---------------- */
function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  g.beginPath(); g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);     g.arcTo(x,y,x+w,y,r); g.closePath();
}
function star(cx,cy,ro,ri,n){
  g.beginPath();
  for (let i=0;i<n*2;i++){ const r = i%2?ri:ro, a = i/(n*2)*Math.PI*2 - Math.PI/2;
    g[i?'lineTo':'moveTo'](cx+Math.cos(a)*r, cy+Math.sin(a)*r); }
  g.closePath();
}
function txt(s,x,y,size=20,col='#eaf4fa',align='center',weight=700,baseline='middle'){
  g.fillStyle=col; g.textAlign=align; g.textBaseline=baseline;
  g.font=`${weight} ${size}px "Trebuchet MS",Verdana,sans-serif`;
  g.fillText(s,x,y);
}
function txtShadow(s,x,y,size,col,align='center',weight=700){
  g.save(); g.shadowColor='rgba(0,0,0,.6)'; g.shadowBlur=8; g.shadowOffsetY=3;
  txt(s,x,y,size,col,align,weight); g.restore();
}
function wrapText(s,x,y,maxw,lh,size,col,align='left',weight=400){
  g.fillStyle=col; g.textAlign=align; g.textBaseline='middle';
  g.font=`${weight} ${size}px "Trebuchet MS",Verdana,sans-serif`;
  const words=String(s).split(' '); let line='', yy=y, n=0;
  for (const wd of words){
    const test = line + wd + ' ';
    if (g.measureText(test).width > maxw && line){ g.fillText(line.trim(),x,yy); line=wd+' '; yy+=lh; n++; }
    else line = test;
  }
  g.fillText(line.trim(),x,yy);
  return n+1;
}
function panel(x,y,w,h,fill='rgba(6,26,38,.93)',stroke='rgba(35,166,224,.75)',r=14){
  g.save(); g.shadowColor='rgba(0,0,0,.55)'; g.shadowBlur=18; g.shadowOffsetY=6;
  g.fillStyle=fill; rr(x,y,w,h,r); g.fill(); g.restore();
  g.strokeStyle=stroke; g.lineWidth=2; rr(x,y,w,h,r); g.stroke();
}
function shade(a){ g.fillStyle=`rgba(2,10,16,${a})`; g.fillRect(0,0,W,H); }
function vignette(a=.4){
  const v=g.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.92);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,`rgba(0,0,0,${a})`);
  g.fillStyle=v; g.fillRect(0,0,W,H);
}

/* a drawn button (canvas), consistent look everywhere */
function button(label,x,y,w,h,opt={}){
  const z = zone(x,y,w,h);
  const on = z.hover && !opt.disabled;
  const base = opt.col || '#23a6e0';
  g.save();
  if (on){ g.shadowColor = base; g.shadowBlur = 16; }
  g.fillStyle = opt.disabled ? 'rgba(20,34,44,.7)' : on ? base : 'rgba(9,38,54,.94)';
  rr(x, on?y-2:y, w, h, 10); g.fill(); g.restore();
  g.strokeStyle = opt.disabled ? 'rgba(120,140,150,.35)' : base;
  g.lineWidth = 2; rr(x, on?y-2:y, w, h, 10); g.stroke();
  txt(label, x+w/2, (on?y-2:y)+h/2+1, opt.size||18,
      opt.disabled ? 'rgba(200,220,230,.4)' : on ? '#04121a' : '#eaf4fa');
  if (on) cv.style.cursor='pointer';
  return z.clicked && !opt.disabled;
}

/* ---------------- HUD / toast ---------------- */
let toastT = 0;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); toastT = 150; }
function tickToast(){ if (toastT>0){ toastT -= dt; if (toastT<=0) toastEl.classList.remove('show'); } }

/* ---------------- scene manager with transitions ---------------- */
let scene = null, nextScene = null;
let trans = null;   // {kind, t, dur, half}

function go(s, kind='fade'){
  if (!scene){ scene = s; s.enter && s.enter(); return; }
  if (trans) return;
  nextScene = s;
  trans = { kind, t:0, dur: kind==='swirl'?110 : kind==='ripple'?120 : 52, swapped:false };
}
function doSwap(){
  clearTimers(); clearParts();
  if (scene && scene.exit) scene.exit();
  scene = nextScene; nextScene = null;
  T = 0;
  if (scene.enter) scene.enter();
}
function drawTransition(){
  if (!trans) return;
  trans.t += dt;
  const k = clamp(trans.t / trans.dur, 0, 1);
  if (!trans.swapped && k >= .5){ trans.swapped = true; doSwap(); }

  if (trans.kind === 'fade'){
    const a = k<.5 ? k*2 : (1-k)*2;
    g.fillStyle = `rgba(3,13,20,${a})`; g.fillRect(0,0,W,H);
  }
  else if (trans.kind === 'ripple'){
    // dream entry: horizontal wavy displacement + wash
    const a = k<.5 ? k*2 : (1-k)*2;
    const img = g.getImageData(0,0,W,H);
    const tmp = document.createElement('canvas'); tmp.width=W; tmp.height=H;
    tmp.getContext('2d').putImageData(img,0,0);
    g.fillStyle='#0a1830'; g.fillRect(0,0,W,H);
    const amp = 34*a;
    for (let y=0;y<H;y+=2){
      const off = Math.sin(y/26 + trans.t/7) * amp;
      g.drawImage(tmp, 0,y,W,2, off, y + Math.sin(y/50+trans.t/11)*amp*.3, W,2);
    }
    g.fillStyle=`rgba(90,150,220,${a*.5})`; g.fillRect(0,0,W,H);
  }
  else if (trans.kind === 'swirl'){
    const a = k<.5 ? k*2 : (1-k)*2;
    const img = g.getImageData(0,0,W,H);
    const tmp = document.createElement('canvas'); tmp.width=W; tmp.height=H;
    tmp.getContext('2d').putImageData(img,0,0);
    g.fillStyle='#05101c'; g.fillRect(0,0,W,H);
    g.save();
    const rings = 26;
    for (let i=rings;i>0;i--){
      const r0 = i/rings, rad = r0 * H*0.95;
      g.save();
      g.translate(W/2,H/2); g.rotate(a * (1-r0) * 7);
      g.scale(1 - a*0.25*(1-r0), 1 - a*0.25*(1-r0));
      g.beginPath(); g.arc(0,0,rad,0,7); g.clip();
      g.globalAlpha = 1;
      g.drawImage(tmp, -W/2, -H/2);
      g.restore();
    }
    g.restore();
    g.fillStyle=`rgba(5,16,28,${a*.45})`; g.fillRect(0,0,W,H);
  }
  if (k >= 1) trans = null;
}

/* screen shake */
let shakeAmt = 0;
function shake(a){ shakeAmt = Math.max(shakeAmt, a); }
let flashAmt = 0, flashCol = '255,255,255';
function flash(a, col='255,255,255'){ flashAmt = a; flashCol = col; }

/* ---------------- main loop ---------------- */
function frame(ts){
  dt = last ? clamp((ts-last)/16.667, 0.2, 3) : 1;
  last = ts; T += dt;
  hot.length = 0; cv.style.cursor = 'default';

  g.save();
  if (shakeAmt > 0.2){
    g.translate(rnd(-shakeAmt,shakeAmt), rnd(-shakeAmt,shakeAmt));
    shakeAmt *= Math.pow(0.88, dt);
  } else shakeAmt = 0;

  runTimers();
  updateParts();
  if (scene) scene.draw();
  g.restore();

  if (flashAmt > 0.01){
    g.fillStyle = `rgba(${flashCol},${flashAmt})`; g.fillRect(0,0,W,H);
    flashAmt *= Math.pow(0.86, dt);
  }
  drawTransition();
  tickToast();

  mouse.click = false; mouse.up = false;
  requestAnimationFrame(frame);
}


/* ===== 02-audio.js ===== */
/* ============================================================
   Audio — everything synthesised, no external files
   ============================================================ */
let AC = null, masterGain = null, musicGain = null, sfxGain = null;
let audioReady = false;

function initAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = AC.createGain(); masterGain.gain.value = 0.9; masterGain.connect(AC.destination);
  musicGain  = AC.createGain(); musicGain.gain.value  = 0.34; musicGain.connect(masterGain);
  sfxGain    = AC.createGain(); sfxGain.gain.value    = 0.55; sfxGain.connect(masterGain);
  audioReady = true;
}
function resumeAudio(){ if (AC && AC.state === 'suspended') AC.resume(); }

/* note name -> frequency */
const NOTE = {};
(function(){
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  for (let o=1;o<=7;o++) for (let i=0;i<12;i++)
    NOTE[names[i]+o] = 440 * Math.pow(2, (i-9)/12 + (o-4));
})();
const N = n => n === '-' ? 0 : (NOTE[n] || 0);

/* ---------- one-shot tone ---------- */
function tone(freq, dur, opt = {}){
  if (!audioReady || !freq) return;
  const t0 = AC.currentTime + (opt.delay || 0);
  const o = AC.createOscillator();
  const gn = AC.createGain();
  o.type = opt.type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (opt.slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,opt.slide), t0 + dur);
  if (opt.vib){
    const lfo = AC.createOscillator(), lg = AC.createGain();
    lfo.frequency.value = opt.vib; lg.gain.value = opt.vibDepth || 6;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(t0); lfo.stop(t0+dur);
  }
  const vol = opt.vol === undefined ? .18 : opt.vol;
  const atk = opt.atk === undefined ? .008 : opt.atk;
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + atk);
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = o;
  if (opt.filter){
    const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = opt.filter;
    o.connect(f); node = f;
  }
  node.connect(gn); gn.connect(opt.bus || sfxGain);
  o.start(t0); o.stop(t0 + dur + .02);
}

/* ---------- noise burst (drums, steam, explosions) ---------- */
let noiseBuf = null;
function noise(dur, opt = {}){
  if (!audioReady) return;
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const t0 = AC.currentTime + (opt.delay||0);
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = opt.ftype || 'bandpass';
  f.frequency.setValueAtTime(opt.freq || 1200, t0);
  if (opt.sweep) f.frequency.exponentialRampToValueAtTime(Math.max(60,opt.sweep), t0+dur);
  f.Q.value = opt.q || 1;
  const gn = AC.createGain();
  const vol = opt.vol === undefined ? .2 : opt.vol;
  gn.gain.setValueAtTime(0.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + (opt.atk||.006));
  gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(gn); gn.connect(opt.bus || sfxGain);
  src.start(t0); src.stop(t0 + dur + .02);
}

/* ============================================================
   SFX
   ============================================================ */
const SFX = {
  click(){ tone(660,.05,{type:'square',vol:.08}); },
  hover(){ tone(880,.03,{type:'sine',vol:.04}); },
  step(){ noise(.05,{freq:260,q:1.4,vol:.05,ftype:'lowpass'}); },

  good(){ [784,988,1319].forEach((f,i)=> tone(f,.22,{type:'square',vol:.12,delay:i*.075})); },
  great(){ [659,784,988,1319,1568].forEach((f,i)=> tone(f,.3,{type:'triangle',vol:.14,delay:i*.07})); },

  /* the silly "you messed up" slide */
  bad(){
    tone(392,.18,{type:'sawtooth',vol:.13,slide:330});
    tone(330,.2 ,{type:'sawtooth',vol:.13,slide:262,delay:.16});
    tone(262,.42,{type:'sawtooth',vol:.14,slide:180,delay:.34,vib:9,vibDepth:9});
    noise(.2,{freq:500,vol:.05,delay:.34,sweep:180});
  },
  wahwah(){ // extra goofy, for big blunders
    for (let i=0;i<3;i++)

const Music = {
  name:null, step:0, timer:null, nextTime:0, playing:false,
  play(name){
    if (!audioReady || this.name === name) return;
    this.name = name; this.step = 0;
    if (!this.playing){ this.playing = true; this.nextTime = AC.currentTime + .05; this.loop(); }
  },
  stop(){ this.name = null; },
  loop(){
    if (!audioReady) return;
    const lookahead = .12;
    while (this.name && this.nextTime < AC.currentTime + lookahead){
      this.tick(this.nextTime);
      const tr = TRACKS[this.name];
      const spb = 60 / tr.bpm / 2;                       // eighth notes
      const sw  = (this.step % 2) ? -tr.swing*spb : tr.swing*spb;
      this.nextTime += spb + sw;
      this.step++;
    }
    setTimeout(()=>this.loop(), 25);
  },
  tick(t){
    const tr = TRACKS[this.name]; if (!tr) return;
    const i = this.step % tr.lead.length;
    const d = 60 / tr.bpm / 2;
    const ld = tr.lead[i], bs = tr.bass[i], dr = tr.drum[i];
    const at = t - AC.currentTime;
    if (ld && ld !== '-') tone(N(ld), d*1.5, {type:tr.wave, vol:.10, delay:Math.max(0,at), bus:musicGain, filter:2600});
    if (bs && bs !== '-') tone(N(bs), d*1.7, {type:tr.bassWave, vol:.13, delay:Math.max(0,at), bus:musicGain, filter:900});
    if (dr === 1) noise(.09,{freq:180,q:1,vol:.16,ftype:'lowpass',sweep:60,delay:Math.max(0,at),bus:musicGain});
    if (dr === 2) noise(.05,{freq:5200,q:.8,vol:.055,ftype:'highpass',delay:Math.max(0,at),bus:musicGain});
  }
};

/* ============================================================
   Rig geometry, feet on the ground at local y = 0, up is negative
      ankle -7   knee -25   hip -46   shoulder -78   head centre -96
   Limb angles: 0 points straight DOWN, positive swings forward.
   ============================================================ */
const RIG = { ankle:-7, knee:-25, hip:-46, shoulder:-78, head:-96 };

function capsule(x1,y1,x2,y2,w,col){
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
}
/* two-segment limb hanging downward from (hx,hy) */
function limb(hx,hy,a1,l1,a2,l2,w,col,endCol,endLen,endRound){
  const kx = hx + Math.sin(a1)*l1, ky = hy + Math.cos(a1)*l1;
  const fx = kx + Math.sin(a1+a2)*l2, fy = ky + Math.cos(a1+a2)*l2;
  capsule(hx,hy,kx,ky,w,col);
  capsule(kx,ky,fx,fy,w*0.9,col);
  if (endCol){
    g.save(); g.translate(fx,fy); g.rotate(-(a1+a2)*0.45);
    g.fillStyle = endCol;
    if (endRound){ g.beginPath(); g.arc(0,0,endLen,0,7); g.fill(); }
    else { rr(-endLen*0.34, -2.6, endLen, 6.8, 3); g.fill(); }
    g.restore();
  }
  return {kx,ky,fx,fy};
}

/* ============================================================
   drawPerson(def, x, y, scale, o)
   x,y = the ground point under the feet
   o.dir    'right' | 'left' | 'front' | 'back'
   o.walk   phase counter (0 / undefined = standing)
   o.face   neutral happy worry shock panic sweat proud sleep dead angry shame
   o.ppe    {goggles, hat, coat}
   o.armF / o.armB   override arm angles (0 = hanging down, + = forward)
   o.talk   jaw and head-bob animation
   o.tilt   whole-body rotation      o.lift  vertical offset
   o.squash vertical squash (1 = normal)
   o.holdDraw(ctx)  draws something in the front hand
   ============================================================ */
function drawPerson(def, x, y, scale, o={}){
  const s = scale * (def.build || 1);
  const dir = o.dir || 'right';
  const facing = dir === 'left' ? -1 : 1;
  const flat = (dir === 'front' || dir === 'back');
  const walking = !!o.walk;
  const ph = (o.walk || 0) * 0.22;
  const seed = o.seed || 0;
  const bob = walking ? Math.abs(Math.sin(ph*2)) * 2.2 : Math.sin(T/40 + seed) * 0.8;
  const squash = o.squash === undefined ? 1 : o.squash;

  g.save();
  g.translate(x, y + (o.lift || 0));
  if (o.tilt) g.rotate(o.tilt);
  g.scale(facing * s, s * squash);

  if (o.shadow !== false){
    g.fillStyle = 'rgba(0,0,0,.25)';
    g.beginPath(); g.ellipse(0, 0, 19, 5, 0, 0, 7); g.fill();
  }

  const hipY = RIG.hip - bob, shoY = RIG.shoulder - bob, headY = RIG.head - bob;
  const thigh = RIG.knee - RIG.hip, shin = RIG.ankle - RIG.knee;
  const upper = 17, fore = 16;
  const boot = '#2d363e';

  /* ---- legs (back first) ---- */
  const swing = walking ? 0.52 : 0;
  const lgA = Math.sin(ph) * swing, lgB = Math.sin(ph + Math.PI) * swing;
  const bendA = walking ? Math.max(0, -Math.sin(ph)) * 0.55 : 0.10;
  const bendB = walking ? Math.max(0, -Math.sin(ph + Math.PI)) * 0.55 : 0.10;
  const legW = 10.5;
  const spread = flat ? 6 : 3;
  limb(-spread, hipY, lgB, thigh, bendB, shin, legW, def.suit2, boot, 13);

  /* ---- back arm ---- */
  const armSw = walking ? 0.6 : Math.sin(T/46 + seed) * 0.04;
  const aB = o.armB !== undefined ? o.armB : Math.sin(ph) * armSw + (flat ? -0.18 : -0.1);
  limb(flat ? -11 : -5, shoY, aB, upper, (o.armBBend === undefined ? 0.26 : o.armBBend),
       fore, 8.6, def.suit2, def.skin, 4.6, true);

  /* ---- front leg ---- */
  limb(spread, hipY, lgA, thigh, bendA, shin, legW, def.suit, boot, 13);

  /* ---- torso ---- */
  const tw = flat ? 32 : 28;
  g.fillStyle = def.suit;
  rr(-tw/2, shoY - 5, tw, (hipY - shoY) + 13, 10); g.fill();
  if (!flat){
    g.fillStyle = 'rgba(0,0,0,.13)';
    rr(tw/2 - 9, shoY - 5, 9, (hipY - shoY) + 13, 9); g.fill();
  }
  // belt
  g.fillStyle = 'rgba(0,0,0,.2)'; rr(-tw/2, hipY - 2, tw, 6, 2); g.fill();
  // collar
  g.fillStyle = def.trim;
  g.beginPath();
  g.moveTo(-10, shoY-4); g.lineTo(0, shoY+9); g.lineTo(10, shoY-4);
  g.lineTo(10, shoY-8); g.lineTo(-10, shoY-8); g.closePath(); g.fill();
  // zip
  g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(0, shoY+8); g.lineTo(0, hipY+2); g.stroke();
  // chest badge
  g.fillStyle = def.accent; rr(-9, shoY+13, 7.5, 5.5, 1.6); g.fill();
  if (def.tie){
    g.fillStyle = def.accent;
    g.beginPath(); g.moveTo(0,shoY+8); g.lineTo(-3.6,shoY+15);
    g.lineTo(0,shoY+30); g.lineTo(3.6,shoY+15); g.closePath(); g.fill();
  }
  if (def.coat || (o.ppe && o.ppe.coat)){
    g.fillStyle = 'rgba(248,251,253,.97)';
    const cb = hipY + 22;
    g.beginPath(); g.moveTo(-tw/2-2, shoY-4); g.lineTo(-tw/2-4, cb);
    g.lineTo(-6, cb); g.lineTo(-6, shoY-4); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(tw/2+2, shoY-4); g.lineTo(tw/2+4, cb);
    g.lineTo(6, cb); g.lineTo(6, shoY-4); g.closePath(); g.fill();
    g.strokeStyle='rgba(158,178,192,.7)'; g.lineWidth=1.1;
    g.beginPath(); g.moveTo(-6,shoY-4); g.lineTo(-6,cb); g.moveTo(6,shoY-4); g.lineTo(6,cb); g.stroke();
    g.fillStyle='#b9c8d2'; g.beginPath(); g.arc(-8.5, shoY+26, 1.5, 0, 7); g.fill();
  }

  /* ---- front arm ---- */
  const aF = o.armF !== undefined ? o.armF : Math.sin(ph + Math.PI) * armSw + (flat ? 0.18 : 0.1);
  const fa = limb(flat ? 11 : 5, shoY, aF, upper,
                  (o.armFBend === undefined ? 0.26 : o.armFBend), fore, 8.6,
                  def.suit, def.skin, 4.6, true);
  if (o.holdDraw){ g.save(); g.translate(fa.fx, fa.fy); o.holdDraw(g); g.restore(); }

  /* ---- head ---- */
  g.save();
  g.translate(0, headY);
  g.rotate((o.headTilt || 0) + (o.talk ? Math.sin(T/5)*0.045 : 0));
  drawHead(def, o, dir);
  g.restore();

  g.restore();
}

/* ---------------- head, face, hair, PPE ---------------- */
function drawHead(def, o, dir){
  const face = o.face || 'neutral';
  const front = (dir === 'front');
  const back  = (dir === 'back');

  // neck
  g.fillStyle = def.skin; rr(-4.6, 9, 9.2, 9, 3); g.fill();
  g.fillStyle = 'rgba(0,0,0,.12)'; rr(-4.6, 9, 9.2, 3.4, 2); g.fill();

  hairBack(def, o);

  // skull
  g.fillStyle = def.skin;
  g.beginPath(); g.ellipse(0, 0, 12.8, 13.8, 0, 0, 7); g.fill();
  if (!front && !back){
    g.fillStyle = def.skin;
    g.beginPath(); g.ellipse(-8.2, 2, 2.8, 3.6, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(0,0,0,.10)';
    g.beginPath(); g.ellipse(-8.2, 2, 1.4, 1.9, 0, 0, 7); g.fill();
  }

  if (back){ hairFront(def, o, true); return; }

  /* ---- eyes ---- */
  const exR = front ? 5.0 : 4.6, exL = front ? -5.0 : -1.6;
  const blink = (Math.floor((T + (o.seed||0)*53)/120) % 6 === 0) && ((T + (o.seed||0)*53) % 120 < 9);
  const asleep = face === 'sleep';
  const wide = face === 'shock' || face === 'panic';
  const shut = asleep || blink || face === 'dead';
  const eh = wide ? 4.6 : 3.2;
  const pr = wide ? 1.15 : 1.8;

  if (!shut){
    g.fillStyle = '#fff';
    g.beginPath(); g.ellipse(exL, -1.6, 2.9, eh, 0, 0, 7);
    g.ellipse(exR, -1.6, 2.9, eh, 0, 0, 7); g.fill();
    const look = o.look || 0;
    g.fillStyle = '#16232c';
    g.beginPath(); g.arc(exL+look, -1.2, pr, 0, 7); g.arc(exR+look, -1.2, pr, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.beginPath(); g.arc(exL+look+.75, -2.2, .62, 0, 7); g.arc(exR+look+.75, -2.2, .62, 0, 7); g.fill();
  } else if (face === 'dead'){
    g.strokeStyle='#16232c'; g.lineWidth=1.8; g.lineCap='round';
    [exL,exR].forEach(e=>{ g.beginPath();
      g.moveTo(e-2.6,-3.6); g.lineTo(e+2.6,0.4);
      g.moveTo(e+2.6,-3.6); g.lineTo(e-2.6,0.4); g.stroke(); });
  } else {
    g.strokeStyle = '#16232c'; g.lineWidth = 1.6; g.lineCap='round';
    g.beginPath();
    g.moveTo(exL-2.6,-1.8); g.quadraticCurveTo(exL,0.9,exL+2.6,-1.8);
    g.moveTo(exR-2.6,-1.8); g.quadraticCurveTo(exR,0.9,exR+2.6,-1.8); g.stroke();
  }

  /* ---- brows ---- */
  if (!def.hideBrows){
    g.strokeStyle = def.hair; g.lineWidth = 1.9; g.lineCap = 'round';
    const by = wide ? -8.6 : face==='worry' ? -6.6 : -7.2;
    const tilt = (face==='worry'||face==='sweat'||face==='panic') ? -1.7
               : face==='angry' ? 2.1 : face==='happy' ? -0.7 : 0;
    g.beginPath();
    g.moveTo(exL-3.2, by - tilt); g.lineTo(exL+2.8, by + tilt*0.6);
    g.moveTo(exR-2.8, by + tilt*0.6); g.lineTo(exR+3.2, by - tilt);
    g.stroke();
  }

  /* ---- mouth ---- */
  const mx = front ? 0 : 1.6, my = 5.8;
  const open = o.talk ? (Math.sin(T/3.2)*.5+.5) : 0;
  g.fillStyle = '#8a3a46'; g.strokeStyle = '#8a3a46'; g.lineWidth = 1.7; g.lineCap='round';
  if (o.talk && open > .35){
    g.beginPath(); g.ellipse(mx, my, 2.7, 1.2 + open*2.0, 0, 0, 7); g.fill();
  } else if (face === 'happy' || face === 'proud'){
    g.beginPath(); g.arc(mx, my-1.4, 3.8, .25, Math.PI-.25); g.stroke();
  } else if (wide){
    g.beginPath(); g.ellipse(mx, my+.6, 2.3, 3.2, 0, 0, 7); g.fill();
  } else if (face === 'worry' || face === 'sweat' || face === 'shame'){
    g.beginPath(); g.arc(mx, my+3.6, 3.3, Math.PI+.32, -.32); g.stroke();
  } else if (face === 'sleep'){
    g.beginPath(); g.ellipse(mx, my+.8, 1.7, 2.1, 0, 0, 7); g.fill();
  } else if (face === 'dead'){
    g.beginPath(); g.moveTo(mx-3, my+.5); g.lineTo(mx+3, my+.5); g.stroke();
  } else if (face === 'angry'){
    g.beginPath(); g.arc(mx, my+3.2, 3.0, Math.PI+.4, -.4); g.stroke();
  } else {
    g.beginPath(); g.moveTo(mx-2.7, my); g.lineTo(mx+2.7, my); g.stroke();
  }

  if (def.moustache){
    g.fillStyle = def.hair;
    g.beginPath(); g.ellipse(mx, my-2.6, 4.6, 1.6, 0, 0, 7); g.fill();
  }
  if (def.beard){
    g.save();
    g.fillStyle = def.hair;
    g.beginPath(); g.ellipse(mx*0.6, 9.2, 8.0, 6.8, 0, 0, Math.PI); g.fill();
    g.beginPath(); g.ellipse(mx*0.6, 6.0, 7.4, 5.2, 0, 0, 7); g.fill();
    g.fillStyle = def.skin;
    g.beginPath(); g.ellipse(mx, 3.6, 5.0, 3.4, 0, 0, 7); g.fill();
    g.restore();
    // redraw the mouth over the beard
    g.strokeStyle = '#8a3a46'; g.lineWidth = 1.7;
    g.beginPath(); g.moveTo(mx-2.6, my); g.lineTo(mx+2.6, my); g.stroke();
  }

  if (face === 'panic' || face === 'shame' || face === 'sweat'){
    g.fillStyle = 'rgba(232,90,90,.32)';
    g.beginPath(); g.ellipse(exL-1.4, 3.0, 3.4, 2.1, 0, 0, 7);
    g.ellipse(exR+1.4, 3.0, 3.4, 2.1, 0, 0, 7); g.fill();
  }

  hairFront(def, o, false);

  /* ---- glasses ---- */
  if (def.glasses){
    const lr = front ? 4.0 : 3.7;
    g.strokeStyle = '#2a2a33'; g.lineWidth = 1.5;
    g.fillStyle = 'rgba(205,238,255,.22)';
    [exL, exR].forEach(e=>{ g.beginPath(); g.arc(e, -1.4, lr, 0, 7); g.fill(); g.stroke(); });
    g.beginPath(); g.moveTo(exL+lr, -1.6); g.lineTo(exR-lr, -1.6); g.stroke();
    g.beginPath(); g.moveTo(exR+lr, -1.8); g.lineTo(exR+lr+3.4, -2.6); g.stroke();
  }

  /* ---- PPE ---- */
  if (o.ppe && o.ppe.goggles){
    g.strokeStyle = '#3d4d5a'; g.lineWidth = 2.4;
    g.beginPath(); g.moveTo(-11.5,-1.8); g.lineTo(-14.6,-1.0);
    g.moveTo(11.5,-1.8); g.lineTo(14.6,-1.0); g.stroke();
    g.fillStyle = 'rgba(150,228,255,.42)';
    rr(-11.6, -5.6, 23.2, 8.0, 3.4); g.fill();
    g.strokeStyle = '#2a3a46'; g.lineWidth = 1.9; rr(-11.6, -5.6, 23.2, 8.0, 3.4); g.stroke();
    g.strokeStyle = 'rgba(40,58,70,.7)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(0,-5.6); g.lineTo(0,2.4); g.stroke();
    g.fillStyle='rgba(255,255,255,.5)';
    g.beginPath(); g.moveTo(-8.4,-4.8); g.lineTo(-4.4,-4.8); g.lineTo(-7.6,1.4); g.lineTo(-11.2,1.4);
    g.closePath(); g.fill();
  }
  if (o.ppe && o.ppe.hat){
    g.fillStyle = '#f5c22b';
    g.beginPath(); g.ellipse(0,-10.2, 13.0, 9.0, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#ffd95e';
    g.beginPath(); g.ellipse(0,-10.6, 3.2, 8.4, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#e0a814'; rr(-16.4, -11.0, 32.8, 3.6, 1.8); g.fill();
    g.fillStyle = '#c99310'; rr(2, -11.0, 15, 3.6, 1.8); g.fill();
    g.fillStyle='rgba(255,255,255,.32)';
    g.beginPath(); g.ellipse(-5,-13.6, 4.0, 2.0, -.35, 0, 7); g.fill();
  }

  /* ---- sweat ---- */
  if (o.sweat){
    for (let i=0;i<o.sweat;i++){
      const pp = ((T*1.7 + i*41) % 74);
      g.save();
      g.translate((i%2 ? 1 : -1) * (11 + (i%3)*2.6), -7 + pp*0.44);
      g.rotate(.18);
      g.fillStyle = 'rgba(130,212,255,.92)';
      g.beginPath(); g.moveTo(0,-3.4); g.quadraticCurveTo(2.5,1.3,0,2.8);
      g.quadraticCurveTo(-2.5,1.3,0,-3.4); g.fill();
      g.fillStyle='rgba(255,255,255,.6)';
      g.beginPath(); g.arc(-0.7,0.6,0.7,0,7); g.fill();
      g.restore();
    }
  }
}

/* hair drawn BEHIND the face */
function hairBack(def, o){
  const st = def.hairStyle;
  g.fillStyle = def.hair;
  if (st === 'hijab'){
    g.fillStyle = def.suit2;
    g.beginPath(); g.ellipse(0, -0.6, 15.8, 16.6, 0, 0, 7); g.fill();
    g.fillStyle = def.suit;
    g.beginPath(); g.moveTo(-15.2,-2); g.quadraticCurveTo(-18,16,-9,23);
    g.lineTo(-1,20.5); g.quadraticCurveTo(-11.5,13,-10.5,-1); g.closePath(); g.fill();
    return;
  }
  if (st === 'ponytail'){
    const sw = Math.sin(T/17)*.14 + (o.walk ? Math.sin(o.walk*0.22)*.2 : 0);
    g.save(); g.translate(-11.5,-5); g.rotate(sw);
    g.beginPath(); g.moveTo(0,0);
    g.quadraticCurveTo(-12,5,-9.5,19); g.quadraticCurveTo(-3,10,0,3.5); g.closePath(); g.fill();
    g.restore();
    return;
  }
  if (st === 'bun'){ g.beginPath(); g.arc(-11.4,-11.8, 5.8, 0, 7); g.fill();
    g.fillStyle='rgba(255,255,255,.12)'; g.beginPath(); g.arc(-13,-13.4, 2.1, 0, 7); g.fill(); return; }
  if (st === 'wavy'){
    for (let i=0;i<3;i++){
      g.beginPath(); g.ellipse(-12 + i*0.4, 1 + i*5.6, 5.4 - i*.5, 4.8, .3, 0, 7); g.fill();
      g.beginPath(); g.ellipse( 12 - i*0.4, 1 + i*5.6, 4.8 - i*.5, 4.4, -.3, 0, 7); g.fill();
    }
    return;
  }
  if (st === 'profhair'){
    g.beginPath(); g.ellipse(-11.8,-2.4, 4.6, 6.4, .25, 0, 7);
    g.ellipse( 11.8,-2.4, 4.6, 6.4, -.25, 0, 7); g.fill();
    return;
  }
}

/* hair drawn IN FRONT of the face */
function hairFront(def, o, isBack){
  const st = def.hairStyle;
  g.fillStyle = def.hair;
  if (st === 'bald'){
    /* thin horseshoe low on the sides, shiny crown left bare */
    g.lineWidth = 3.0; g.strokeStyle = def.hair; g.lineCap = 'round';
    g.beginPath(); g.ellipse(0, 0.4, 12.0, 12.4, 0, 0.55, Math.PI-0.55); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.20)';
    g.beginPath(); g.ellipse(-4.4, -8.2, 3.4, 1.8, -0.36, 0, 7); g.fill();
    return;
  }
  if (st === 'hijab'){
    // only the front edge of the scarf, so the face stays clear
    g.save();
    g.beginPath(); g.ellipse(0,-0.6, 15.8, 16.6, 0, 0, 7);
    g.ellipse(0, 1.6, 10.8, 12.0, 0, 0, 7, true);
    g.fill('evenodd');
    g.restore();
    g.strokeStyle='rgba(0,0,0,.13)'; g.lineWidth=1.1;
    g.beginPath(); g.ellipse(0, 1.6, 10.8, 12.0, 0, 0, 7); g.stroke();
    return;
  }
  if (st === 'cap'){
    g.beginPath(); g.ellipse(0,-2.8, 13.0, 9.8, 0, Math.PI, 0); g.fill();
    g.fillStyle = def.accent;
    g.beginPath(); g.ellipse(0,-9.4, 13.0, 7.6, 0, Math.PI, 0); g.fill();
    g.fillStyle = def.accent; rr(3, -11.2, 16, 3.6, 1.8); g.fill();
    return;
  }
  if (st === 'ponytail'){
    g.beginPath(); g.ellipse(0,-3.6, 13.4, 11.8, 0, Math.PI+.12, -.12); g.fill();
    g.beginPath(); g.moveTo(-13.4,-5.6); g.quadraticCurveTo(-3,-15.6, 13.4,-6.6);
    g.lineTo(13.4,-9.4); g.quadraticCurveTo(0,-19,-13.4,-9); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(-9.6,-1.8, 4.2, 7.6, .18, 0, 7); g.fill();
    g.fillStyle = def.accent; g.beginPath(); g.arc(-11.0,-4.2, 2.4, 0, 7); g.fill();
    return;
  }
  if (st === 'bun'){
    g.beginPath(); g.ellipse(0,-3.8, 13.2, 11.4, 0, Math.PI+.16, -.16); g.fill();
    g.beginPath(); g.moveTo(-13.2,-6); g.quadraticCurveTo(0,-16,13.2,-6.6);
    g.lineTo(13.2,-9.6); g.quadraticCurveTo(0,-18.4,-13.2,-9.2); g.closePath(); g.fill();
    return;
  }
  if (st === 'wavy'){
    g.beginPath(); g.ellipse(0,-4.0, 13.8, 12.0, 0, Math.PI+.08, -.08); g.fill();
    g.beginPath(); g.moveTo(-13.8,-5.4); g.quadraticCurveTo(-4,-17,6,-9);
    g.quadraticCurveTo(10,-14,13.8,-7.4); g.lineTo(13.8,-10.6);
    g.quadraticCurveTo(0,-19.6,-13.8,-9.4); g.closePath(); g.fill();
    return;
  }
  if (st === 'spiky'){
    g.beginPath(); g.ellipse(0,-3.4, 13.0, 10.8, 0, Math.PI+.18, -.18); g.fill();
    g.beginPath();
    for (let i=0;i<6;i++){
      const x0 = -11.4 + i*4.6;
      g.moveTo(x0, -8.4); g.lineTo(x0+2.3, -16.4 - (i%2)*3.2); g.lineTo(x0+4.8, -8.4);
    }
    g.fill();
    return;
  }
  if (st === 'profhair'){
    g.beginPath(); g.ellipse(0,-6.4, 12.0, 7.6, 0, Math.PI+.2, -.2); g.fill();
    return;
  }
  /* neat */
  g.beginPath(); g.ellipse(0,-3.6, 13.2, 11.2, 0, Math.PI+.16, -.16); g.fill();
  g.beginPath(); g.moveTo(-13.2,-5.8); g.quadraticCurveTo(-2,-15.4, 13.2,-7.0);
  g.lineTo(13.2,-10.2); g.quadraticCurveTo(0,-18.6,-13.2,-9.4); g.closePath(); g.fill();
}

/* ---------------- speech bubbles ---------------- */
/* typewriter bubble anchored above a person */
function bubble(text, x, y, opt={}){
  const maxw = opt.w || 300;
  g.font = `${opt.weight||400} ${opt.size||18}px "Trebuchet MS",Verdana,sans-serif`;
  // measure wrapped lines
  const words = String(text).split(' ');
  const lines = []; let line = '';
  for (const wd of words){
    const test = line + wd + ' ';
    if (g.measureText(test).width > maxw && line){ lines.push(line.trim()); line = wd + ' '; }
    else line = test;
  }
  lines.push(line.trim());
  const lh = (opt.size||18) * 1.34;
  const bw = Math.min(maxw, Math.max(...lines.map(l=>g.measureText(l).width))) + 34;
  const bh = lines.length * lh + 26;
  const bx = clamp(x - bw/2, 12, W - bw - 12);
  const by = y - bh - 16;

  const pop = opt.pop === undefined ? 1 : clamp(opt.pop,0,1);
  g.save();
  g.translate(bx + bw/2, by + bh);
  g.scale(lerp(.7,1,bounce(pop)), lerp(.5,1,bounce(pop)));
  g.translate(-(bx + bw/2), -(by + bh));

  g.save(); g.shadowColor='rgba(0,0,0,.4)'; g.shadowBlur=14; g.shadowOffsetY=5;
  g.fillStyle = opt.fill || 'rgba(250,252,254,.97)';
  rr(bx, by, bw, bh, 14); g.fill();
  // tail
  g.beginPath();
  g.moveTo(clamp(x,bx+22,bx+bw-22) - 9, by + bh - 1);
  g.lineTo(clamp(x,bx+22,bx+bw-22) + 9, by + bh - 1);
  g.lineTo(clamp(x,bx+20,bx+bw-20),     by + bh + 15);
  g.closePath(); g.fill();
  g.restore();
  g.strokeStyle = opt.stroke || 'rgba(35,166,224,.85)'; g.lineWidth = 2.4;
  rr(bx, by, bw, bh, 14); g.stroke();

  // typewriter reveal
  const shown = opt.reveal === undefined ? 1e9 : Math.floor(opt.reveal);
  let count = 0;
  g.fillStyle = opt.col || '#10222e'; g.textAlign='left'; g.textBaseline='middle';
  g.font = `${opt.weight||400} ${opt.size||18}px "Trebuchet MS",Verdana,sans-serif`;
  for (let i=0;i<lines.length;i++){
    let l = lines[i];
    if (count + l.length > shown) l = l.slice(0, Math.max(0, shown - count));
    g.fillText(l, bx+17, by+17+lh*i+lh/2);
    count += lines[i].length + 1;
    if (count > shown) break;
  }
  g.restore();
  return { done: shown >= lines.join(' ').length, bx, by, bw, bh };
}

/* thought bubble (the coffee hint) */
function thought(text, x, y, opt={}){
  const r = bubble(text, x, y-18, Object.assign({fill:'rgba(252,250,235,.97)', stroke:'rgba(245,181,61,.9)'}, opt));
  g.fillStyle='rgba(252,250,235,.97)'; g.strokeStyle='rgba(245,181,61,.9)'; g.lineWidth=2;
  for (let i=0;i<3;i++){
    const rr2 = 7 - i*2, yy = r.by + r.bh + 4 + i*11;
    g.beginPath(); g.arc(x - i*5, yy, rr2, 0, 7); g.fill(); g.stroke();
  }
  return r;
}

/* ---------- build cloud: the "constructing something" dust bubble ---------- */
/* prog 0..1 ; draws an expanding dust ball with tools orbiting out of it */
function buildCloud(x, y, r, prog){
  const k = clamp(prog,0,1);
  const grow = k < .25 ? easeOut(k/.25) : k > .78 ? 1 - easeIn((k-.78)/.22) : 1;
  if (grow <= 0.01) return;
  g.save();
  g.globalAlpha = grow * .96;
  // layered dust puffs
  for (let i=0;i<14;i++){
    const a = i/14*Math.PI*2 + T*0.012 + i;
    const wob = Math.sin(T/7 + i*1.7)*0.16 + 1;
    const rr2 = r * (0.52 + 0.42*nz(i)) * wob * grow;
    const dx = Math.cos(a) * r * 0.55 * grow;
    const dy = Math.sin(a) * r * 0.40 * grow;
    const shadeV = 200 + Math.floor(nz(i+9)*45);
    g.fillStyle = `rgba(${shadeV},${shadeV-6},${shadeV-18},${0.24 + nz(i+3)*0.2})`;
    g.beginPath(); g.arc(x+dx, y+dy, rr2, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(232,228,214,.35)';
  g.beginPath(); g.arc(x, y, r*0.75*grow, 0, 7); g.fill();
  // orbiting tools
  for (let i=0;i<5;i++){
    const a = T*0.075 + i*1.26;
    const rad = r*(0.85 + Math.sin(T/13+i)*0.14) * grow;
    g.save();
    g.translate(x + Math.cos(a)*rad*1.05, y + Math.sin(a)*rad*0.72);
    g.rotate(a*2.2);
    drawTool(i, 13);
    g.restore();
  }
  // impact stars
  if (Math.random() < 0.28*grow){
    emitSpark(x+rnd(-r*.6,r*.6), y+rnd(-r*.5,r*.5), 1, '#fff3c4');
  }
  g.restore();
}

/* ---------- animated water surface with light reflection ---------- */
/* draws a body of liquid inside (x,y,w,h) with moving highlights */
function liquid(x, y, w, h, opt={}){
  const c1 = opt.c1 || '#1f7fb8', c2 = opt.c2 || '#2fc0e8';
  g.save();
  g.beginPath(); rr(x, y, w, h, opt.r === undefined ? 8 : opt.r); g.clip();
  const gr = g.createLinearGradient(0, y, 0, y+h);
  gr.addColorStop(0, c2); gr.addColorStop(1, c1);
  g.fillStyle = gr; g.fillRect(x, y, w, h);

  // moving caustic bands
  g.globalCompositeOperation = 'lighter';
  for (let i=0;i<5;i++){
    const yy = y + ((T*(0.5+i*0.18) + i*h/5) % (h+40)) - 20;
    g.fillStyle = `rgba(190,245,255,${0.05 + 0.035*Math.sin(T/23+i)})`;
    g.beginPath();
    g.moveTo(x, yy);
    for (let px=0; px<=w; px+=18)
      g.lineTo(x+px, yy + Math.sin(px/38 + T/16 + i)*5);
    g.lineTo(x+w, yy+11);
    for (let px=w; px>=0; px-=18)
      g.lineTo(x+px, yy + 11 + Math.sin(px/38 + T/16 + i)*5);
    g.closePath(); g.fill();
  }
  g.globalCompositeOperation = 'source-over';

  // surface line with specular glints
  if (opt.surface !== false){
    g.strokeStyle = 'rgba(220,250,255,.8)'; g.lineWidth = 2.6;
    g.beginPath();
    for (let px=0; px<=w; px+=8){
      const yy = y + 3 + Math.sin(px/26 + T/13)*2.6 + Math.sin(px/11 - T/19)*1.1;
      g[px?'lineTo':'moveTo'](x+px, yy);
    }
    g.stroke();
    for (let i=0;i<4;i++){
      const px = ((T*0.9 + i*w/4) % w);
      const yy = y + 3 + Math.sin(px/26 + T/13)*2.6;
      g.fillStyle = 'rgba(255,255,255,.9)';
      g.beginPath(); g.ellipse(x+px, yy, 9+Math.sin(T/9+i)*3, 1.9, 0, 0, 7); g.fill();
    }
  }
  // wall reflection sheen
  g.fillStyle = 'rgba(255,255,255,.10)';
  g.beginPath(); g.moveTo(x+w*.12, y); g.lineTo(x+w*.30, y); g.lineTo(x+w*.16, y+h); g.lineTo(x+w*.02, y+h);
  g.closePath(); g.fill();
  g.restore();
}

/* salt crystals suspended / settled in a liquid */
function saltCrystals(x, y, w, h, n, dissolvedK){
  for (let i=0;i<n;i++){
    const sx = x + nz(i)*w;
    const drift = Math.sin(T/26 + i*1.9)*4;
    const settle = easeOut(clamp(dissolvedK,0,1));
    const sy = lerp(y + nz(i+40)*h, y + h - 6 - nz(i+7)*7, settle);
    g.save();
    g.translate(sx + drift, sy + Math.cos(T/31+i)*3);
    g.rotate(T/90 + i);
    g.fillStyle = 'rgba(255,255,255,.95)';
    const s = 2.4 + nz(i+12)*2.6;
    g.fillRect(-s/2,-s/2,s,s);
    g.fillStyle = 'rgba(190,225,240,.7)';
    g.fillRect(-s/2,-s/2,s*.45,s*.45);
    g.restore();
  }
}

/* rising bubbles inside a vessel */
function bubbles(x, y, w, h, n, speed=1){
  for (let i=0;i<n;i++){
    const bx = x + nz(i)*w + Math.sin(T/17 + i*2.3)*4;
    const by = y + h - ((T*speed*(0.7+nz(i+5)*0.9) + i*h/n) % h);
    const r = 1.6 + nz(i+21)*3.2;
    g.fillStyle = 'rgba(235,252,255,.55)';
    g.beginPath(); g.arc(bx, by, r, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = .9;
    g.beginPath(); g.arc(bx, by, r, 0, 7); g.stroke();
  }
}

/* ---------- gauges and readouts ---------- */
function gauge(x, y, r, value, min, max, label, opt={}){
  const k = clamp((value-min)/(max-min), 0, 1);
  g.save();
  g.fillStyle = '#e8eef2'; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  g.strokeStyle = '#4a5a66'; g.lineWidth = 3; g.beginPath(); g.arc(x,y,r,0,7); g.stroke();
  // coloured arc zones
  const a0 = Math.PI*0.75, a1 = Math.PI*2.25;
  const zones = opt.zones || [[0,.3,'#5aa8d8'],[.3,.7,'#3fd07f'],[.7,1,'#ee5f6e']];
  for (const [z0,z1,col] of zones){
    g.strokeStyle = col; g.lineWidth = r*0.2;
    g.beginPath(); g.arc(x,y,r*0.76, lerp(a0,a1,z0), lerp(a0,a1,z1)); g.stroke();
  }
  // needle
  const a = lerp(a0, a1, k);
  g.strokeStyle = '#1b2830'; g.lineWidth = 2.6; g.lineCap='round';
  g.beginPath(); g.moveTo(x - Math.cos(a)*r*.16, y - Math.sin(a)*r*.16);
  g.lineTo(x + Math.cos(a)*r*.72, y + Math.sin(a)*r*.72); g.stroke();
  g.fillStyle = '#1b2830'; g.beginPath(); g.arc(x,y,r*.13,0,7); g.fill();
  if (label) txt(label, x, y + r + 13, Math.max(10,r*0.32), opt.labCol||'#cfe6f2');
  if (opt.readout !== undefined) txt(opt.readout, x, y + r*0.46, r*0.3, '#1b2830');
  g.restore();
}

/* digital panel readout */
function readout(x,y,w,h,lines,opt={}){
  g.fillStyle = opt.bg || '#08181f'; rr(x,y,w,h,6); g.fill();
  g.strokeStyle = opt.stroke || 'rgba(60,220,160,.5)'; g.lineWidth=1.6; rr(x,y,w,h,6); g.stroke();
  lines.forEach((l,i)=> txt(l, x+10, y+16+i*19, opt.size||14, opt.col||'#5ce8a8','left',700));
}

}

  g.fillStyle='rgba(0,0,0,.13)';
  g.beginPath(); g.moveTo(14,-86); g.lineTo(38,-86); g.lineTo(38,-30);
  g.quadraticCurveTo(38,-8,10,-9); g.closePath(); g.fill();

function pipeSeg(x1,y1,x2,y2,w,opt={}){
  g.save(); g.lineCap = opt.cap || 'butt';
  g.strokeStyle = opt.shell || '#8fa3af'; g.lineWidth = w;
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();

  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();
  // specular top edge
  const a = Math.atan2(y2-y1, x2-x1), nx = Math.sin(a)*w*0.26, ny = -Math.cos(a)*w*0.26;
  g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = w*0.16;
  g.beginPath(); g.moveTo(x1+nx,y1+ny); g.lineTo(x2+nx,y2+ny); g.stroke();
  g.restore();
}
function flange(x,y,a,w,ok){
  g.save(); g.translate(x,y); g.rotate(a);
  g.fillStyle = ok ? '#9fb0bb' : 'rgba(150,170,182,.35)';

/* flow dots travelling along a path of points */
function flowDots(pts, speed, amount, col='rgba(160,235,255,.95)', size=4){
  if (!pts.length || amount<=0) return;
  let total = 0; const segs = [];
  for (let i=1;i<pts.length;i++){
    const d = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    segs.push(d); total += d;
  }
  const n = Math.max(2, Math.floor(total/44));
  for (let i=0;i<n;i++){
    let d = ((T*speed + i*total/n) % total);
    for (let s=0;s<segs.length;s++){
      if (d <= segs[s]){
        const k = d/segs[s];
        const x = lerp(pts[s][0], pts[s+1][0], k), y = lerp(pts[s][1], pts[s+1][1], k);
        g.fillStyle = col; g.globalAlpha = amount;
        g.beginPath(); g.arc(x, y, size, 0, 7); g.fill(); g.globalAlpha = 1;
        break;
      }
      d -= segs[s];
    }
  }
}

const G = {
  got:   { sep:0, rea:0, flu:0, hea:0, the:0, saf:0 },
  maxp:  { sep:0, rea:0, flu:0, hea:0, the:0, saf:0 },

  ppe:   { goggles:false, coat:false, hat:false },

  hintUsed: {},              // per station

  reset(){
    for (const k in this.got){ this.got[k]=0; this.maxp[k]=0; }
    this.done = {}; this.ppe = {goggles:false,coat:false,hat:false}; this.ppeTries=0;
    this.sheet=false; this.hintUsed={}; this.blunders=0;
  }
};

/* award(key, earned, possible) */
function award(key, earned, possible){
  G.got[key]  += earned;
  G.maxp[key] += possible;
}
function finalScore(){
  let s = 0;
  for (const k in WEIGHT){
    const m = G.maxp[k] || 1;
    s += WEIGHT[k] * clamp(G.got[k]/m, 0, 1);
  }
  return Math.round(s * 100);
}
function subjectPct(k){
  const m = G.maxp[k]; if (!m) return 0;
  return Math.round(100 * G.got[k] / m);
}

/* ---------------- skill behaviour ----------------
   2 strong : the engineer spots it immediately (free ghost hint)
   1 ok     : no help up front, works it out after one wrong attempt
   0 weak   : no help, and offers a confidently wrong opinion

function skill(k){ return hero.stats[k] === undefined ? 1 : hero.stats[k]; }
function isStrong(k){ return skill(k) === 2; }
function isWeak(k){ return skill(k) === 0; }

/* ============================================================
   Conversation runner
   lines: [{ by, text, face, talk, at:()=>[x,y], w }]
   `by` is only a label; `at` decides where the bubble points.
   ============================================================ */
function Convo(lines, onDone, opt={}){
  return {
    i:0, chars:0, done:false, pop:0,
    get line(){ return lines[Math.min(this.i, lines.length-1)]; },
    advance(){
      const l = this.line;
      if (this.chars < l.text.length){ this.chars = l.text.length; return; }
      this.i++; this.chars = 0; this.pop = 0;
      if (this.i >= lines.length){ this.done = true; onDone && onDone(); }
    },
    /* call every frame; returns the current line so the scene can animate the speaker */
    draw(){
      if (this.done) return null;
      const l = this.line;
      this.chars = Math.min(l.text.length, this.chars + dt * (opt.speed || 1.15));
      this.pop = Math.min(1, this.pop + dt/9);
      const [ax, ay] = l.at ? l.at() : [W/2, H*0.55];
      const b = bubble(l.text, ax, ay, {
        w: l.w || opt.w || 330, size: opt.size || 18,
        reveal: this.chars, pop: this.pop,
        fill: l.think ? 'rgba(252,250,235,.97)' : 'rgba(250,252,254,.97)',
        stroke: l.think ? 'rgba(245,181,61,.9)' : 'rgba(35,166,224,.85)'
      });
      if (l.by && l.name !== false){
        const nw = 14 + l.by.length * 8.4;
        g.fillStyle = l.think ? 'rgba(245,181,61,.92)' : 'rgba(35,166,224,.92)';
        rr(b.bx + 12, b.by - 13, nw, 22, 7); g.fill();
        txt(l.by, b.bx + 12 + nw/2, b.by - 2, 14, '#04121a');
      }
      const ready = this.chars >= l.text.length;
      if (ready){
        const blink = (Math.sin(T/12)*.5+.5);
        txt('▼', ax, ay - 4 + Math.sin(T/12)*2, 16, `rgba(35,166,224,${.45+blink*.55})`);
      }
      if (mouse.click || keyPressed(' ','Enter','Space')) { SFX.click(); this.advance(); }
      return l;
    },
    /* true while the given speaker label is the one talking */
    speaking(who){ return !this.done && this.line.by === who && this.chars < this.line.text.length; }
  };
}

/* helper: is this convo line from the hero? */
function heroTalking(c){ return c && !c.done && c.line.by === hero.name; }

    g.save();
    g.globalAlpha = 1 - outK;

    const cx = W/2 - 96, cy = H/2 - 16;

    /* wordmark: letters rise and settle */
    const word = 'AIChE';
    g.textAlign='left'; g.textBaseline='middle';
    const sizes = [128,128,96,128,128];
    const widths = [];
    for (let i=0;i<word.length;i++){
      g.font = `700 ${sizes[i]}px "Trebuchet MS",Verdana,sans-serif`;
      widths.push(g.measureText(word[i]).width * 0.94);
    }
    const totalW = widths.reduce((a,b)=>a+b,0);
    let px = cx - totalW/2 - 40;
    for (let i=0;i<word.length;i++){
      const d = i*11;
      const k = clamp((tt - 8 - d)/26, 0, 1);
      const e = bounce(clamp(k,0,1));
      g.save();
      g.globalAlpha = (1-outK) * clamp(k*1.6,0,1);
      g.translate(px + widths[i]/2, cy + (1-e) * 90);
      g.scale(1, lerp(1.35, 1, e));
      g.fillStyle = '#1e9cd7';
      g.font = `700 ${sizes[i]}px "Trebuchet MS",Verdana,sans-serif`;
      g.textAlign='center';
      g.fillText(word[i], 0, 0);
      g.restore();
      px += widths[i];
    }

    /* dotted globe assembling from scattered dots */
    g.save();
    g.translate(cx + totalW/2 + 118, cy - 4);
    const R = 74, rows = 11, cols = 13;
    for (let r=0;r<rows;r++) for (let c=0;c<cols;c++){
      const u = (c/(cols-1)-.5)*2, v = (r/(rows-1)-.5)*2;
      const d2 = u*u + v*v; if (d2 > 1.02) continue;

      const e = easeOut(k);
      // fly in from a random offset
      const sx = (nz(idx)-.5) * 420, sy = (nz(idx+77)-.5) * 320;
      const tx = u*R, ty = v*R;
      const x = lerp(tx + sx, tx, e), y = lerp(ty + sy, ty, e);
      // squares shrink toward the rim like the real mark
      const sq = 8.4 * (1 - d2*0.30);
      g.globalAlpha = (1-outK) * e;
      g.fillStyle = '#1e9cd7';
      g.fillRect(x - sq/2, y - sq/2, sq, sq);
    }
    g.restore();

    /* tagline */
    const tk = clamp((tt-130)/30,0,1);
    g.globalAlpha = (1-outK) * tk;
    txt('The Global Home of Chemical Engineers', W/2, H/2 + 108, 30, '#111', 'center', 400);
    g.globalAlpha = (1-outK) * clamp((tt-160)/30,0,1);
    txt('presents', W/2, H/2 + 158, 17, 'rgba(20,20,20,.45)', 'center', 400);

    g.restore();

    if (tt > 250 || this.skipped) go(S_menu);
    if (tt > 30 && (mouse.click || keyPressed(' ','Enter','Escape'))) this.skipped = true;
    if (tt < 240) txt('click to skip', W-90, H-28, 13, 'rgba(0,0,0,.28)', 'center', 400);

};

const WALL_TOP = 300;        // top of the back wall
const GROUND   = 512;        // where the wall meets the floor
const FLOOR_LO = 524, FLOOR_HI = H - 42;

/* ---- reusable yard scenery ---- */
function storageTank(x, y, w, h, col, label){
  g.fillStyle = col; rr(x - w/2, y - h, w, h, 6); g.fill();
  g.fillStyle = 'rgba(0,0,0,.16)'; rr(x + w/2 - w*0.3, y - h, w*0.3, h, 6); g.fill();
  g.fillStyle = 'rgba(255,255,255,.10)'; rr(x - w/2 + 4, y - h, w*0.16, h, 4); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 1.6;
  for (let i = 1; i < 3; i++){
    g.beginPath(); g.moveTo(x-w/2, y-h*i/3); g.lineTo(x+w/2, y-h*i/3); g.stroke();
  }
  g.fillStyle = col; g.beginPath(); g.ellipse(x, y-h, w/2, w*0.17, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.ellipse(x, y-h, w/2, w*0.17, 0, Math.PI, 0); g.fill();
  g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=1.4; rr(x - w/2, y - h, w, h, 6); g.stroke();
  if (label) txt(label, x, y - h/2, 11, 'rgba(255,255,255,.45)');
}
function barrel(x, y, s, col){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(0,0,13,3.6,0,0,7); g.fill();
  g.fillStyle=col; rr(-11,-30,22,30,3); g.fill();
  g.fillStyle='rgba(0,0,0,.18)'; rr(4,-30,7,30,3); g.fill();
  g.fillStyle='rgba(255,255,255,.14)'; rr(-9,-30,3.4,30,2); g.fill();
  g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(-11,-22); g.lineTo(11,-22); g.moveTo(-11,-9); g.lineTo(11,-9); g.stroke();
  g.fillStyle=col; g.beginPath(); g.ellipse(0,-30,11,3.2,0,0,7); g.fill();
  g.fillStyle='rgba(255,255,255,.16)'; g.beginPath(); g.ellipse(0,-30,11,3.2,0,Math.PI,0); g.fill();
  g.restore();
}
function crate(x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(0,0,17,4,0,0,7); g.fill();
  g.fillStyle='#8a6034'; rr(-16,-30,32,30,3); g.fill();
  g.fillStyle='#6d4a27'; rr(6,-30,10,30,3); g.fill();
  g.strokeStyle='#5c3f22'; g.lineWidth=2.4;
  g.beginPath(); g.moveTo(-16,-30); g.lineTo(16,0); g.moveTo(16,-30); g.lineTo(-16,0); g.stroke();
  g.strokeStyle='#5c3f22'; g.lineWidth=2; rr(-16,-30,32,30,3); g.stroke();
  g.restore();
}
function hazardSign(x,y,s,kind){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#8a939a'; g.fillRect(-2,-26,4,26);
  g.fillStyle='#f5c22b';
  g.beginPath(); g.moveTo(0,-56); g.lineTo(16,-28); g.lineTo(-16,-28); g.closePath(); g.fill();
  g.strokeStyle='#2b2b2b'; g.lineWidth=2.2;
  g.beginPath(); g.moveTo(0,-56); g.lineTo(16,-28); g.lineTo(-16,-28); g.closePath(); g.stroke();
  g.fillStyle='#2b2b2b';
  if (kind === 'ppe'){ g.fillRect(-1.6,-46,3.2,10); g.beginPath(); g.arc(0,-33,1.9,0,7); g.fill(); }
  else { g.beginPath(); g.moveTo(2,-48); g.lineTo(-5,-38); g.lineTo(-0.5,-38);
         g.lineTo(-3,-31); g.lineTo(5,-41); g.lineTo(0.5,-41); g.closePath(); g.fill(); }
  g.restore();
}

const S_hub = {
  enter(){
    Music.play('work');
    if (this.px === undefined){ this.px = W/2; this.py = 610; }
    this.face = 'right'; this.walkT = 0; this.stepT = 0; this.nearS = null;
  },
  allDone(){ return STATIONS.every(s => G.done[s.key]); },

  draw(){
    /* ================= sky ================= */
    const sky = g.createLinearGradient(0,0,0,WALL_TOP+40);
    sky.addColorStop(0,'#123c56'); sky.addColorStop(.6,'#215f7c'); sky.addColorStop(1,'#37809b');
    g.fillStyle = sky; g.fillRect(0,0,W,WALL_TOP+40);

    /* distant plant silhouette */
    for (let i=0;i<16;i++){
      const x = i*84 - 20, h = 40 + nz(i)*110;
      g.fillStyle = 'rgba(12,42,60,.5)';
      g.fillRect(x, WALL_TOP - h, 24, h + 20);
      g.fillRect(x+24, WALL_TOP - h*0.55, 10, h*0.55 + 20);
    }
    /* stacks with drifting plumes */
    for (const sx of [120, 520, 880, 1180]){
      g.fillStyle='rgba(9,34,50,.72)'; g.fillRect(sx-11, WALL_TOP-190, 22, 190);
      g.fillStyle='rgba(245,120,80,.5)'; g.fillRect(sx-13, WALL_TOP-196, 26, 8);
      for (let s=0;s<7;s++){
        const t2 = (T*0.42 + s*34 + sx) % 238;
        g.fillStyle = `rgba(226,238,244,${0.13*(1-t2/238)})`;
        g.beginPath();
        g.arc(sx + Math.sin(t2/26 + sx)*22, WALL_TOP-196 - t2*0.52, 9 + t2*0.085, 0, 7);
        g.fill();
      }
    }

    /* ================= overhead pipe rack ================= */
    g.fillStyle='#0f3348'; g.fillRect(0, 74, W, 14);
    for (let i=0;i<4;i++)
      pipeSeg(-10, 96+i*13, W+10, 96+i*13, 11,
              {shell: i%2?'#2d6683':'#336f8d', inner: i%2?'#1c475e':'#215068'});
    for (let i=0;i<8;i++){
      g.fillStyle='#10394f'; g.fillRect(i*170+50, 88, 15, 64);
      g.fillStyle='#0b2b3c'; g.fillRect(i*170+50, 148, 15, 10);
    }
    // flow inside the top pipe
    flowDots([[0,96],[W,96]], 1.6, .5, 'rgba(150,235,255,.5)', 3);

    /* ================= back wall ================= */
    const wall = g.createLinearGradient(0,WALL_TOP,0,GROUND);
    wall.addColorStop(0,'#1b4a63'); wall.addColorStop(1,'#10364b');
    g.fillStyle = wall; g.fillRect(0, WALL_TOP, W, GROUND-WALL_TOP);
    // corrugation
    for (let i=0;i<W/26;i++){
      g.fillStyle = i%2 ? 'rgba(255,255,255,.022)' : 'rgba(0,0,0,.05)';
      g.fillRect(i*26, WALL_TOP, 13, GROUND-WALL_TOP);
    }
    // top capping beam
    g.fillStyle='#0d2c3e'; g.fillRect(0, WALL_TOP-10, W, 14);
    g.fillStyle='rgba(255,255,255,.05)'; g.fillRect(0, WALL_TOP-10, W, 3);
    // rust streaks
    for (let i=0;i<14;i++){
      g.fillStyle='rgba(120,70,40,.10)';
      g.fillRect(nz(i)*W, WALL_TOP, 7, 30 + nz(i+4)*90);
    }

    /* ================= doors ================= */
    this.nearS = null;
    const DW = 118, DH = 172;
    for (const s of STATIONS){
      const done = !!G.done[s.key];
      const dy = GROUND - DH;
      const near = Math.abs(this.px - s.x) < 74 && this.py < 630;
      if (near && !done) this.nearS = s;

      // recessed frame
      g.fillStyle='#0a2433'; rr(s.x-DW/2-9, dy-11, DW+18, DH+11, 7); g.fill();
      // interior
      const gr = g.createLinearGradient(0, dy, 0, GROUND);
      if (done){ gr.addColorStop(0,'#061c16'); gr.addColorStop(.55,'#0b2b22');
                 gr.addColorStop(1,'rgba(40,120,90,.55)'); }
      else { gr.addColorStop(0,'#04141e'); gr.addColorStop(.55,'#07202e');
             gr.addColorStop(1,`rgba(46,140,185,${(near?.68:.34)+Math.sin(T/26)*.06})`); }
      g.fillStyle = gr; rr(s.x-DW/2, dy, DW, DH, 5); g.fill();
      // silhouetted contents hint
      g.save(); g.beginPath(); rr(s.x-DW/2, dy, DW, DH, 5); g.clip();
      g.fillStyle='rgba(2,10,16,.62)';
      if (s.key==='sep'){ g.fillRect(s.x-28, dy+40, 18, DH); g.fillRect(s.x+10, dy+66, 22, DH); }
      if (s.key==='rea'){ g.beginPath(); g.arc(s.x, dy+120, 30, 0, 7); g.fill(); g.fillRect(s.x-4, dy+50, 8, 60); }
      if (s.key==='flu'){ g.fillRect(s.x-40, dy+96, 80, 12); g.fillRect(s.x-12, dy+56, 12, 52); }
      if (s.key==='hea'){ g.fillRect(s.x-34, dy+80, 26, DH); g.fillRect(s.x+8, dy+80, 26, DH); }
      if (s.key==='brk'){ g.fillRect(s.x-32, dy+104, 64, 18); g.fillRect(s.x-26, dy+122, 10, 40); g.fillRect(s.x+16, dy+122, 10, 40); }
      g.restore();
      // light spill
      g.save(); g.globalAlpha = done ? .12 : .20;
      const sp = g.createLinearGradient(0, GROUND, 0, GROUND+86);
      sp.addColorStop(0, done ? '#3fd07f' : s.col); sp.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle = sp;
      g.beginPath(); g.moveTo(s.x-DW/2, GROUND); g.lineTo(s.x+DW/2, GROUND);
      g.lineTo(s.x+DW/2+34, GROUND+86); g.lineTo(s.x-DW/2-34, GROUND+86); g.closePath(); g.fill();
      g.restore();
      // frame trim
      g.strokeStyle = done ? '#3fd07f' : s.col;
      g.lineWidth = (near && !done) ? 4 : 2.4;
      rr(s.x-DW/2, dy, DW, DH, 5); g.stroke();

      // sign board above the door
      const SW = 176;
      g.save(); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=10; g.shadowOffsetY=3;
      g.fillStyle='rgba(5,22,33,.96)'; rr(s.x-SW/2, dy-58, SW, 44, 7); g.fill();
      g.restore();
      g.strokeStyle = done ? '#3fd07f' : s.col; g.lineWidth=2; rr(s.x-SW/2, dy-58, SW, 44, 7); g.stroke();
      const words = s.name.split(' ');
      const cut = words.length > 2 ? words.length-1 : 1;
      txt(words.slice(0,cut).join(' '), s.x, dy-45, 13, done?'#8fe8b8':'#e2eef5');
      txt(words.slice(cut).join(' '),   s.x, dy-29, 13, done?'#8fe8b8':'#e2eef5');
      if (done){
        g.fillStyle='#3fd07f'; g.beginPath(); g.arc(s.x+SW/2-15, dy-51, 9, 0, 7); g.fill();
        g.strokeStyle='#04121a'; g.lineWidth=2.4; g.lineCap='round';
        g.beginPath(); g.moveTo(s.x+SW/2-19, dy-51); g.lineTo(s.x+SW/2-16, dy-47.5);
        g.lineTo(s.x+SW/2-11, dy-55); g.stroke();
      }
    }

    /* ================= yard props against the wall ================= */
    storageTank(292, GROUND, 58, 118, '#5d7684', 'N2');
    storageTank(548, GROUND, 46, 96,  '#6a6f84', 'H2O');
    storageTank(788, GROUND, 52, 108, '#7a6a5e', 'FUEL');
    storageTank(1030, GROUND, 40, 84, '#5d7684');
    // vertical pipes running off the tanks
    for (const tx of [292, 548, 788, 1030]){
      pipeSeg(tx+28, GROUND-60, tx+28, 158, 7, {shell:'#2f6480', inner:'#1e4459'});
    }
    hazardSign(238, GROUND+2, 1, 'ppe');
    hazardSign(1082, GROUND+2, 1, 'elec');
    barrel(330, GROUND+6, 1, '#d8a832');
    barrel(352, GROUND+4, .88, '#c94a3c');
    crate(588, GROUND+6, .95);
    barrel(836, GROUND+5, 1, '#3f8ad0');
    // wall vents with steam
    for (const vx of [470, 962]){
      g.fillStyle='#0a2432'; rr(vx-18, GROUND-64, 36, 26, 4); g.fill();
      g.strokeStyle='#17475f'; g.lineWidth=2;
      for (let i=0;i<3;i++){ g.beginPath(); g.moveTo(vx-14, GROUND-58+i*7); g.lineTo(vx+14, GROUND-58+i*7); g.stroke(); }
      if (Math.random()<.10) emitSteam(vx, GROUND-64, 1, {speed:.7});
    }

    /* ================= floor ================= */
    const fl = g.createLinearGradient(0,GROUND,0,H);
    fl.addColorStop(0,'#1d4a5f'); fl.addColorStop(1,'#0c2635');
    g.fillStyle = fl; g.fillRect(0, GROUND, W, H-GROUND);
    g.strokeStyle='rgba(255,255,255,.03)'; g.lineWidth=2;
    for (let i=-6;i<24;i++){ g.beginPath(); g.moveTo(i*76, GROUND); g.lineTo(i*76-130, H); g.stroke(); }
    for (let y=GROUND+18;y<H;y+=28){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
    // hazard-striped walkway edge
    for (let i=0;i<W/22;i++){
      g.fillStyle = i%2 ? 'rgba(245,181,61,.55)' : 'rgba(30,40,48,.55)';
      g.fillRect(i*22, GROUND+3, 22, 6);
    }
    // a puddle that catches the door light
    g.fillStyle='rgba(120,200,235,.07)';
    g.beginPath(); g.ellipse(700, 660, 90, 20, 0, 0, 7); g.fill();
    g.strokeStyle='rgba(160,220,245,.10)'; g.lineWidth=1.5;
    g.beginPath(); g.ellipse(700, 660, 90, 20, 0, 0, 7); g.stroke();

    /* ================= movement ================= */
    let dx=0, dy=0;
    if (keys.ArrowLeft||keys.a||keys.A) dx--;
    if (keys.ArrowRight||keys.d||keys.D) dx++;
    if (keys.ArrowUp||keys.w||keys.W) dy--;
    if (keys.ArrowDown||keys.s||keys.S) dy++;
    const moving = (dx||dy) && !trans;
    if (dx) this.face = dx>0 ? 'right' : 'left';
    if (moving){
      const n = Math.hypot(dx,dy) || 1;
      this.px = clamp(this.px + dx/n*3.6*dt, 40, W-40);
      this.py = clamp(this.py + dy/n*2.2*dt, FLOOR_LO, FLOOR_HI);
      this.walkT += dt*2.4;
      this.stepT += dt;
      if (this.stepT > 12){ this.stepT = 0; SFX.step();
        spawn({x:this.px, y:this.py, vx:rnd(-.5,.5), vy:rnd(-.6,-.15), life:24, max:24,
               size:rnd(3,6), col:'rgba(190,215,228,.30)', kind:'puff'}); }
    } else this.walkT = 0;

    /* ================= the boss, once everything is done ================= */
    const all = this.allDone();
    if (all){
      const bx = 1240, by = 600;
      drawPerson(NPCS.boss, bx, by, 2.1, { dir:'left', face:'neutral', seed:2 });
      const near = Math.hypot(this.px-bx, this.py-by) < 120;
      bubble(near ? 'Right. Let us talk about your day.' : 'Over here, graduate.',
             bx-30, by-96, {w:216, size:16, pop:1});
      if (near){
        txt('SPACE', bx-30, by+22, 13, '#f5b53d');
        if (keyPressed(' ','Enter','Space')){ SFX.click(); go(S_end, 'fade'); }
      }
    }

    drawParts();

    /* ================= the player ================= */
    drawPerson(hero, this.px, this.py, 2.05, {
      dir: this.face, walk: this.walkT,
      face: this.nearS ? 'happy' : 'neutral', seed:5,
      ppe:{ hat:true, goggles: G.ppe.goggles, coat: G.ppe.coat }
    });

    if (this.nearS){
      const s = this.nearS, yy = this.py - 218;
      g.save(); g.shadowColor='rgba(0,0,0,.5)'; g.shadowBlur=12;
      g.fillStyle='rgba(5,22,33,.96)'; rr(this.px-118, yy-24, 236, 42, 10); g.fill(); g.restore();
      g.strokeStyle=s.col; g.lineWidth=2.2; rr(this.px-118, yy-24, 236, 42, 10); g.stroke();
      txt('SPACE   —   go inside', this.px, yy-2, 17, '#eaf4fa');
      if (keyPressed(' ','Enter','Space')){
        SFX.click(); Hint.begin(s.key); go(s.scene(), 'fade');
      }
    }

    vignette(.36);

    const left = STATIONS.filter(s=>!G.done[s.key]).length;
    hudEl.textContent = all
      ? 'All stations complete  —  report to Mr. Tarek'
      : `${hero.name}   ·   stations left ${left}   ·   score ${finalScore()}/100`;
  }
};

/* ===== 99-boot.js ===== */
/* ============================================================
   Boot — wait for a gesture so audio is allowed, then run
   ============================================================ */
const tapEl = document.getElementById('tapstart');

/* #sep #rea #flu #hea #brk #hub #end jump straight to a scene, for testing
   and for running a single station at a booth. #mute silences the music.   */
function devScene(){
  const h = (location.hash || '').slice(1).split(',');
  const map = { sep:()=>S_sep, rea:()=>S_rea, flu:()=>S_flu, hea:()=>S_hea,
                brk:()=>S_brk, hub:()=>S_hub, end:()=>S_end, select:()=>S_select };
  let target = null;
  for (const part of h){
    if (part === 'mute' && musicGain) musicGain.gain.value = 0;
    if (map[part]) target = map[part]();
  }
  return target;
}

function boot(){
  tapEl.removeEventListener('click', boot);
  tapEl.classList.add('gone');
  initAudio(); resumeAudio();
  const jump = devScene();
  if (jump){
    for (const s of STATIONS) if (s.key !== 'brk') { /* keep scoring sane when jumping */ }
    Hint.begin('dev');
    go(jump);
  } else go(S_logo);
  requestAnimationFrame(frame);
}
tapEl.addEventListener('click', boot);
addEventListener('keydown', function once(e){
  if (!tapEl.classList.contains('gone')){ removeEventListener('keydown', once); boot(); }
});
addEventListener('click', resumeAudio);
addEventListener('keydown', resumeAudio);

/* keep the canvas crisp on high-dpi displays */
function fitCanvas(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if (cv.width !== Math.round(W) ) { /* logical size stays 1280x720 */ }
  cv.style.width = r.width + 'px';
}
addEventListener('resize', fitCanvas);

})();
